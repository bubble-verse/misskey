<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Bubble Verse — 去中心化社群宇宙</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f13;--panel:#1a1a24;--panel2:#22222f;
  --accent:#7c3aed;--accent2:#a855f7;
  --pink:#ec4899;--teal:#14b8a6;--orange:#f97316;--purple:#8b5cf6;
  --text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;
  --border:#2d2d3d;--radius:12px;--radius-sm:8px;
  --sidebar:240px;
}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;font-size:15px;line-height:1.5;min-height:100vh}
a{color:inherit;text-decoration:none}
button{cursor:pointer;border:none;background:none;color:inherit;font:inherit}
input,textarea,select{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;width:100%;outline:none;transition:border .2s}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:80px}
img{max-width:100%}
.hidden{display:none!important}

/* ── Scrollbar ── */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* ── Layout ── */
#app{display:flex;min-height:100vh}
#sidebar{width:var(--sidebar);background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:20px 12px;position:fixed;top:0;left:0;height:100vh;overflow-y:auto;z-index:100;transition:transform .3s}
#main{margin-left:var(--sidebar);flex:1;min-height:100vh}
#content{max-width:900px;margin:0 auto;padding:24px 20px}

/* ── Sidebar ── */
.logo{display:flex;align-items:center;gap:10px;padding:8px 12px;margin-bottom:20px}
.logo-orb{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--pink));position:relative;overflow:hidden;flex-shrink:0}
.logo-orb::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.3),transparent 60%)}
.logo-text{font-size:17px;font-weight:700;background:linear-gradient(135deg,var(--accent2),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:var(--radius-sm);cursor:pointer;transition:background .15s,color .15s;color:var(--text2);font-size:14px;font-weight:500;margin-bottom:2px}
.nav-item:hover{background:var(--panel2);color:var(--text)}
.nav-item.active{background:rgba(124,58,237,.18);color:var(--accent2)}
.nav-item i{font-size:18px;width:22px;text-align:center;flex-shrink:0}
.nav-divider{height:1px;background:var(--border);margin:10px 0}
.sidebar-user{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--radius-sm);margin-top:auto}
.sidebar-user .uname{font-size:13px;font-weight:600}
.sidebar-user .uhandle{font-size:12px;color:var(--text3)}

/* ── Avatar ── */
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0;color:#fff}
.avatar-sm{width:32px;height:32px;font-size:13px}
.avatar-md{width:44px;height:44px;font-size:17px}
.avatar-lg{width:72px;height:72px;font-size:28px}
.avatar-xl{width:96px;height:96px;font-size:38px}

/* ── Auth ── */
#auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);position:relative;overflow:hidden}
.auth-orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.25;animation:float 8s ease-in-out infinite}
.auth-orb:nth-child(1){width:400px;height:400px;background:var(--accent);top:-100px;left:-100px;animation-delay:0s}
.auth-orb:nth-child(2){width:300px;height:300px;background:var(--pink);bottom:-80px;right:-80px;animation-delay:-3s}
.auth-orb:nth-child(3){width:200px;height:200px;background:var(--teal);top:50%;left:50%;animation-delay:-5s}
@keyframes float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-30px) scale(1.05)}}
.auth-card{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:36px;width:100%;max-width:420px;position:relative;z-index:1}
.auth-logo{text-align:center;margin-bottom:24px}
.auth-logo .orb-big{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--pink));margin:0 auto 12px;position:relative;overflow:hidden}
.auth-logo .orb-big::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.35),transparent 60%)}
.auth-logo h1{font-size:26px;font-weight:800;background:linear-gradient(135deg,var(--accent2),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.auth-logo p{color:var(--text3);font-size:13px;margin-top:4px}
.tabs{display:flex;background:var(--panel2);border-radius:var(--radius-sm);padding:4px;margin-bottom:20px;gap:4px}
.tab-btn{flex:1;padding:8px;border-radius:6px;font-size:14px;font-weight:600;color:var(--text3);transition:all .2s}
.tab-btn.active{background:var(--accent);color:#fff}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:13px;font-weight:500;color:var(--text2);margin-bottom:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 20px;border-radius:var(--radius-sm);font-weight:600;font-size:14px;transition:all .2s;cursor:pointer}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent2)}
.btn-full{width:100%}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text2)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn-pink{background:var(--pink);color:#fff}
.btn-pink:hover{opacity:.9}
.btn-teal{background:var(--teal);color:#fff}
.btn-sm{padding:6px 14px;font-size:13px}
.btn-danger{background:#ef4444;color:#fff}
.btn-danger:hover{background:#dc2626}

/* ── Cards / Panels ── */
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.card-sm{padding:14px}

/* ── Story Bar ── */
.story-bar{display:flex;gap:12px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
.story-bar::-webkit-scrollbar{display:none}
.story-circle{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;flex-shrink:0}
.story-ring{width:64px;height:64px;border-radius:50%;padding:3px;background:linear-gradient(135deg,var(--orange),var(--pink));transition:transform .2s}
.story-ring.seen{background:var(--border)}
.story-ring:hover{transform:scale(1.05)}
.story-inner{width:100%;height:100%;border-radius:50%;border:2px solid var(--bg);overflow:hidden;display:flex;align-items:center;justify-content:center}
.story-name{font-size:11px;color:var(--text2);max-width:64px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.add-story-btn{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;flex-shrink:0}
.add-story-ring{width:64px;height:64px;border-radius:50%;border:2px dashed var(--border);display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--text3);transition:all .2s}
.add-story-ring:hover{border-color:var(--accent);color:var(--accent)}

/* ── Post Composer ── */
.composer{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.composer-top{display:flex;gap:12px;align-items:flex-start}
.composer-input{flex:1}
.composer-input textarea{background:transparent;border:none;border-bottom:1px solid var(--border);border-radius:0;padding:8px 0;font-size:15px;resize:none}
.composer-input textarea:focus{border-bottom-color:var(--accent)}
.composer-actions{display:flex;gap:8px;margin-top:10px;align-items:center}
.composer-actions button{padding:6px 10px;border-radius:6px;font-size:13px;color:var(--text3);display:flex;align-items:center;gap:6px;transition:all .15s}
.composer-actions button:hover{background:var(--panel2);color:var(--accent)}
.composer-actions .post-btn{margin-left:auto;background:var(--accent);color:#fff;padding:8px 20px;border-radius:20px;font-weight:600}
.composer-actions .post-btn:hover{background:var(--accent2)}

/* ── Posts ── */
.post{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;transition:border-color .15s}
.post:hover{border-color:var(--accent2)}
.post-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.post-meta{flex:1}
.post-meta .dname{font-weight:600;font-size:14px}
.post-meta .handle{font-size:12px;color:var(--text3)}
.post-meta .time{font-size:12px;color:var(--text3);margin-left:8px}
.post-content{font-size:15px;line-height:1.6;margin-bottom:12px}
.post-actions{display:flex;gap:4px}
.post-action{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:20px;font-size:13px;color:var(--text3);transition:all .15s}
.post-action:hover{background:rgba(124,58,237,.1);color:var(--accent)}
.post-action.liked{color:#ef4444}
.post-action.liked:hover{background:rgba(239,68,68,.1)}
.post-action.reposted{color:var(--teal)}

/* ── Poll ── */
.poll-container{background:var(--panel2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;margin-bottom:12px}
.poll-question{font-weight:600;margin-bottom:12px}
.poll-option{margin-bottom:8px}
.poll-option-btn{width:100%;text-align:left;padding:10px 14px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--panel);color:var(--text);font-size:14px;transition:all .2s;cursor:pointer;position:relative;overflow:hidden}
.poll-option-btn:hover{border-color:var(--accent)}
.poll-option-btn.voted{border-color:var(--accent);cursor:default}
.poll-bar{position:absolute;top:0;left:0;height:100%;background:rgba(124,58,237,.2);transition:width .6s ease;border-radius:var(--radius-sm)}
.poll-option-text{position:relative;z-index:1;display:flex;justify-content:space-between}
.poll-meta{font-size:12px;color:var(--text3);margin-top:8px}
.poll-create{background:var(--panel2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;margin-top:10px}
.poll-create h4{margin-bottom:10px;font-size:14px}
.poll-options-list{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.poll-option-input{display:flex;gap:6px;align-items:center}
.poll-option-input input{flex:1}
.poll-option-input button{flex-shrink:0;width:30px;height:30px;border-radius:50%;background:var(--panel);border:1px solid var(--border);color:var(--text3);display:flex;align-items:center;justify-content:center}

/* ── Trending Tags ── */
.tag-bar{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none;margin-bottom:16px}
.tag-bar::-webkit-scrollbar{display:none}
.tag-pill{padding:6px 14px;border-radius:20px;background:var(--panel2);border:1px solid var(--border);font-size:13px;color:var(--text2);white-space:nowrap;cursor:pointer;transition:all .2s;flex-shrink:0}
.tag-pill:hover,.tag-pill.active{background:rgba(124,58,237,.2);border-color:var(--accent);color:var(--accent2)}

/* ── Masonry ── */
.masonry{columns:2;column-gap:14px}
@media(max-width:600px){.masonry{columns:1}}
.masonry-item{break-inside:avoid;margin-bottom:14px}
.verse-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px;transition:border-color .15s}
.verse-card:hover{border-color:var(--accent2)}
.verse-card h3{font-size:15px;font-weight:600;margin-bottom:8px}
.verse-card p{font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:12px}
.verse-stats{display:flex;gap:12px;font-size:12px;color:var(--text3)}
.verse-stats span{display:flex;align-items:center;gap:4px;cursor:pointer;transition:color .15s}
.verse-stats span:hover{color:var(--accent2)}

/* ── Galaxies ── */
.galaxy-hero{background:linear-gradient(135deg,rgba(124,58,237,.3),rgba(236,72,153,.2));border:1px solid var(--border);border-radius:var(--radius);padding:32px;text-align:center;margin-bottom:20px}
.galaxy-hero h1{font-size:28px;font-weight:800;background:linear-gradient(135deg,var(--purple),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
.filter-pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.filter-pill{padding:6px 14px;border-radius:20px;background:var(--panel2);border:1px solid var(--border);font-size:13px;color:var(--text2);cursor:pointer;transition:all .2s}
.filter-pill:hover,.filter-pill.active{background:rgba(139,92,246,.2);border-color:var(--purple);color:var(--purple)}
.galaxy-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.galaxy-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:20px;transition:all .2s;cursor:pointer}
.galaxy-card:hover{border-color:var(--purple);transform:translateY(-2px)}
.galaxy-card-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.galaxy-icon{width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,var(--purple),var(--accent));display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.galaxy-card h3{font-size:15px;font-weight:700}
.galaxy-card p{font-size:13px;color:var(--text2);margin-bottom:12px;line-height:1.5}
.galaxy-meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--text3)}

/* ── Spaces ── */
.spaces-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.spaces-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.space-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px;transition:all .2s;cursor:pointer}
.space-card:hover{border-color:var(--pink);transform:translateY(-2px)}
.space-card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.live-badge{display:flex;align-items:center;gap:6px;background:rgba(236,72,153,.15);border:1px solid var(--pink);border-radius:20px;padding:4px 10px;font-size:12px;color:var(--pink);font-weight:600}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--pink);animation:pulse 1.4s ease infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.3)}}
.space-card h3{font-size:15px;font-weight:700;margin-bottom:8px}
.space-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.space-tag{padding:3px 10px;border-radius:12px;background:var(--panel2);font-size:11px;color:var(--text3)}
.space-footer{display:flex;justify-content:space-between;align-items:center}
.space-speakers{display:flex;gap:-4px}
.space-speakers .avatar{border:2px solid var(--panel);margin-right:-8px}
.listener-count{font-size:13px;color:var(--text3);display:flex;align-items:center;gap:4px}

/* Waveform */
.waveform{display:flex;align-items:center;justify-content:center;gap:4px;height:60px}
.wave-bar{width:5px;border-radius:3px;background:linear-gradient(to top,var(--pink),var(--accent));animation:wave 1.2s ease-in-out infinite}
.wave-bar:nth-child(1){animation-delay:0s}
.wave-bar:nth-child(2){animation-delay:.1s}
.wave-bar:nth-child(3){animation-delay:.2s}
.wave-bar:nth-child(4){animation-delay:.3s}
.wave-bar:nth-child(5){animation-delay:.4s}
.wave-bar:nth-child(6){animation-delay:.5s}
.wave-bar:nth-child(7){animation-delay:.4s}
.wave-bar:nth-child(8){animation-delay:.3s}
.wave-bar:nth-child(9){animation-delay:.2s}
.wave-bar:nth-child(10){animation-delay:.1s}
@keyframes wave{0%,100%{height:8px}50%{height:40px}}

/* Space detail */
.space-detail{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:24px}
.space-detail-header{text-align:center;margin-bottom:20px}
.space-detail-header h2{font-size:20px;font-weight:800}
.speakers-grid{display:flex;flex-wrap:wrap;gap:20px;justify-content:center;margin:20px 0;padding:20px;background:var(--panel2);border-radius:var(--radius);border:1px solid var(--border)}
.speaker-item{display:flex;flex-direction:column;align-items:center;gap:8px}
.speaker-avatar-wrap{position:relative}
.mic-indicator{position:absolute;bottom:0;right:0;width:18px;height:18px;border-radius:50%;background:var(--teal);display:flex;align-items:center;justify-content:center;font-size:10px;border:2px solid var(--panel)}
.mic-indicator.muted{background:var(--text3)}
.space-controls{display:flex;gap:10px;justify-content:center;margin:16px 0}
.space-chat{background:var(--panel2);border:1px solid var(--border);border-radius:var(--radius);padding:14px;max-height:200px;overflow-y:auto;margin-top:16px}
.chat-msg{display:flex;gap:8px;margin-bottom:10px;font-size:13px}
.chat-msg .chat-name{font-weight:600;color:var(--accent2)}
.chat-msg .chat-text{color:var(--text2)}

/* ── Profile ── */
.profile-header{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:16px}
.profile-top{display:flex;align-items:flex-end;gap:16px;margin-bottom:16px}
.profile-stats{display:flex;gap:24px;margin-bottom:16px}
.profile-stat{text-align:center}
.profile-stat .num{font-size:20px;font-weight:700}
.profile-stat .lbl{font-size:12px;color:var(--text3)}
.profile-bio{font-size:14px;color:var(--text2);margin-bottom:12px}
.profile-tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:16px}
.profile-tab{padding:10px 20px;font-size:14px;font-weight:500;color:var(--text3);border-bottom:2px solid transparent;cursor:pointer;transition:all .2s;margin-bottom:-1px}
.profile-tab.active{color:var(--accent2);border-bottom-color:var(--accent2)}
.profile-tab:hover{color:var(--text)}

/* ── Settings ── */
.settings-section{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.settings-section h3{font-size:15px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.settings-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.settings-row:last-child{border-bottom:none}
.toggle{width:44px;height:24px;background:var(--border);border-radius:12px;position:relative;cursor:pointer;transition:background .2s;flex-shrink:0}
.toggle.on{background:var(--accent)}
.toggle::after{content:'';position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:3px;left:3px;transition:transform .2s}
.toggle.on::after{transform:translateX(20px)}
.checkbox-label{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;color:var(--text2)}
.checkbox-label input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent)}

/* ── Story Viewer ── */
.story-viewer{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:1000;display:flex;align-items:center;justify-content:center}
.story-viewer-inner{position:relative;width:min(400px,100vw);height:min(711px,100vh);border-radius:16px;overflow:hidden}
.story-progress-bar{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:4px;z-index:2}
.story-seg{flex:1;height:3px;background:rgba(255,255,255,.3);border-radius:2px;overflow:hidden}
.story-seg-fill{height:100%;background:#fff;width:0%}
.story-seg-fill.done{width:100%}
.story-close{position:absolute;top:14px;right:14px;z-index:3;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px}
.story-body{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:#fff;text-align:center;padding:24px}
.story-nav{position:absolute;inset:0;display:flex;z-index:2}
.story-nav-left,.story-nav-right{flex:1;cursor:pointer}
.story-author{position:absolute;top:40px;left:14px;display:flex;align-items:center;gap:8px;z-index:2;color:#fff}
.story-author .dname{font-weight:600;font-size:13px}

/* ── Dialog ── */
.dialog-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:500;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.dialog{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:24px;width:100%;max-width:460px;position:relative;max-height:90vh;overflow-y:auto}
.dialog h2{font-size:18px;font-weight:700;margin-bottom:20px}
.dialog-close{position:absolute;top:16px;right:16px;width:30px;height:30px;border-radius:50%;background:var(--panel2);display:flex;align-items:center;justify-content:center;color:var(--text2);font-size:16px}
.dialog-close:hover{color:var(--text);background:var(--border)}
.dialog-footer{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}

/* ── Toast ── */
#toast-container{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 18px;font-size:14px;color:var(--text);transform:translateX(120%);transition:transform .3s ease;pointer-events:auto;display:flex;align-items:center;gap:8px;box-shadow:0 4px 20px rgba(0,0,0,.4)}
.toast.show{transform:translateX(0)}
.toast.success{border-left:3px solid var(--teal)}
.toast.error{border-left:3px solid #ef4444}
.toast.info{border-left:3px solid var(--accent)}

/* ── Page titles ── */
.page-title{font-size:22px;font-weight:800;margin-bottom:20px;display:flex;align-items:center;gap:10px}
.page-title i{font-size:24px}

/* ── Misc ── */
.section-title{font-size:16px;font-weight:700;margin-bottom:12px;color:var(--text2)}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.mt-8{margin-top:8px}.mt-12{margin-top:12px}.mt-16{margin-top:16px}.mt-20{margin-top:20px}
.gap-10{gap:10px}
.two-col{display:grid;grid-template-columns:1fr 320px;gap:20px}
@media(max-width:900px){.two-col{grid-template-columns:1fr}}
.inline-edit{background:transparent;border:1px dashed transparent;border-radius:4px;padding:2px 6px;transition:border-color .2s}
.inline-edit:hover{border-color:var(--border)}
.inline-edit:focus{border-color:var(--accent);background:var(--panel2)}
.danger-zone{border-color:#ef4444!important}
.danger-zone h3{color:#ef4444}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.badge-purple{background:rgba(124,58,237,.2);color:var(--accent2)}
.badge-teal{background:rgba(20,184,166,.2);color:var(--teal)}
.galaxy-detail{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:24px}
.galaxy-detail-header{display:flex;align-items:center;gap:16px;margin-bottom:20px}
.back-btn{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--text3);cursor:pointer;margin-bottom:16px;transition:color .2s}
.back-btn:hover{color:var(--accent2)}
.empty-state{text-align:center;padding:60px 20px;color:var(--text3)}
.empty-state i{font-size:48px;margin-bottom:12px;display:block}

/* Mobile */
@media(max-width:768px){
  #sidebar{transform:translateX(-100%)}
  #sidebar.open{transform:translateX(0)}
  #main{margin-left:0}
  .two-col{grid-template-columns:1fr}
  .masonry{columns:1}
  #mobile-menu-btn{display:flex}
}
#mobile-menu-btn{display:none;position:fixed;bottom:20px;left:20px;z-index:200;width:48px;height:48px;border-radius:50%;background:var(--accent);color:#fff;align-items:center;justify-content:center;font-size:22px;box-shadow:0 4px 16px rgba(124,58,237,.4)}
</style>

// ═══════════════════════════════════════════════════════════
// AUTH
// ═══════════════════════════════════════════════════════════
function switchAuthTab(tab){
  document.querySelectorAll('.tab-btn').forEach((b,i)=>{b.classList.toggle('active',(tab==='login'?i===0:i===1))});
  document.getElementById('login-form').classList.toggle('hidden',tab!=='login');
  document.getElementById('register-form').classList.toggle('hidden',tab!=='register');
}
function doLogin(){
  const u=document.getElementById('li-user').value.trim();
  const p=document.getElementById('li-pass').value;
  if(!u||!p){toast('請填寫所有欄位','error');return}
  const user=users.find(x=>x.username===u);
  if(!user||user.password!==btoa(p)){toast('帳號或密碼錯誤','error');return}
  session={userId:user.id,username:user.username,displayName:user.displayName,avatarColor:user.avatarColor};
  saveSession();
  showApp();
  toast('歡迎回來，'+user.displayName+'！','success');
}
function doRegister(){
  const name=document.getElementById('reg-name').value.trim();
  const u=document.getElementById('reg-user').value.trim().toLowerCase().replace(/[^a-z0-9_]/g,'');
  const p=document.getElementById('reg-pass').value;
  const p2=document.getElementById('reg-pass2').value;
  if(!name||!u||!p||!p2){toast('請填寫所有欄位','error');return}
  if(p!==p2){toast('密碼不一致','error');return}
  if(p.length<6){toast('密碼至少6位','error');return}
  if(users.find(x=>x.username===u)){toast('帳號已被使用','error');return}
  const user={id:'u'+Date.now(),username:u,displayName:name,password:btoa(p),bio:'',createdAt:Date.now(),avatarColor:hashColor(u)};
  users.push(user);saveUsers();

function timeAgo(ts){
  const d=(Date.now()-ts)/1000;
  if(d<60)return '剛剛';if(d<3600)return Math.floor(d/60)+'分鐘前';
  if(d<86400)return Math.floor(d/3600)+'小時前';return Math.floor(d/86400)+'天前';
}

function toast(msg,type='info'){
  const c=document.getElementById('toast-container');
  const t=document.createElement('div');
  t.className=`toast ${type}`;
  const icons={success:'ti-check',error:'ti-x',info:'ti-info-circle'};
  t.innerHTML=`<i class="ti ${icons[type]||'ti-info-circle'}"></i>${esc(msg)}`;
  c.appendChild(t);
  requestAnimationFrame(()=>{requestAnimationFrame(()=>t.classList.add('show'))});
  setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),350)},3000);
}

function renderComposerHTML(){

function renderFeedHTML(arr){
  const sorted=[...arr].sort((a,b)=>b.createdAt-a.createdAt);
  return sorted.map(p=>renderPostHTML(p)).join('');
}
function renderPostHTML(p){
  const liked=p.likes&&p.likes.includes(session.userId);
  const reposted=p.reposts&&p.reposts.includes(session.userId);
  let pollHTML='';
  if(p.type==='poll'&&p.poll){pollHTML=renderPollHTML(p);}
  return `<div class="post" id="post-${p.id}">
    <div class="post-header">
      ${avatarHTML(p.displayName,p.avatarColor,'avatar-sm')}
      <div class="post-meta">
        <span class="dname">${esc(p.displayName)}</span>
        <span class="handle">@${esc(p.username)}</span>
        <span class="time">${timeAgo(p.createdAt)}</span>
      </div>
    </div>
    <div class="post-content">${esc(p.content).replace(/\n/g,'<br>')}</div>
    ${pollHTML}
    <div class="post-actions">
      <button class="post-action ${liked?'liked':''}" onclick="toggleLike('${p.id}')">
        <i class="ti ${liked?'ti-heart-filled':'ti-heart'}"></i><span>${(p.likes||[]).length}</span>
      </button>
      <button class="post-action" onclick="toast('留言功能開發中','info')">
        <i class="ti ti-message-circle"></i><span>${p.comments||0}</span>
      </button>
      <button class="post-action ${reposted?'reposted':''}" onclick="toggleRepost('${p.id}')">
        <i class="ti ti-repeat"></i><span>${(p.reposts||[]).length}</span>
      </button>
      <button class="post-action" onclick="toast('已複製連結','success')">
        <i class="ti ti-share"></i>
      </button>
    </div>
  </div>`;
}
function renderPollHTML(p){
  const voted=pollVotes[p.id];
  const total=p.poll.options.reduce((a,o)=>a+o.votes,0)||1;
  const expires=p.poll.expiresAt;
  const remaining=Math.max(0,Math.floor((expires-Date.now())/3600000));
  let opts=p.poll.options.map((o,i)=>{
    const pct=voted!=null?Math.round(o.votes/total*100):0;
    return `<div class="poll-option">
      <button class="poll-option-btn ${voted!=null?'voted':''}" onclick="${voted==null?`votePoll('${p.id}',${i})`:''}">
        ${voted!=null?`<div class="poll-bar" style="width:${pct}%"></div>`:''}
        <span class="poll-option-text"><span>${esc(o.text)}</span>${voted!=null?`<span>${pct}%</span>`:''}</span>
      </button>
    </div>`;
  }).join('');
  return `<div class="poll-container">
    <div class="poll-question">${esc(p.poll.question)}</div>
    ${opts}
    <div class="poll-meta">${total} 票 · ${remaining>0?remaining+'小時後截止':'已截止'}</div>
  </div>`;
}
function votePoll(postId,optIndex){
  if(pollVotes[postId]!=null){toast('已投票','info');return}
  const p=posts.find(x=>x.id===postId);
  if(!p||!p.poll)return;
  p.poll.options[optIndex].votes++;
  pollVotes[postId]=optIndex;
  savePosts();savePollVotes();
  const el=document.getElementById('post-'+postId);
  if(el){el.outerHTML=renderPostHTML(p);}
  toast('投票成功！','success');
}
function toggleLike(id){
  const p=posts.find(x=>x.id===id);if(!p)return;
  if(!p.likes)p.likes=[];
  const idx=p.likes.indexOf(session.userId);
  if(idx>=0)p.likes.splice(idx,1);else p.likes.push(session.userId);
  savePosts();
  const el=document.getElementById('post-'+id);
  if(el)el.outerHTML=renderPostHTML(p);
}
function toggleRepost(id){
  const p=posts.find(x=>x.id===id);if(!p)return;
  if(!p.reposts)p.reposts=[];
  const idx=p.reposts.indexOf(session.userId);
  if(idx>=0)p.reposts.splice(idx,1);else p.reposts.push(session.userId);
  savePosts();
  const el=document.getElementById('post-'+id);
  if(el)el.outerHTML=renderPostHTML(p);
  toast(idx>=0?'取消轉發':'已轉發','success');
}

let pollComposerData=null;

function addPollOption(){if(pollComposerData&&pollComposerData.options.length<4){pollComposerData.options.push('');renderPollComposer();}}
function removePollOption(i){if(pollComposerData){pollComposerData.options.splice(i,1);renderPollComposer();}}
function attachFile(){toast('媒體上傳功能開發中','info')}
function submitPost(){
  const txt=document.getElementById('compose-text').value.trim();
  if(!txt&&!pollComposerData){toast('請輸入內容','error');return}
  const p={
    id:uid(),userId:session.userId,username:session.username,

    p.poll={question:pollComposerData.question||txt,options:opts.map(t=>({text:t,votes:0})),totalVotes:0,expiresAt:Date.now()+86400000};
  }
  posts.unshift(p);savePosts();
  document.getElementById('compose-text').value='';
  pollComposerData=null;

function openStoryViewerById(sid){
  const grouped=groupStories();
  for(let gi=0;gi<grouped.length;gi++){
    const si=grouped[gi].stories.findIndex(s=>s.id===sid);
    if(si>=0){openStoryViewer(gi,si);return;}
  }
}
function openStoryViewer(groupIdx,storyIdx=0){
  storyGroups=groupStories();
  if(!storyGroups.length)return;
  storyGroupIndex=groupIdx;storyIndex=storyIdx;
  showCurrentStory();
  document.getElementById('story-viewer').classList.remove('hidden');
}
function showCurrentStory(){
  if(storyTimer)clearInterval(storyTimer);
  const g=storyGroups[storyGroupIndex];if(!g)return closeStoryViewer();
  const s=g.stories[storyIndex];if(!s)return closeStoryViewer();
  if(!s.seen.includes(session.userId)){s.seen.push(session.userId);saveStories();}
  const inner=document.getElementById('story-viewer-inner');
  inner.style.background=s.bg||'var(--panel)';
  document.getElementById('story-body').textContent=s.text;
  document.getElementById('story-author').innerHTML=`${avatarHTML(s.displayName,s.avatarColor,'avatar-sm')}<span class="dname">${esc(s.displayName)}</span>`;
  // Progress bars
  const total=g.stories.length;
  let bars='';
  for(let i=0;i<total;i++){bars+=`<div class="story-seg"><div class="story-seg-fill ${i<storyIndex?'done':''}" id="seg-${i}"></div></div>`;}
  document.getElementById('story-progress').innerHTML=bars;
  if(storyIndex<total){
    const fill=document.getElementById(`seg-${storyIndex}`);
    if(fill){fill.style.transition='width 5s linear';requestAnimationFrame(()=>requestAnimationFrame(()=>fill.style.width='100%'));}
  }
  storyTimer=setTimeout(()=>storyNav(1),5100);
}
function storyNav(dir){
  if(storyTimer)clearInterval(storyTimer);
  const g=storyGroups[storyGroupIndex];
  if(dir>0){
    if(storyIndex<g.stories.length-1){storyIndex++;showCurrentStory();}
    else if(storyGroupIndex<storyGroups.length-1){storyGroupIndex++;storyIndex=0;showCurrentStory();}
    else closeStoryViewer();
  }else{
    if(storyIndex>0){storyIndex--;showCurrentStory();}
    else if(storyGroupIndex>0){storyGroupIndex--;storyIndex=0;showCurrentStory();}
  }
}
function closeStoryViewer(){
  if(storyTimer)clearInterval(storyTimer);
  document.getElementById('story-viewer').classList.add('hidden');
}

  const p=posts.find(x=>x.id===id);
  if(p&&el){
    const liked=p.likes.includes(session.userId);
    el.className=liked?'liked-vs':'';
    el.innerHTML=`<i class="ti ${liked?'ti-heart-filled':'ti-heart'}" style="${liked?'color:#ef4444':''}"></i>${p.likes.length}`;
  }
}

// ═══════════════════════════════════════════════════════════
// GALAXIES
// ═══════════════════════════════════════════════════════════
const GALAXY_CATS=['全部','藝術','科技','音樂','思想','生活','旅行'];
let galaxyFilter='全部';
function renderGalaxies(){
  if(activeGalaxy)return renderGalaxyDetail(activeGalaxy);
  const filtered=galaxyFilter==='全部'?galaxies:galaxies.filter(g=>g.category===galaxyFilter);
  return `
  <div class="galaxy-hero"><h1>🌌 星系社群</h1><p style="color:rgba(255,255,255,.7)">找到你的宇宙部落，與志同道合的靈魂相遇</p></div>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <div class="filter-pills">${GALAXY_CATS.map(c=>`<span class="filter-pill ${galaxyFilter===c?'active':''}" onclick="setGalaxyFilter('${c}')">${c}</span>`).join('')}</div>
    <button class="btn btn-primary btn-sm" onclick="openCreateGalaxyDialog()"><i class="ti ti-plus"></i> 建立星系</button>
  </div>
  <div class="galaxy-grid">${filtered.map(g=>renderGalaxyCard(g)).join('')}</div>`;
}
function setGalaxyFilter(cat){galaxyFilter=cat;renderPage('galaxies')}
function renderGalaxyCard(g){
  const joined=g.members.includes(session.userId);
  return `<div class="galaxy-card" onclick="openGalaxyDetail('${g.id}')">
    <div class="galaxy-card-header">
      <div class="galaxy-icon">${g.emoji}</div>
      <div><div style="font-weight:700;font-size:15px">${esc(g.name)}</div><span class="badge badge-purple">${g.category}</span></div>
    </div>
    <p>${esc(g.desc)}</p>
    <div class="galaxy-meta">
      <span><i class="ti ti-users"></i> ${g.members.length} 成員</span>
      <button class="btn btn-sm ${joined?'btn-ghost':'btn-primary'}" onclick="event.stopPropagation();toggleJoinGalaxy('${g.id}')">${joined?'已加入':'加入'}</button>
    </div>
  </div>`;
}
function toggleJoinGalaxy(id){
  const g=galaxies.find(x=>x.id===id);if(!g)return;
  const idx=g.members.indexOf(session.userId);
  if(idx>=0)g.members.splice(idx,1);else g.members.push(session.userId);
  saveGalaxies();renderPage('galaxies');
  toast(idx>=0?'已離開星系':'已加入星系','success');
}
function openGalaxyDetail(id){activeGalaxy=id;renderPage('galaxies')}
function renderGalaxyDetail(id){
  const g=galaxies.find(x=>x.id===id);if(!g)return'';
  const joined=g.members.includes(session.userId);
  const gPosts=posts.filter(p=>Math.random()>.5).slice(0,3);
  return `
  <div class="back-btn" onclick="activeGalaxy=null;renderPage('galaxies')"><i class="ti ti-arrow-left"></i>返回星系</div>
  <div class="galaxy-detail">
    <div class="galaxy-detail-header">
      <div class="galaxy-icon" style="width:64px;height:64px;font-size:30px;border-radius:16px">${g.emoji}</div>
      <div>
        <h1 style="font-size:24px;font-weight:800">${esc(g.name)}</h1>
        <span class="badge badge-purple">${g.category}</span>
        <p style="color:var(--text2);font-size:14px;margin-top:6px">${esc(g.desc)}</p>
      </div>
      <button class="btn ${joined?'btn-ghost':'btn-primary'} btn-sm" style="margin-left:auto" onclick="toggleJoinGalaxy('${g.id}')">${joined?'離開星系':'加入星系'}</button>
    </div>
    <div style="display:flex;gap:24px;padding:16px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin-bottom:20px">
      <div class="profile-stat"><div class="num">${g.members.length}</div><div class="lbl">成員</div></div>
      <div class="profile-stat"><div class="num">${Math.floor(Math.random()*500+100)}</div><div class="lbl">貼文</div></div>
      <div class="profile-stat"><div class="num">${Math.floor(Math.random()*50+10)}</div><div class="lbl">活躍討論</div></div>
    </div>
    <div class="section-title">最新貼文</div>
    ${gPosts.length?gPosts.map(p=>renderPostHTML(p)).join(''):'<div class="empty-state" style="padding:30px"><i class="ti ti-message-off"></i><p>還沒有貼文</p></div>'}
  </div>`;
}
function openCreateGalaxyDialog(){
  openDialog(`<h2>🌌 建立新星系</h2>
    <button class="dialog-close" onclick="closeDialog()"><i class="ti ti-x"></i></button>
    <div class="form-group"><label>星系名稱</label><input id="gal-name" type="text" placeholder="我的星系"/></div>
    <div class="form-group"><label>Emoji 圖標</label><input id="gal-emoji" type="text" placeholder="🌟" maxlength="2" style="font-size:24px;text-align:center"/></div>
    <div class="form-group"><label>類別</label><select id="gal-cat">${GALAXY_CATS.filter(c=>c!=='全部').map(c=>`<option>${c}</option>`).join('')}</select></div>
    <div class="form-group"><label>描述</label><textarea id="gal-desc" placeholder="介紹你的星系..."></textarea></div>
    <div class="dialog-footer">
      <button class="btn btn-ghost" onclick="closeDialog()">取消</button>
      <button class="btn btn-primary" onclick="submitGalaxy()">建立星系</button>
    </div>`);
}
function submitGalaxy(){
  const name=document.getElementById('gal-name').value.trim();
  const emoji=document.getElementById('gal-emoji').value.trim()||'🌟';
  const cat=document.getElementById('gal-cat').value;
  const desc=document.getElementById('gal-desc').value.trim();
  if(!name||!desc){toast('請填寫所有欄位','error');return}
  const g={id:uid(),name,emoji,desc,category:cat,members:[session.userId],createdAt:Date.now()};
  galaxies.push(g);saveGalaxies();closeDialog();
  toast('星系「'+name+'」已建立！','success');renderPage('galaxies');
}

// ═══════════════════════════════════════════════════════════
// SPACES
// ═══════════════════════════════════════════════════════════
function renderSpaces(){
  if(activeSpace)return renderSpaceDetail(activeSpace);
  return `
  <div class="spaces-header">
    <div class="page-title" style="margin:0"><i class="ti ti-broadcast" style="color:var(--pink)"></i>直播空間 Spaces</div>
    <button class="btn btn-pink" onclick="openCreateSpaceDialog()"><i class="ti ti-broadcast"></i> 開始直播</button>
  </div>
  <div class="spaces-grid">${spaces.map(s=>renderSpaceCard(s)).join('')}</div>`;
}
function renderSpaceCard(s){
  const spkHTML=s.speakers.slice(0,3).map(sp=>`${avatarHTML(sp.displayName,sp.color,'avatar-sm')}`).join('');
  return `<div class="space-card" onclick="openSpaceDetail('${s.id}')">
    <div class="space-card-top">
      <div>
        <div class="live-badge"><div class="live-dot"></div>直播中</div>
      </div>
      <div class="listener-count"><i class="ti ti-headphones"></i>${s.listeners}</div>
    </div>
    <h3>${esc(s.title)}</h3>
    <div class="space-tags">${s.tags.map(t=>`<span class="space-tag">${esc(t)}</span>`).join('')}</div>
    <div class="space-footer">
      <div class="space-speakers">${spkHTML}</div>
      <button class="btn btn-pink btn-sm" onclick="event.stopPropagation();joinSpace('${s.id}')">加入聆聽</button>
    </div>
  </div>`;
}
function openSpaceDetail(id){activeSpace=id;renderPage('spaces')}
function joinSpace(id){activeSpace=id;renderPage('spaces');toast('已加入空間！','success')}
function renderSpaceDetail(id){
  const s=spaces.find(x=>x.id===id);if(!s)return'';
  s.listeners++;saveSpaces();
  const chatHTML=s.chat.map(m=>`<div class="chat-msg"><span class="chat-name">${esc(m.name)}</span><span class="chat-text">${esc(m.text)}</span></div>`).join('');
  const spkGrid=s.speakers.map(sp=>`<div class="speaker-item">
    <div class="speaker-avatar-wrap">${avatarHTML(sp.displayName,sp.color,'avatar-md')}<div class="mic-indicator ${sp.muted?'muted':''}"><i class="ti ${sp.muted?'ti-microphone-off':'ti-microphone'}" style="font-size:8px;color:#fff"></i></div></div>
    <div style="font-size:12px;font-weight:600">${esc(sp.displayName)}</div>
    <div style="font-size:11px;color:var(--text3)">${sp.username===s.host?'主持人':'發言者'}</div>
  </div>`).join('');
  return `
  <div class="back-btn" onclick="activeSpace=null;renderPage('spaces')"><i class="ti ti-arrow-left"></i>返回空間列表</div>
  <div class="space-detail">
    <div class="space-detail-header">
      <div class="live-badge" style="display:inline-flex;margin-bottom:12px"><div class="live-dot"></div>直播中 · ${s.listeners} 人收聽</div>
      <h2>${esc(s.title)}</h2>
      <div style="margin-top:6px">${s.tags.map(t=>`<span class="space-tag">${esc(t)}</span>`).join(' ')}</div>
    </div>
    <div class="waveform">${Array(10).fill(0).map(()=>`<div class="wave-bar"></div>`).join('')}</div>
    <div class="speakers-grid">${spkGrid}</div>
    <div class="space-controls">
      <button class="btn btn-ghost" onclick="toast('已舉手！','info')"><i class="ti ti-hand-stop"></i> 舉手</button>
      <button class="btn btn-ghost" onclick="toast('已靜音','info')"><i class="ti ti-microphone-off"></i> 靜音</button>
      <button class="btn btn-danger" onclick="activeSpace=null;renderPage('spaces');toast('已離開空間','info')"><i class="ti ti-phone-off"></i> 離開</button>
    </div>
    <div class="section-title" style="margin-top:16px"><i class="ti ti-message-circle"></i> 聊天室</div>
    <div class="space-chat" id="space-chat">${chatHTML}</div>
    <div style="display:flex;gap:8px;margin-top:10px">
      <input type="text" id="space-chat-input" placeholder="發送訊息..." style="flex:1"/>
      <button class="btn btn-primary btn-sm" onclick="sendSpaceChat('${s.id}')">發送</button>
    </div>
  </div>`;
}
function sendSpaceChat(id){
  const inp=document.getElementById('space-chat-input');if(!inp)return;
  const txt=inp.value.trim();if(!txt)return;
  const s=spaces.find(x=>x.id===id);if(!s)return;
  s.chat.push({name:session.displayName,text:txt});
  inp.value='';saveSpaces();
  const chat=document.getElementById('space-chat');
  if(chat){const div=document.createElement('div');div.className='chat-msg';div.innerHTML=`<span class="chat-name">${esc(session.displayName)}</span><span class="chat-text">${esc(txt)}</span>`;chat.appendChild(div);chat.scrollTop=chat.scrollHeight;}
}
function openCreateSpaceDialog(){
  openDialog(`<h2>🎙️ 開始直播空間</h2>
    <button class="dialog-close" onclick="closeDialog()"><i class="ti ti-x"></i></button>
    <div class="form-group"><label>空間標題</label><input id="sp-title" type="text" placeholder="今天聊什麼？"/></div>
    <div class="form-group"><label>主題標籤（逗號分隔）</label><input id="sp-tags" type="text" placeholder="音樂, 創作, 深夜"/></div>
    <div class="form-group"><label>隱私設定</label>
      <select id="sp-privacy"><option value="public">公開</option><option value="followers">僅追蹤者</option><option value="invite">受邀者</option></select>
    </div>
    <div class="dialog-footer">
      <button class="btn btn-ghost" onclick="closeDialog()">取消</button>
      <button class="btn btn-pink" onclick="submitSpace()"><i class="ti ti-broadcast"></i> 開始直播</button>
    </div>`);
}
function submitSpace(){
  const title=document.getElementById('sp-title').value.trim();
  const tagsRaw=document.getElementById('sp-tags').value;
  if(!title){toast('請輸入標題','error');return}
  const tags=tagsRaw.split(',').map(t=>t.trim()).filter(Boolean);
  const s={id:uid(),title,host:session.username,hostDisplay:session.displayName,hostColor:session.avatarColor,tags,listeners:1,speakers:[{username:session.username,displayName:session.displayName,color:session.avatarColor,muted:false}],chat:[]};
  spaces.unshift(s);saveSpaces();closeDialog();
  toast('直播空間已開啟！','success');
  activeSpace=s.id;renderPage('spaces');
}

// ═══════════════════════════════════════════════════════════
// PROFILE
// ═══════════════════════════════════════════════════════════
let profileTab='posts';
function renderProfile(){
  const u=users.find(x=>x.id===session.userId)||{bio:'',username:session.username,displayName:session.displayName,avatarColor:session.avatarColor};
  const myPosts=posts.filter(p=>p.userId===session.userId);
  const followers=Math.floor(Math.random()*500+50);
  const following=Math.floor(Math.random()*200+20);
  return `
  <div class="profile-header">
    <div class="profile-top">
      ${avatarHTML(u.displayName,u.avatarColor,'avatar-xl')}
      <div>
        <div style="font-size:22px;font-weight:800">${esc(u.displayName)}</div>
        <div style="color:var(--text3);font-size:15px">@${esc(u.username)}</div>
      </div>
      <button class="btn btn-ghost btn-sm" style="margin-left:auto" onclick="toast('編輯個人頁','info')"><i class="ti ti-edit"></i> 編輯</button>
    </div>
    <div class="profile-bio">
      <input class="inline-edit" id="bio-input" value="${esc(u.bio||'')}" placeholder="新增個人簡介..." onblur="saveBio(this.value)" style="width:100%;font-size:14px;color:var(--text2)"/>
    </div>
    <div class="profile-stats">
      <div class="profile-stat"><div class="num">${myPosts.length}</div><div class="lbl">貼文</div></div>
      <div class="profile-stat"><div class="num">${followers}</div><div class="lbl">追蹤者</div></div>
      <div class="profile-stat"><div class="num">${following}</div><div class="lbl">追蹤中</div></div>
    </div>
  </div>
  <div class="profile-tabs">
    <div class="profile-tab ${profileTab==='posts'?'active':''}" onclick="setProfileTab('posts')">貼文</div>
    <div class="profile-tab ${profileTab==='media'?'active':''}" onclick="setProfileTab('media')">媒體</div>
    <div class="profile-tab ${profileTab==='likes'?'active':''}" onclick="setProfileTab('likes')">喜歡</div>
  </div>
  <div id="profile-content">${renderProfileContent()}</div>`;
}
function setProfileTab(tab){profileTab=tab;const el=document.getElementById('profile-content');if(el)el.innerHTML=renderProfileContent();document.querySelectorAll('.profile-tab').forEach((t,i)=>{t.classList.toggle('active',['posts','media','likes'][i]===tab)});}
function renderProfileContent(){
  const myPosts=posts.filter(p=>p.userId===session.userId);
  const likedPosts=posts.filter(p=>p.likes&&p.likes.includes(session.userId));
  if(profileTab==='posts')return myPosts.length?myPosts.map(p=>renderPostHTML(p)).join(''):'<div class="empty-state"><i class="ti ti-notes-off"></i><p>還沒有貼文</p></div>';
  if(profileTab==='media')return '<div class="empty-state"><i class="ti ti-photo-off"></i><p>還沒有媒體</p></div>';
  if(profileTab==='likes')return likedPosts.length?likedPosts.map(p=>renderPostHTML(p)).join(''):'<div class="empty-state"><i class="ti ti-heart-off"></i><p>還沒有喜歡的貼文</p></div>';
  return '';
}
function saveBio(val){
  const u=users.find(x=>x.id===session.userId);
  if(u){u.bio=val;saveUsers();toast('個人簡介已更新','success');}
}

// SETTINGS
// ═══════════════════════════════════════════════════════════
function renderSettings(){
  return `
  <div class="page-title"><i class="ti ti-settings"></i>設定</div>
  <div class="settings-section">
    <h3><i class="ti ti-user"></i> 帳號設定</h3>
    <div class="form-group"><label>顯示名稱</label><input id="set-name" type="text" value="${esc(session.displayName)}"/></div>
    <button class="btn btn-primary btn-sm" onclick="saveDisplayName()">儲存名稱</button>
  </div>
  <div class="settings-section">
    <h3><i class="ti ti-lock"></i> 更改密碼</h3>
    <div class="form-group"><label>目前密碼</label><input id="set-oldpass" type="password"/></div>
    <div class="form-group"><label>新密碼</label><input id="set-newpass" type="password"/></div>
    <div class="form-group"><label>確認新密碼</label><input id="set-newpass2" type="password"/></div>
    <button class="btn btn-primary btn-sm" onclick="changePassword()">更改密碼</button>
  </div>
  <div class="settings-section">
    <h3><i class="ti ti-shield"></i> 隱私設定</h3>
    <div class="settings-row">
      <div><div style="font-weight:500">帳號隱私</div><div style="font-size:13px;color:var(--text3)">開啟後，只有獲批准的追蹤者可以看到你的貼文</div></div>
      <div class="toggle" id="privacy-toggle" onclick="toggleSetting('privacy-toggle')"></div>
    </div>
    <div class="settings-row">
      <div><div style="font-weight:500">顯示線上狀態</div><div style="font-size:13px;color:var(--text3)">讓其他人看到你是否在線</div></div>
      <div class="toggle on" id="online-toggle" onclick="toggleSetting('online-toggle')"></div>
    </div>
  </div>
  <div class="settings-section">
    <h3><i class="ti ti-bell"></i> 通知設定</h3>
    <div class="settings-row"><label class="checkbox-label"><input type="checkbox" checked/> 新追蹤者通知</label></div>
    <div class="settings-row"><label class="checkbox-label"><input type="checkbox" checked/> 按讚通知</label></div>
    <div class="settings-row"><label class="checkbox-label"><input type="checkbox" checked/> 留言通知</label></div>
    <div class="settings-row"><label class="checkbox-label"><input type="checkbox"/> 每週摘要電子報</label></div>
  </div>
  <div class="settings-section danger-zone">
    <h3><i class="ti ti-alert-triangle"></i> 危險區域</h3>
    <p style="font-size:13px;color:var(--text2);margin-bottom:14px">刪除帳號後，所有資料將永久清除且無法復原。</p>
    <button class="btn btn-danger btn-sm" onclick="confirmDeleteAccount()"><i class="ti ti-trash"></i> 刪除帳號</button>
  </div>`;
}
function toggleSetting(id){document.getElementById(id).classList.toggle('on');toast('設定已更新','success')}
function saveDisplayName(){
  const name=document.getElementById('set-name').value.trim();
  if(!name){toast('名稱不得為空','error');return}
  const u=users.find(x=>x.id===session.userId);
  if(u){u.displayName=name;saveUsers();}
  session.displayName=name;saveSession();
  renderSidebarUser();toast('顯示名稱已更新','success');
}
function changePassword(){
  const oldp=document.getElementById('set-oldpass').value;
  const newp=document.getElementById('set-newpass').value;
  const newp2=document.getElementById('set-newpass2').value;
  const u=users.find(x=>x.id===session.userId);
  if(!u){toast('找不到用戶','error');return}
  if(u.password!==btoa(oldp)){toast('目前密碼不正確','error');return}
  if(newp!==newp2){toast('新密碼不一致','error');return}
  if(newp.length<6){toast('密碼至少6位','error');return}
  u.password=btoa(newp);saveUsers();
  document.getElementById('set-oldpass').value='';
  document.getElementById('set-newpass').value='';
  document.getElementById('set-newpass2').value='';
  toast('密碼已更新','success');
}
function confirmDeleteAccount(){
  openDialog(`<h2 style="color:#ef4444">⚠️ 確認刪除帳號</h2>
    <button class="dialog-close" onclick="closeDialog()"><i class="ti ti-x"></i></button>
    <p style="margin-bottom:20px;color:var(--text2)">此操作無法復原。所有貼文、故事和個人資料將永久刪除。</p>
    <div class="form-group"><label>請輸入你的帳號確認</label><input id="del-confirm" type="text" placeholder="${esc(session.username)}"/></div>
    <div class="dialog-footer">
      <button class="btn btn-ghost" onclick="closeDialog()">取消</button>
      <button class="btn btn-danger" onclick="deleteAccount()">確認刪除</button>
    </div>`);
}
function deleteAccount(){
  const val=document.getElementById('del-confirm').value.trim();
  if(val!==session.username){toast('帳號名稱不符','error');return}
  users=users.filter(u=>u.id!==session.userId);
  posts=posts.filter(p=>p.userId!==session.userId);
  saveUsers();savePosts();
  closeDialog();doLogout();
  toast('帳號已刪除','info');
}

seedData();

else{document.getElementById('auth-screen').classList.remove('hidden');}
</script>
