<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Bubble Verse — 去中心化社群宇宙</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f13;--panel:#1a1a24;--panel2:#22222f;
  --accent:#7c3aed;--accent2:#a855f7;
  --pink:#ec4899;--teal:#14b8a6;--orange:#f97316;--purple:#8b5cf6;
  --text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;
  --border:#2d2d3d;--radius:12px;--radius-sm:8px;
  --sidebar:240px;
}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;font-size:15px;line-height:1.5;min-height:100vh}
a{color:inherit;text-decoration:none}
button{cursor:pointer;border:none;background:none;color:inherit;font:inherit}
input,textarea,select{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;width:100%;outline:none;transition:border .2s}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:80px}
img{max-width:100%}
.hidden{display:none!important}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
#app{display:flex;min-height:100vh}
#sidebar{width:var(--sidebar);background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:20px 12px;position:fixed;top:0;left:0;height:100vh;overflow-y:auto;z-index:100;transition:transform .3s}
#main{margin-left:var(--sidebar);flex:1;min-height:100vh}
#content{max-width:900px;margin:0 auto;padding:24px 20px}
.logo{display:flex;align-items:center;gap:10px;padding:8px 12px;margin-bottom:20px}
.logo-orb{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--pink));position:relative;overflow:hidden;flex-shrink:0}
.logo-orb::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.3),transparent 60%)}
.logo-text{font-size:17px;font-weight:700;background:linear-gradient(135deg,var(--accent2),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:var(--radius-sm);cursor:pointer;transition:background .15s,color .15s;color:var(--text2);font-size:14px;font-weight:500;margin-bottom:2px;position:relative}
.nav-item:hover{background:var(--panel2);color:var(--text)}
.nav-item.active{background:rgba(124,58,237,.18);color:var(--accent2)}
.nav-item i{font-size:18px;width:22px;text-align:center;flex-shrink:0}
.nav-divider{height:1px;background:var(--border);margin:10px 0}
.sidebar-user{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--radius-sm);margin-top:auto}
.sidebar-user .uname{font-size:13px;font-weight:600}
.sidebar-user .uhandle{font-size:12px;color:var(--text3)}
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0;color:#fff}
.avatar-sm{width:32px;height:32px;font-size:13px}
.avatar-md{width:44px;height:44px;font-size:17px}
.avatar-lg{width:72px;height:72px;font-size:28px}
.avatar-xl{width:96px;height:96px;font-size:38px}

.settings-group{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px;overflow:hidden}
.settings-group-title{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;padding:14px 16px 6px}
.settings-row-ig{display:flex;align-items:center;gap:14px;padding:13px 16px;cursor:pointer;transition:background .15s;border-bottom:1px solid var(--border)}
.settings-row-ig:last-child{border-bottom:none}
.settings-row-ig:hover{background:var(--panel2)}
.settings-row-ig .row-icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.settings-row-ig .row-label{flex:1}
.settings-row-ig .row-label strong{display:block;font-size:14px;font-weight:500}
.settings-row-ig .row-label span{display:block;font-size:12px;color:var(--text3);margin-top:1px}
.settings-row-ig .row-right{color:var(--text3);font-size:16px}
.settings-panel{display:none;padding:16px;border-top:1px solid var(--border);background:var(--panel2)}
.settings-panel.open{display:block}
.settings-row-danger{color:#ef4444}
.settings-row-danger .row-icon{background:rgba(239,68,68,.15)}

/* ── Analytics Dashboard ── */
.analytics-overview{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px}
@media(min-width:600px){.analytics-overview{grid-template-columns:repeat(4,1fr)}}
.analytics-kpi{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center}
.analytics-kpi .kpi-val{font-size:22px;font-weight:800;background:linear-gradient(135deg,var(--accent2),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1.2}
.analytics-kpi .kpi-label{font-size:11px;color:var(--text3);margin-top:4px}
.analytics-kpi .kpi-delta{font-size:11px;margin-top:3px;font-weight:600}
.kpi-up{color:#22c55e}.kpi-down{color:#ef4444}
.analytics-section{margin-bottom:20px}
.analytics-section-title{font-size:13px;font-weight:700;color:var(--text2);margin-bottom:10px;display:flex;align-items:center;gap:6px}
/* Bar chart */
.bar-chart{display:flex;align-items:flex-end;gap:5px;height:100px;padding:0 2px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.bar-fill{width:100%;border-radius:4px 4px 0 0;background:linear-gradient(180deg,var(--accent2),var(--accent));transition:height .6s ease;min-height:3px}
.bar-fill.peak{background:linear-gradient(180deg,var(--pink),var(--orange))}
.bar-lbl{font-size:9px;color:var(--text3);white-space:nowrap}
.bar-val{font-size:9px;color:var(--text2)}
/* Heatmap */
.heatmap{display:grid;grid-template-columns:repeat(24,1fr);gap:2px;margin-bottom:6px}
.heatmap-cell{aspect-ratio:1;border-radius:2px;cursor:default;position:relative}
.heatmap-cell:hover::after{content:attr(data-tip);position:absolute;bottom:120%;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:3px 7px;font-size:10px;white-space:nowrap;z-index:10;pointer-events:none}
.heatmap-hours{display:flex;justify-content:space-between;font-size:9px;color:var(--text3)}
/* Traffic donut */
.traffic-legend{display:flex;flex-direction:column;gap:7px}
.traffic-item{display:flex;align-items:center;gap:8px;font-size:13px}
.traffic-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.traffic-bar-wrap{flex:1;height:6px;background:var(--panel2);border-radius:3px;overflow:hidden}
.traffic-bar-fill{height:100%;border-radius:3px;transition:width .6s ease}
.traffic-pct{font-size:12px;color:var(--text3);min-width:32px;text-align:right}
/* Top posts */
.top-post-item{background:var(--panel2);border-radius:10px;padding:12px;margin-bottom:8px;cursor:pointer}
.top-post-rank{font-size:22px;font-weight:900;color:var(--accent2);min-width:28px;text-align:center;line-height:1}
.top-post-stats{display:flex;gap:10px;font-size:11px;color:var(--text3);margin-top:6px;flex-wrap:wrap}
.top-post-stat{display:flex;align-items:center;gap:3px}
/* Content insight card */
.insight-card{background:linear-gradient(135deg,rgba(124,58,237,.15),rgba(236,72,153,.1));border:1px solid rgba(124,58,237,.25);border-radius:12px;padding:14px;margin-bottom:10px}
.insight-card h4{font-size:13px;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.insight-tag{display:inline-block;background:rgba(124,58,237,.2);color:var(--accent2);border-radius:99px;padding:2px 9px;font-size:11px;font-weight:600;margin:2px}
.analytics-tab{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:14px}
.analytics-tab-btn{padding:8px 14px;font-size:13px;font-weight:500;color:var(--text3);border-bottom:2px solid transparent;cursor:pointer;transition:all .2s;margin-bottom:-1px}
.analytics-tab-btn.active{color:var(--accent2);border-bottom-color:var(--accent2)}
/* Streak & Karma */
.creator-badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.creator-badge{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--border);border-radius:99px;padding:6px 12px;font-size:12px}
.creator-badge .badge-icon{font-size:16px}
.section-title{font-size:16px;font-weight:700;margin-bottom:12px;color:var(--text2)}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.mt-8{margin-top:8px}.mt-12{margin-top:12px}.mt-16{margin-top:16px}.mt-20{margin-top:20px}
.gap-10{gap:10px}
.two-col{display:grid;grid-template-columns:1fr 320px;gap:20px}
@media(max-width:900px){.two-col{grid-template-columns:1fr}}
.inline-edit{background:transparent;border:1px dashed transparent;border-radius:4px;padding:2px 6px;transition:border-color .2s}
.inline-edit:hover{border-color:var(--border)}
.inline-edit:focus{border-color:var(--accent);background:var(--panel2)}
.danger-zone{border-color:#ef4444!important}
.danger-zone h3{color:#ef4444}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.badge-purple{background:rgba(124,58,237,.2);color:var(--accent2)}
.badge-teal{background:rgba(20,184,166,.2);color:var(--teal)}
.galaxy-detail{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:24px}
.galaxy-detail-header{display:flex;align-items:center;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.back-btn{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--text3);cursor:pointer;margin-bottom:16px;transition:color .2s}
.back-btn:hover{color:var(--accent2)}
.empty-state{text-align:center;padding:60px 20px;color:var(--text3)}
.empty-state i{font-size:48px;margin-bottom:12px;display:block}
i.ti{font-style:normal;display:inline-flex;align-items:center;justify-content:center;line-height:1}
.feed-tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:16px}
.feed-tab{padding:10px 20px;font-size:14px;font-weight:500;color:var(--text3);border-bottom:2px solid transparent;cursor:pointer;transition:all .2s;margin-bottom:-1px}
.feed-tab.active{color:var(--accent2);border-bottom-color:var(--accent2)}
.notif-item{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--border)}
.notif-item.unread{background:rgba(124,58,237,.05);border-radius:8px;padding:14px;margin-bottom:4px}
.nav-badge{background:#ef4444;color:#fff;border-radius:99px;font-size:10px;font-weight:700;padding:1px 6px;margin-left:auto}
.quote-embed{border:1px solid var(--border);border-radius:10px;padding:12px;margin:8px 0;background:var(--panel2);font-size:13px}
.quote-embed .quote-author{font-weight:600;color:var(--accent2);margin-bottom:4px;font-size:12px}
.quote-embed .quote-text{color:var(--text2);line-height:1.5}
.action-dropdown{position:absolute;background:var(--panel);border:1px solid var(--border);border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,.3);z-index:100;min-width:160px;overflow:hidden;bottom:36px;left:50%}
.action-dropdown-item{padding:10px 16px;font-size:14px;cursor:pointer;transition:background .15s;display:flex;align-items:center;gap:8px}
.action-dropdown-item:hover{background:var(--panel2)}
.comment-item{display:flex;gap:10px;margin-bottom:14px}
.comment-body{flex:1;background:var(--panel2);border-radius:10px;padding:10px 12px}
.comment-body .comment-author{font-size:13px;font-weight:600;margin-bottom:2px}
.comment-body .comment-text{font-size:14px;color:var(--text2)}
.comment-body .comment-time{font-size:11px;color:var(--text3);margin-top:4px}
.search-input-wrap{position:relative;margin-bottom:16px}
.search-input-wrap i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:16px}
.search-input-wrap input{padding-left:40px}
.user-list-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.user-list-item:last-child{border-bottom:none}
@media(max-width:768px){
  #sidebar{transform:translateX(-100%)}
  #sidebar.open{transform:translateX(0)}
  #main{margin-left:0}
  .two-col{grid-template-columns:1fr}
  .masonry{columns:1}
  #mobile-menu-btn{display:flex}
}
#mobile-menu-btn{display:none;position:fixed;bottom:20px;left:20px;z-index:200;width:48px;height:48px;border-radius:50%;background:var(--accent);color:#fff;align-items:center;justify-content:center;font-size:22px;box-shadow:0 4px 16px rgba(124,58,237,.4)}

/* ── Avatar with photo ── */
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.avatar-upload-wrap{position:relative;display:inline-block;cursor:pointer}
.avatar-upload-wrap:hover .avatar-cam-overlay{opacity:1}
.avatar-cam-overlay{position:absolute;inset:0;border-radius:50%;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s;font-size:20px;color:#fff}
.avatar-cam-overlay.always{opacity:1;background:rgba(0,0,0,.4)}

/* ── Live Stream ── */
#live-overlay{position:fixed;inset:0;z-index:3000;background:#000;display:flex;flex-direction:column}
#live-overlay.hidden{display:none!important}
.live-video-area{flex:1;position:relative;overflow:hidden;background:#000}
.live-video-bg{position:absolute;inset:0;animation:livePulse 5s ease-in-out infinite}
@keyframes livePulse{0%,100%{filter:brightness(1) saturate(1)}50%{filter:brightness(1.12) saturate(1.15)}}
.live-scanlines{position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.08) 2px,rgba(0,0,0,.08) 4px);pointer-events:none;opacity:.4}
.live-noise{position:absolute;inset:0;opacity:.03;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
.live-topbar{position:absolute;top:0;left:0;right:0;padding:14px 16px;display:flex;align-items:center;gap:10px;background:linear-gradient(to bottom,rgba(0,0,0,.7),transparent);z-index:10}
.live-badge-red{background:#ef4444;color:#fff;padding:4px 10px;border-radius:6px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:5px;letter-spacing:.5px}
.live-dot{width:7px;height:7px;border-radius:50%;background:#fff;animation:pulse 1.2s ease infinite}
.live-viewers{background:rgba(0,0,0,.5);color:#fff;border-radius:99px;padding:4px 10px;font-size:12px;display:flex;align-items:center;gap:5px;backdrop-filter:blur(4px)}
.live-host-info{position:absolute;top:70px;left:16px;display:flex;align-items:center;gap:10px;z-index:10}
.live-host-name{color:#fff;font-size:13px;font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,.8)}
.live-host-sub{color:rgba(255,255,255,.7);font-size:11px}
.live-close-btn{margin-left:auto;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;cursor:pointer;border:none;backdrop-filter:blur(4px)}
/* Floating chat overlay — bottom 25%, left 65% */
.live-chat-overlay{position:absolute;bottom:90px;left:0;width:62%;padding:0 14px;pointer-events:none;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;max-height:28vh;mask-image:linear-gradient(to bottom,transparent,black 35%);-webkit-mask-image:linear-gradient(to bottom,transparent,black 35%)}
.live-chat-msg{display:flex;align-items:flex-start;gap:7px;margin-bottom:8px;animation:chatIn .25s ease;pointer-events:auto}
@keyframes chatIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.live-chat-bubble{background:rgba(0,0,0,.52);backdrop-filter:blur(6px);border-radius:18px;padding:6px 12px;font-size:12.5px;color:#fff;line-height:1.4;word-break:break-word}
.live-chat-name{font-weight:700;color:#c4b5fd;font-size:11px}
.live-chat-gift{font-weight:700;color:#fcd34d}
/* Live controls bar */
.live-controls{position:absolute;bottom:0;left:0;right:0;padding:12px 16px;background:linear-gradient(to top,rgba(0,0,0,.75),transparent);display:flex;align-items:center;gap:8px;z-index:10}
.live-input{flex:1;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);border-radius:24px;padding:9px 16px;color:#fff;font-size:13px;outline:none;backdrop-filter:blur(4px)}
.live-input::placeholder{color:rgba(255,255,255,.5)}
.live-btn{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;background:rgba(255,255,255,.15);border:none;cursor:pointer;color:#fff;transition:all .15s;backdrop-filter:blur(4px)}
.live-btn:hover{background:rgba(255,255,255,.25);transform:scale(1.08)}
.live-btn-heart{background:rgba(239,68,68,.4);border:1px solid rgba(239,68,68,.6)}
.live-btn-gift{background:rgba(251,191,36,.3);border:1px solid rgba(251,191,36,.5)}
/* Floating heart animation */
.float-heart{position:absolute;bottom:90px;font-size:28px;animation:floatUp 2.2s ease-out forwards;pointer-events:none;z-index:20}
@keyframes floatUp{0%{opacity:1;transform:translateX(0) translateY(0) scale(1)}30%{transform:translateX(var(--dx,15px)) translateY(-60px) scale(1.2)}100%{opacity:0;transform:translateX(var(--dx2,-10px)) translateY(-200px) scale(.6)}}
/* Gift popup */
.gift-popup{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;animation:giftPop 2.5s ease-out forwards;z-index:25;pointer-events:none}
.gift-popup .gift-icon{font-size:80px;display:block;animation:giftSpin .5s ease-out}
.gift-popup .gift-label{color:#fff;font-size:16px;font-weight:800;text-shadow:0 2px 8px rgba(0,0,0,.8);margin-top:4px}
@keyframes giftPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.3)}30%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-80%) scale(.8)}}
@keyframes giftSpin{0%{transform:rotate(-20deg) scale(.8)}100%{transform:rotate(0deg) scale(1)}}
/* Gift selection sheet */
.gift-sheet{position:absolute;bottom:0;left:0;right:0;background:rgba(15,15,20,.95);backdrop-filter:blur(16px);border-top:1px solid rgba(255,255,255,.1);padding:20px;z-index:30;border-radius:20px 20px 0 0}
.gift-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px}
.gift-item{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;padding:10px 4px;border-radius:12px;transition:all .2s;border:1px solid transparent}
.gift-item:hover,.gift-item.selected{background:rgba(124,58,237,.2);border-color:var(--accent)}
.gift-item .g-icon{font-size:34px}
.gift-item .g-name{font-size:11px;color:var(--text2)}
.gift-item .g-price{font-size:11px;color:var(--orange);font-weight:700;display:flex;align-items:center;gap:3px}
.coin-display{display:flex;align-items:center;gap:6px;color:#fcd34d;font-size:13px;font-weight:700;margin-bottom:12px}
/* Live on profile badge */
.live-profile-badge{display:inline-flex;align-items:center;gap:5px;background:#ef4444;color:#fff;border-radius:6px;padding:3px 10px;font-size:11px;font-weight:800;cursor:pointer;animation:liveBadgePulse 2s ease infinite}
@keyframes liveBadgePulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.4)}50%{box-shadow:0 0 0 8px rgba(239,68,68,0)}}
/* ── AI Activity Bar ── */
#ai-activity-bar{position:fixed;bottom:16px;right:16px;z-index:2000;display:flex;flex-direction:column;gap:6px;pointer-events:none;max-width:280px}
.ai-activity-item{background:rgba(10,8,20,.88);border:1px solid rgba(124,58,237,.35);border-radius:10px;padding:7px 12px;font-size:12px;color:#e0d7ff;display:flex;align-items:center;gap:8px;animation:slideInRight .3s ease;backdrop-filter:blur(8px);box-shadow:0 4px 16px rgba(0,0,0,.4)}
@keyframes slideInRight{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
.ai-dot{width:7px;height:7px;border-radius:50%;background:#22c55e;flex-shrink:0;animation:pulse 1.5s ease infinite}
/* ── AI Mode panel in settings ── */
.ai-panel{background:rgba(124,58,237,.08);border:1px solid rgba(124,58,237,.25);border-radius:16px;padding:20px;margin-bottom:16px}
.ai-panel-header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.ai-profile-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.ai-profile-row:last-child{border-bottom:none}
.ai-status-indicator{display:flex;align-items:center;gap:6px;font-size:12px;color:#9ca3af;margin-top:10px}
/* ── Live camera real feed ── */
#live-camera-feed{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.live-cam-controls{position:absolute;top:56px;right:12px;display:flex;flex-direction:column;gap:8px;z-index:12}
.live-cam-btn{width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.55);border:none;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px)}
.live-cam-btn:hover{background:rgba(0,0,0,.75)}
/* ── Permission banner ── */
.perm-banner{background:rgba(30,20,60,.95);border:1px solid rgba(124,58,237,.4);border-radius:12px;padding:14px 18px;margin:12px 0;display:flex;align-items:center;gap:12px;font-size:13px}
.perm-banner-icon{font-size:28px;flex-shrink:0}
.perm-banner-btn{margin-left:auto;background:var(--accent);color:#fff;border:none;border-radius:8px;padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
/* ── DM System ── */
.dm-list{display:flex;flex-direction:column;gap:2px}
.dm-row{display:flex;align-items:center;gap:12px;padding:14px 20px;cursor:pointer;border-radius:12px;transition:background .15s}
.dm-row:hover{background:var(--surface2)}
.dm-row-info{flex:1;min-width:0}
.dm-row-name{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dm-row-preview{font-size:12px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.dm-row-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.dm-row-time{font-size:11px;color:var(--text3)}
.dm-unread-badge{background:var(--accent);color:#fff;border-radius:99px;padding:2px 7px;font-size:11px;font-weight:700}
.dm-thread{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 180px)}
.dm-msg{display:flex;flex-direction:column;max-width:72%}
.dm-msg-me{align-self:flex-end;align-items:flex-end}
.dm-msg-them{align-self:flex-start;align-items:flex-start}
.dm-bubble{padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.5;word-break:break-word}
.dm-msg-me .dm-bubble{background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.dm-msg-them .dm-bubble{background:var(--surface2);color:var(--text1);border-bottom-left-radius:4px}
.dm-time{font-size:10px;color:var(--text3);margin-top:3px;padding:0 4px}
.dm-input-bar{position:sticky;bottom:0;background:var(--bg);padding:12px 20px;display:flex;gap:10px;align-items:center;border-top:1px solid var(--border)}
.dm-input{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:24px;padding:10px 16px;color:var(--text1);font-size:14px;outline:none}
.dm-input:focus{border-color:var(--accent)}
/* ── Post Reactions ── */
.react-btn{position:relative}
.reaction-picker{position:fixed;background:var(--surface);border:1px solid var(--border);border-radius:40px;padding:6px 10px;display:flex;gap:4px;z-index:9999;box-shadow:0 8px 32px rgba(0,0,0,.4);animation:chatIn .15s ease}

// ─── Seed realistic 30-day analytics ───
function seedAnalytics(){
  const uid=session&&session.userId||'u1';
  if(analytics[uid])return;
  const now=Date.now();
  const DAY=86400000;
  // Generate 30 days of daily stats
  const dailyStats={};
  const followerHistory=[];
  let followerBase=Math.floor(Math.random()*200+80);
  for(let i=29;i>=0;i--){
    const d=new Date(now-i*DAY);
    const key=d.toISOString().slice(0,10);
    const weekday=d.getDay();// 0=Sun
    const isWeekend=weekday===0||weekday===6;
    const base=isWeekend?180:120;
    const views=Math.floor(base+Math.random()*base*0.8+(i<7?50:0));
    const likes=Math.floor(views*0.08+Math.random()*10);
    const comments=Math.floor(likes*0.3);
    const gain=Math.floor(Math.random()*8+(i<7?3:0));
    followerBase+=gain;
    dailyStats[key]={views,likes,comments,reach:Math.floor(views*1.4),newFollowers:gain};
    followerHistory.push({date:key,count:followerBase});
  }
  // 24-hour engagement pattern (typical Taiwan night-owl pattern)
  const hourlyStats=[8,5,3,2,2,3,7,15,22,28,30,32,35,30,28,25,30,38,55,82,95,88,72,45];
  // 7-day weekday pattern [Mon,Tue,Wed,Thu,Fri,Sat,Sun]
  const weekdayStats=[320,290,315,340,380,520,490];
  // Traffic sources
  const trafficSources={home:42,explore:28,profile:15,hashtag:10,share:5};
  // Post views (distribute views across my posts)
  const myPosts=posts.filter(p=>p.userId===uid);
  const postViews={};
  myPosts.forEach((p,i)=>{
    postViews[p.id]=Math.floor(300+Math.random()*800*(1-i*0.1));
  });
  // Content type performance
  const contentTypePerf={
    text:{views:1240,count:4,avgLikes:18},
    image:{views:3800,count:2,avgLikes:52},
    video:{views:5200,count:1,avgLikes:89},
    poll:{views:2100,count:2,avgLikes:34}
  };
  analytics[uid]={dailyStats,followerHistory,hourlyStats,weekdayStats,trafficSources,postViews,contentTypePerf,lastUpdated:now};
  saveAnalytics();
}

// Track a post being viewed
function trackPostView(postId,source='home'){
  if(!session)return;
  const uid=session.userId;
  if(!analytics[uid])seedAnalytics();
  const a=analytics[uid];
  // Update post views
  a.postViews=a.postViews||{};
  a.postViews[postId]=(a.postViews[postId]||0)+1;
  // Update today's daily stats
  const today=new Date().toISOString().slice(0,10);
  if(!a.dailyStats[today])a.dailyStats[today]={views:0,likes:0,comments:0,reach:0,newFollowers:0};
  const post=posts.find(p=>p.id===postId);
  if(post&&post.userId===uid){
    a.dailyStats[today].views++;
    a.dailyStats[today].reach=Math.floor(a.dailyStats[today].views*1.4);
  }
  // Update hourly stats
  const hour=new Date().getHours();
  a.hourlyStats=a.hourlyStats||Array(24).fill(0);
  a.hourlyStats[hour]=(a.hourlyStats[hour]||0)+1;
  // Update traffic source
  a.trafficSources=a.trafficSources||{home:0,explore:0,profile:0,hashtag:0,share:0};
  a.trafficSources[source]=(a.trafficSources[source]||0)+1;
  saveAnalytics();
}

// ─── Content keyword analysis ───
function analyzeTopContent(userId){
  const myPosts=posts.filter(p=>p.userId===userId);
  if(!myPosts.length)return{keywords:[],topType:'text',insight:''};
  const a=analytics[userId]||{};
  const postViews=a.postViews||{};
  // Score each post: views + engagement
  const scored=myPosts.map(p=>({
    ...p,
    totalScore:(postViews[p.id]||0)+(p.likes?.length||0)*3+(p.comments||0)*2+(p.reposts?.length||0)*2
  })).sort((a,b)=>b.totalScore-a.totalScore);
  const topThird=scored.slice(0,Math.max(1,Math.ceil(scored.length*0.4)));
  // Extract keywords (skip stopwords)
  const stopSet=new Set(['的','了','是','在','和','也','就','都','但','這','那','他','你','我','很','有','沒','到','不','一','個','她','它','我們','你們','他們','地','得','過','著','或','因為','所以','雖然','如果','而且','還是','還有','什麼','可以','已經','只是','還是','就是','因此','所以','哈哈','！','？','…','。','，','：','；']);
  const wordFreq={};
  topThird.forEach(p=>{
    const words=p.content.split(/[\s，。！？、：；「」『』【】\(\)（）\n#@]+/u).filter(w=>w.length>=2&&!stopSet.has(w));
    words.forEach(w=>{wordFreq[w]=(wordFreq[w]||0)+1;});
  });
  const keywords=Object.entries(wordFreq).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([w])=>w);
  // Best content type
  const typeScore={};
  scored.forEach(p=>{const t=p.mediaType?p.mediaType:p.type==='poll'?'poll':'text';typeScore[t]=(typeScore[t]||0)+p.totalScore;});
  const topType=Object.entries(typeScore).sort((a,b)=>b[1]-a[1])[0]?.[0]||'text';
  const typeNames={text:'純文字',image:'圖片',video:'影片',poll:'投票'};
  // Best hour
  const hourly=a.hourlyStats||Array(24).fill(0);
  const bestHour=hourly.indexOf(Math.max(...hourly));
  const insight=`你的 ${typeNames[topType]||topType} 貼文平均觸及最高，最佳發文時段為 ${bestHour}:00–${bestHour+1}:00`;
  return{keywords,topType,insight,scored:scored.slice(0,5)};
}

function isFollowing(targetId){
  if(!session)return false;
  const me=users.find(u=>u.id===session.userId);
  return me&&me.following&&me.following.includes(targetId);
}
function toggleFollow(targetId){
  if(!session||targetId===session.userId)return;
  const me=users.find(u=>u.id===session.userId);
  const target=users.find(u=>u.id===targetId);
  if(!me||!target)return;
  if(!me.following)me.following=[];
  if(!target.followers)target.followers=[];
  const idx=me.following.indexOf(targetId);
  if(idx>=0){
    me.following.splice(idx,1);
    target.followers.splice(target.followers.indexOf(session.userId),1);
    toast('已取消追蹤','info');
  } else {
    me.following.push(targetId);
    target.followers.push(session.userId);
    addNotificationForUser('follow',session.userId,targetId,null,'開始追蹤你');
    toast('已追蹤 '+target.displayName,'success');
  }
  saveUsers();
  session.following=me.following;saveSession();
  // Re-render any follow buttons on page
  document.querySelectorAll(`[data-follow="${targetId}"]`).forEach(btn=>{
    const following=isFollowing(targetId);
    btn.className=following?'btn-following':'btn-follow';
    btn.textContent=following?'已追蹤':'追蹤';
  });
  updateNotifBadge();
}

function handleMediaFiles(input){
  const file=input.files[0];if(!file)return;
  if(file.size>50*1024*1024){toast('檔案過大（最大50MB）','error');input.value='';return}
  const isVideo=file.type.startsWith('video/');
  const isImage=file.type.startsWith('image/');
  if(!isVideo&&!isImage){toast('僅支援圖片或影片檔案','error');input.value='';return}
  const reader=new FileReader();
  reader.onload=e=>{
    composerMediaUrl=e.target.result;
    composerMediaType=isVideo?'video':'image';
    renderComposerMediaPreview();
  };
  reader.readAsDataURL(file);
  input.value='';
}
function renderComposerMediaPreview(){
  const area=document.getElementById('composer-media-area');
  if(!area)return;
  if(!composerMediaUrl){area.innerHTML='';return;}
  if(composerMediaType==='video'){
    area.innerHTML=`<div class="composer-media-preview"><video src="${composerMediaUrl}" class="post-media-video" controls playsinline muted style="max-height:200px"></video><button class="remove-media" onclick="clearComposerMedia()">✕</button></div>`;
  } else {
    area.innerHTML=`<div class="composer-media-preview"><img src="${composerMediaUrl}" class="post-media" style="max-height:200px"/><button class="remove-media" onclick="clearComposerMedia()">✕</button></div>`;
  }
}
function clearComposerMedia(){composerMediaUrl=null;composerMediaType=null;renderComposerMediaPreview();}
function handleStoryMedia(input){
  const file=input.files[0];if(!file)return;
  if(file.size>50*1024*1024){toast('檔案過大（最大50MB）','error');input.value='';return}
  const isVideo=file.type.startsWith('video/');
  const isImage=file.type.startsWith('image/');
  if(!isVideo&&!isImage){toast('僅支援圖片或影片檔案','error');input.value='';return}
  const reader=new FileReader();
  reader.onload=e=>{
    storyMediaUrl=e.target.result;
    storyMediaType=isVideo?'video':'image';
    const prev=document.getElementById('story-preview');
    if(prev){
      if(isVideo){prev.innerHTML=`<video src="${storyMediaUrl}" style="width:100%;height:100%;object-fit:cover;border-radius:8px" autoplay muted loop playsinline></video>`;}
      else{prev.innerHTML=`<img src="${storyMediaUrl}" style="width:100%;height:100%;object-fit:cover;border-radius:8px"/>`;}
    }
    const storyTextEl=document.getElementById('story-text');
    if(storyTextEl&&!storyTextEl.value)storyTextEl.value='';
  };
  reader.readAsDataURL(file);
  input.value='';
}

function setFeedFilter(f){
  feedFilter=f;
  const feed=document.getElementById('feed');
  if(feed){feed.innerHTML=renderFeedHTML(getFilteredPosts());_applyIcons(feed);}
  document.querySelectorAll('.feed-tab').forEach(t=>{t.classList.toggle('active',t.textContent===(f==='all'?'全部':'追蹤中'))});
}
function getFilteredPosts(){
  if(feedFilter==='all')return posts;
  const me=users.find(u=>u.id===session.userId);
  if(!me||!me.following||!me.following.length)return [];
  return posts.filter(p=>me.following.includes(p.userId)||p.userId===session.userId);
}
function renderStoryBarHTML(){
  const grouped=groupStories();
  let html=`<div class="story-bar">
  <div class="add-story-btn" onclick="openCreateStoryDialog()">
    <div class="add-story-ring"><i class="ti ti-plus"></i></div>
    <span class="story-name">新增動態</span>
  </div>`;
  for(let gi=0;gi<grouped.length;gi++){
    const g=grouped[gi];
    const seen=g.stories.every(s=>s.seen.includes(session.userId));
    html+=`<div class="story-circle" onclick="openStoryViewer(${gi})">
      <div class="story-ring ${seen?'seen':''}">
        <div class="story-inner">${avatarHTML(g.displayName,g.avatarColor,'')}</div>
      </div>
      <span class="story-name">${esc(g.displayName)}</span>
    </div>`;
  }
  return html+'</div>';
}
function groupStories(){
  const map={};
  for(const s of stories){
    if(!map[s.userId])map[s.userId]={userId:s.userId,username:s.username,displayName:s.displayName,avatarColor:s.avatarColor,stories:[]};
    map[s.userId].stories.push(s);
  }
  return Object.values(map);
}

function renderFeedHTML(arr,source='home'){
  const sorted=[...arr].sort((a,b)=>b.createdAt-a.createdAt);
  if(!sorted.length)return '<div class="empty-state"><i class="ti ti-notes-off"></i><p>還沒有貼文，快去追蹤一些人吧！</p></div>';
  // Track views for each post's owner
  sorted.forEach(p=>{if(p.userId!==session?.userId)trackPostView(p.id,source);});
  return sorted.map(p=>renderPostHTML(p)).join('');
}
function renderPostHTML(p){
  if(!p)return '';
  const liked=p.likes&&p.likes.includes(session.userId);
  const reposted=p.reposts&&p.reposts.includes(session.userId);
  const bms=bookmarks[session.userId]||[];
  const bmd=bms.includes(p.id);
  const isOwn=p.userId===session.userId;
  const following=isFollowing(p.userId);
  let mediaHTML='';
  if(p.mediaUrl){
    if(p.mediaType==='video'){
      mediaHTML=`<video src="${p.mediaUrl}" class="post-media-video" controls playsinline muted></video>`;
    } else {
      mediaHTML=`<img src="${p.mediaUrl}" class="post-media" loading="lazy"/>`;
    }
  }
  let pollHTML='';
  if(p.type==='poll'&&p.poll){pollHTML=renderPollHTML(p);}
  let quoteHTML='';
  if(p.type==='quote'&&p.quotedPostId){
    const qp=posts.find(x=>x.id===p.quotedPostId);
    if(qp){quoteHTML=`<div class="quote-embed"><div class="quote-author">${esc(qp.displayName)} @${esc(qp.username)}</div><div class="quote-text">${esc(qp.content)}</div></div>`;}
    else if(p.quotedContent){quoteHTML=`<div class="quote-embed"><div class="quote-author">${esc(p.quotedAuthor||'')}</div><div class="quote-text">${esc(p.quotedContent)}</div></div>`;}
  }
  const commentCount=(comments[p.id]||[]).length||p.comments||0;
  const followBtn=(!isOwn)?`<button class="${following?'btn-following':'btn-follow'}" data-follow="${p.userId}" onclick="toggleFollow('${p.userId}')" style="margin-left:auto">${following?'已追蹤':'追蹤'}</button>`:'';
  return `<div class="post" id="post-${p.id}">
    <div class="post-header">
      <div style="cursor:pointer" onclick="openUserProfile('${p.userId}')">${avatarHTML(p.displayName,p.avatarColor,'avatar-sm')}</div>
      <div class="post-meta">
        <span class="dname" onclick="openUserProfile('${p.userId}')">${esc(p.displayName)}</span>
        <span class="handle" onclick="openUserProfile('${p.userId}')">@${esc(p.username)}</span>
        <span class="time">${timeAgo(p.createdAt)}</span>
      </div>
      ${followBtn}
    </div>
    <div class="post-content">${esc(p.content).replace(/\n/g,'<br>')}</div>
    ${mediaHTML}${quoteHTML}${pollHTML}
    <div class="post-actions">
      <button class="post-action react-btn ${liked?'liked':''}" onclick="showReactionPicker('${p.id}',this)" title="按讚或選擇反應">
        <span class="${myReactionEmoji(p.id)?'my-react':''}">${myReactionEmoji(p.id)||'<i class="ti ti-heart"></i>'}</span><span>${(p.likes||[]).length}</span><span id="react-summary-${p.id}">${buildReactSummaryHTML(p.id)}</span>
      </button>
      <button class="post-action" onclick="openComments('${p.id}')">
        <i class="ti ti-message-circle"></i><span>${commentCount}</span>
      </button>
      <button class="post-action ${reposted?'reposted':''}" onclick="showRepostMenu('${p.id}',this)" style="position:relative">
        <i class="ti ti-repeat"></i><span>${(p.reposts||[]).length}</span>
      </button>
      <button class="post-action ${bmd?'bookmarked':''}" onclick="toggleBookmark('${p.id}')">
        <i class="ti ${bmd?'ti-bookmark-filled':'ti-bookmark'}"></i>
      </button>
      <button class="post-action" onclick="copyPostLink('${p.id}')">
        <i class="ti ti-share"></i>
      </button>
    </div>
  </div>`;
}

function toggleLike(id){
  const p=posts.find(x=>x.id===id);if(!p)return;
  if(!p.likes)p.likes=[];
  const idx=p.likes.indexOf(session.userId);
  if(idx>=0){p.likes.splice(idx,1);}
  else{
    p.likes.push(session.userId);
    if(p.userId!==session.userId)addNotificationForUser('like',session.userId,p.userId,id,'');
  }
  savePosts();
  const el=document.getElementById('post-'+id);
  if(el){const newEl=document.createElement('div');newEl.innerHTML=renderPostHTML(p);el.replaceWith(newEl.firstChild);_applyIcons(document.getElementById('post-'+id));}
}
function showRepostMenu(id,btn){
  document.querySelectorAll('.action-dropdown').forEach(d=>d.remove());
  const menu=document.createElement('div');
  menu.className='action-dropdown';
  menu.innerHTML=`<div class="action-dropdown-item" onclick="directRepost('${id}')"><i class="ti ti-repeat"></i>直接轉發</div><div class="action-dropdown-item" onclick="openQuoteRepost('${id}')"><i class="ti ti-quote"></i>引用轉發</div>`;
  const wrap=btn.closest('.post-actions');
  if(wrap){wrap.style.position='relative';wrap.appendChild(menu);}
  setTimeout(()=>document.addEventListener('click',function h(){menu.remove();document.removeEventListener('click',h);}),10);
}
function directRepost(id){
  document.querySelectorAll('.action-dropdown').forEach(d=>d.remove());
  const p=posts.find(x=>x.id===id);if(!p)return;
  if(!p.reposts)p.reposts=[];
  const idx=p.reposts.indexOf(session.userId);
  if(idx>=0){p.reposts.splice(idx,1);toast('取消轉發','info');}
  else{
    p.reposts.push(session.userId);
    if(p.userId!==session.userId)addNotificationForUser('repost',session.userId,p.userId,id,'');
    toast('已轉發','success');
  }
  savePosts();
  const el=document.getElementById('post-'+id);
  if(el){const newEl=document.createElement('div');newEl.innerHTML=renderPostHTML(p);el.replaceWith(newEl.firstChild);_applyIcons(document.getElementById('post-'+id));}
}
function openQuoteRepost(id){
  document.querySelectorAll('.action-dropdown').forEach(d=>d.remove());
  const p=posts.find(x=>x.id===id);if(!p)return;
  openDialog(`<h2>引用轉發</h2>

    <div class="form-group"><textarea id="quote-text" placeholder="加入你的想法..." rows="3"></textarea></div>

    <div class="dialog-footer">
      <button class="btn btn-ghost" onclick="closeDialog()">取消</button>
      <button class="btn btn-primary" onclick="submitQuoteRepost('${id}')">發布引用</button>
    </div>`);
}
function submitQuoteRepost(quotedPostId){
  const txt=document.getElementById('quote-text').value.trim();

  const p={

function toggleBookmark(id){
  if(!bookmarks[session.userId])bookmarks[session.userId]=[];

  const idx=bms.indexOf(id);
  if(idx>=0){bms.splice(idx,1);toast('已移除收藏','info');}

  saveBookmarks();
  const el=document.getElementById('post-'+id);
  const p=posts.find(x=>x.id===id);
  if(el&&p){const newEl=document.createElement('div');newEl.innerHTML=renderPostHTML(p);el.replaceWith(newEl.firstChild);_applyIcons(document.getElementById('post-'+id));}
}

function submitComment(postId){
  const input=document.getElementById('comment-input');
  if(!input)return;

  if(!txt){toast('請輸入留言內容','error');return}

  const c={id:uid(),userId:session.userId,username:session.username,displayName:session.displayName,avatarColor:session.avatarColor,text:txt,createdAt:Date.now()};
  comments[postId].push(c);saveComments();
  const p=posts.find(x=>x.id===postId);
  if(p){p.comments=(comments[postId]||[]).length;savePosts();}
  if(p&&p.userId!==session.userId)addNotificationForUser('comment',session.userId,p.userId,postId,txt);
  input.value='';
  const list=document.getElementById('comment-list');
  if(list){
    const div=document.createElement('div');
    div.innerHTML=`<div class="comment-item">
      <div>${avatarHTML(c.displayName,c.avatarColor,'avatar-sm')}</div>

        <div class="comment-author">${esc(c.displayName)} <span style="color:var(--text3);font-weight:400">@${esc(c.username)}</span></div>

  if(postEl&&p){const newEl=document.createElement('div');newEl.innerHTML=renderPostHTML(p);postEl.replaceWith(newEl.firstChild);_applyIcons(document.getElementById('post-'+postId));}
}

function renderPollHTML(p){
  const voted=pollVotes[p.id];
  const total=p.poll.options.reduce((a,o)=>a+o.votes,0)||1;
  const expires=p.poll.expiresAt;
  const remaining=Math.max(0,Math.floor((expires-Date.now())/3600000));
  let opts=p.poll.options.map((o,i)=>{
    const pct=voted!=null?Math.round(o.votes/total*100):0;
    return `<div class="poll-option">
      <button class="poll-option-btn ${voted!=null?'voted':''}" onclick="${voted==null?`votePoll('${p.id}',${i})`:''}">
        ${voted!=null?`<div class="poll-bar" style="width:${pct}%"></div>`:''}
        <span class="poll-option-text"><span>${esc(o.text)}</span>${voted!=null?`<span>${pct}%</span>`:''}</span>
      </button>
    </div>`;
  }).join('');
  return `<div class="poll-container">
    <div class="poll-question">${esc(p.poll.question)}</div>
    ${opts}
    <div class="poll-meta">${total} 票 · ${remaining>0?remaining+'小時後截止':'已截止'}</div>
  </div>`;
}
function votePoll(postId,optIndex){
  if(pollVotes[postId]!=null){toast('已投票','info');return}
  const p=posts.find(x=>x.id===postId);
  if(!p||!p.poll)return;
  p.poll.options[optIndex].votes++;
  pollVotes[postId]=optIndex;
  savePosts();savePollVotes();
  const el=document.getElementById('post-'+postId);
  if(el){const newEl=document.createElement('div');newEl.innerHTML=renderPostHTML(p);el.replaceWith(newEl.firstChild);_applyIcons(document.getElementById('post-'+postId));}
  toast('投票成功！','success');
}
function togglePollComposer(){
  const area=document.getElementById('poll-area');
  if(!area)return;
  if(pollComposerData){
    pollComposerData=null;area.innerHTML='';
    const btn=document.getElementById('poll-btn');if(btn)btn.style.color='';
    return;
  }
  pollComposerData={question:'',options:['','']};
  renderPollComposer();
  const btn=document.getElementById('poll-btn');if(btn)btn.style.color='var(--accent)';
}
function renderPollComposer(){
  const area=document.getElementById('poll-area');
  if(!area||!pollComposerData)return;
  let optsHTML=pollComposerData.options.map((o,i)=>`
    <div class="poll-option-input">
      <input type="text" placeholder="選項 ${i+1}" value="${esc(o)}" oninput="pollComposerData.options[${i}]=this.value" maxlength="40"/>
      ${pollComposerData.options.length>2?`<button onclick="removePollOption(${i})"><i class="ti ti-x"></i></button>`:''}
    </div>`).join('');
  area.innerHTML=`<div class="poll-create">
    <h4><i class="ti ti-chart-bar"></i> 建立投票</h4>
    <div class="form-group"><input type="text" placeholder="投票問題" oninput="pollComposerData.question=this.value" maxlength="80" value="${esc(pollComposerData.question)}"/></div>
    <div class="poll-options-list">${optsHTML}</div>
    ${pollComposerData.options.length<4?`<button class="btn btn-ghost btn-sm" onclick="addPollOption()"><i class="ti ti-plus"></i> 新增選項</button>`:''}
  </div>`;
  _applyIcons(area);
}
function addPollOption(){if(pollComposerData&&pollComposerData.options.length<4){pollComposerData.options.push('');renderPollComposer();}}
function removePollOption(i){if(pollComposerData){pollComposerData.options.splice(i,1);renderPollComposer();}}

// ═══════════════════════════════════════════════════════════
// SUBMIT POST
// ═══════════════════════════════════════════════════════════
function submitPost(galaxyId){
  const txt=document.getElementById('compose-text').value.trim();
  if(!txt&&!pollComposerData&&!composerMediaUrl){toast('請輸入內容或選擇媒體','error');return}
  const p={
    id:uid(),userId:session.userId,username:session.username,
    displayName:session.displayName,avatarColor:session.avatarColor,
    content:txt||(pollComposerData?pollComposerData.question:'')||'',
    likes:[],reposts:[],comments:0,createdAt:Date.now(),
    type:pollComposerData?'poll':'post'
  };
  if(composerMediaUrl){p.mediaUrl=composerMediaUrl;p.mediaType=composerMediaType;}
  if(galaxyId)p.galaxyId=galaxyId;
  if(pollComposerData){
    const opts=pollComposerData.options.filter(o=>o.trim());
    if(opts.length<2){toast('請至少填寫2個選項','error');return}
    p.poll={question:pollComposerData.question||txt,options:opts.map(t=>({text:t,votes:0})),totalVotes:0,expiresAt:Date.now()+86400000};
  }
  posts.unshift(p);savePosts();
  document.getElementById('compose-text').value='';
  pollComposerData=null;composerMediaUrl=null;composerMediaType=null;
  const feed=document.getElementById('feed');
  if(feed){const div=document.createElement('div');div.innerHTML=renderPostHTML(p);feed.insertBefore(div.firstChild,feed.firstChild);_applyIcons(feed);}
  const area=document.getElementById('poll-area');if(area)area.innerHTML='';
  const mediaArea=document.getElementById('composer-media-area');if(mediaArea)mediaArea.innerHTML='';
  const btn=document.getElementById('poll-btn');if(btn)btn.style.color='';
  toast('發布成功！','success');
}

function renderBubbles(){
  let storyCardsHTML=stories.map(s=>{

    } else if(s.mediaUrl&&s.mediaType==='image'){
      previewContent=`<img src="${s.mediaUrl}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0"/>`;
    }

      <div style="color:#fff;font-size:14px;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.7);position:relative;z-index:2">${esc(s.text||'').replace(/\n/g,'<br>')}</div>
    </div>`;
  }).join('');
  return `
  <div class="page-title"><i class="ti ti-bubble" style="color:var(--orange)"></i>限時動態</div>
  ${renderStoryBarHTML()}
  <div style="display:flex;justify-content:flex-end;margin-bottom:16px">
    <button class="btn btn-primary" onclick="openCreateStoryDialog()"><i class="ti ti-plus"></i> 新增動態</button>
  </div>
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px">${storyCardsHTML||'<div class="empty-state"><i class="ti ti-bubble"></i><p>還沒有故事</p></div>'}</div>`;
}
function openStoryViewerById(sid){
  const grouped=groupStories();
  for(let gi=0;gi<grouped.length;gi++){
    const si=grouped[gi].stories.findIndex(s=>s.id===sid);
    if(si>=0){openStoryViewer(gi,si);return;}
  }
}
function openStoryViewer(groupIdx,storyIdx=0){
  storyGroups=groupStories();
  if(!storyGroups.length)return;
  storyGroupIndex=groupIdx;storyIndex=storyIdx;
  showCurrentStory();
  document.getElementById('story-viewer').classList.remove('hidden');
}
function showCurrentStory(){
  if(storyTimer)clearTimeout(storyTimer);
  const g=storyGroups[storyGroupIndex];if(!g)return closeStoryViewer();
  const s=g.stories[storyIndex];if(!s)return closeStoryViewer();
  if(!s.seen.includes(session.userId)){s.seen.push(session.userId);saveStories();}
  const inner=document.getElementById('story-viewer-inner');
  const bodyEl=document.getElementById('story-body');
  const videoEl=document.getElementById('story-video');
  // Reset
  videoEl.classList.add('hidden');videoEl.pause();videoEl.src='';
  bodyEl.style.zIndex='1';
  if(s.mediaType==='video'&&s.mediaUrl){
    inner.style.background='#000';
    videoEl.src=s.mediaUrl;videoEl.classList.remove('hidden');
    videoEl.play().catch(()=>{});
    bodyEl.textContent=s.text||'';
    bodyEl.style.zIndex='2';
    bodyEl.style.textShadow='0 2px 8px rgba(0,0,0,.8)';
  } else if(s.mediaType==='image'&&s.mediaUrl){
    inner.style.background=`url('${s.mediaUrl}') center/cover no-repeat`;
    bodyEl.textContent=s.text||'';
    bodyEl.style.textShadow='0 2px 8px rgba(0,0,0,.8)';
  } else {
    inner.style.background=s.bg||'var(--panel)';
    bodyEl.textContent=s.text||'';
    bodyEl.style.textShadow='';
  }
  document.getElementById('story-author').innerHTML=`${avatarHTML(s.displayName,s.avatarColor,'avatar-sm')}<span class="dname">${esc(s.displayName)}</span>`;
  const total=g.stories.length;
  let bars='';
  for(let i=0;i<total;i++){bars+=`<div class="story-seg"><div class="story-seg-fill ${i<storyIndex?'done':''}" id="seg-${i}"></div></div>`;}
  document.getElementById('story-progress').innerHTML=bars;
  if(storyIndex<total){
    const fill=document.getElementById(`seg-${storyIndex}`);
    if(fill){fill.style.transition='width 5s linear';requestAnimationFrame(()=>requestAnimationFrame(()=>fill.style.width='100%'));}
  }
  storyTimer=setTimeout(()=>storyNav(1),5100);
}
function storyNav(dir){
  if(storyTimer)clearTimeout(storyTimer);
  const g=storyGroups[storyGroupIndex];if(!g)return;
  if(dir>0){
    if(storyIndex<g.stories.length-1){storyIndex++;showCurrentStory();}
    else if(storyGroupIndex<storyGroups.length-1){storyGroupIndex++;storyIndex=0;showCurrentStory();}
    else closeStoryViewer();
  }else{
    if(storyIndex>0){storyIndex--;showCurrentStory();}
    else if(storyGroupIndex>0){storyGroupIndex--;storyIndex=0;showCurrentStory();}
  }
}
function closeStoryViewer(){
  if(storyTimer)clearTimeout(storyTimer);
  const v=document.getElementById('story-video');if(v){v.pause();v.src='';}
  document.getElementById('story-viewer').classList.add('hidden');
}
function openCreateStoryDialog(){
  storyMediaUrl=null;storyMediaType=null;
  openDialog(`<h2>✨ 新增限時動態</h2>
    <button class="dialog-close" onclick="closeDialog()"><i class="ti ti-x"></i></button>
    <div class="form-group"><label>說些什麼...</label><textarea id="story-text" placeholder="今天發生什麼事？" rows="3"></textarea></div>
    <div class="form-group">

    </div>
    <div class="form-group"><label>背景顏色</label>
      <div style="display:flex;gap:8px;flex-wrap:wrap" id="bg-picker">
        ${['linear-gradient(135deg,#1e1b4b,#7c3aed)','linear-gradient(135deg,#0c4a6e,#0891b2)','linear-gradient(135deg,#1a1a2e,#e94560)','linear-gradient(135deg,#0f2027,#203a43,#2c5364)','linear-gradient(135deg,#1c1917,#44403c)','linear-gradient(135deg,#052e16,#14532d)','linear-gradient(135deg,#450a0a,#991b1b)','linear-gradient(135deg,#2d1b69,#11998e)'].map((bg,i)=>`<div class="bg-opt" data-bg="${bg}" onclick="selectStoryBg(this,'${bg}')" style="width:40px;height:40px;border-radius:8px;background:${bg};cursor:pointer;border:2px solid ${i===0?'#fff':'transparent'};transition:border-color .2s"></div>`).join('')}

    const prev=document.getElementById('story-preview');

function selectStoryBg(el,bg){

}
function submitStory(){
  const txt=document.getElementById('story-text').value.trim();
  if(!txt&&!storyMediaUrl){toast('請輸入故事內容或選擇媒體','error');return}
  const s={id:uid(),userId:session.userId,username:session.username,displayName:session.displayName,avatarColor:session.avatarColor,text:txt,bg:selectedStoryBg,createdAt:Date.now(),seen:[]};
  if(storyMediaUrl){s.mediaUrl=storyMediaUrl;s.mediaType=storyMediaType;}
  stories.unshift(s);saveStories();

  closeDialog();toast('限時動態已發布！','success');

}

function setSearchTab(tab){

function runSearch(q){
  const res=document.getElementById('search-results');

}
function renderSearchResults(q){
  q=q.trim().toLowerCase();
  if(!q)return '<div class="empty-state" style="padding:40px"><i class="ti ti-search"></i><p>輸入關鍵字開始搜尋</p></div>';
  if(searchTab==='posts'){
    const matched=posts.filter(p=>p.content&&p.content.toLowerCase().includes(q));
    if(!matched.length)return '<div class="empty-state" style="padding:40px"><i class="ti ti-notes-off"></i><p>找不到相符的貼文</p></div>';
    return renderFeedHTML(matched);
  } else {
    const matched=users.filter(u=>(u.displayName&&u.displayName.toLowerCase().includes(q))||(u.username&&u.username.toLowerCase().includes(q)));
    if(!matched.length)return '<div class="empty-state" style="padding:40px"><i class="ti ti-user-off"></i><p>找不到相符的用戶</p></div>';
    return `<div>${matched.map(u=>{
      const following=isFollowing(u.id);
      const isOwn=u.id===session.userId;
      return `<div class="user-list-item">
        <div style="cursor:pointer" onclick="openUserProfile('${u.id}')">${avatarHTML(u.displayName,u.avatarColor,'avatar-md')}</div>
        <div style="flex:1;cursor:pointer" onclick="openUserProfile('${u.id}')">
          <div style="font-weight:600">${esc(u.displayName)}</div>
          <div style="color:var(--text3);font-size:13px">@${esc(u.username)}</div>
          ${u.bio?`<div style="font-size:13px;color:var(--text2);margin-top:2px">${esc(u.bio)}</div>`:''}
        </div>
        ${!isOwn?`<button class="${following?'btn-following':'btn-follow'}" data-follow="${u.id}" onclick="toggleFollow('${u.id}')">${following?'已追蹤':'追蹤'}</button>`:''}
      </div>`;
    }).join('')}</div>`;
  }
}

    <p style="font-size:12px;color:var(--text2)">根據你的受眾活躍數據，建議在 <strong style="color:var(--orange)">${peakHour}:00–${peakHour+2}:00</strong> 發文，觸及率最高可達平均值的 <strong style="color:var(--orange)">${Math.round(hourly[peakHour]/Math.max(1,...hourly.map((v,i)=>i!==peakHour?v:0))*10)/10}×</strong></p>
  </div>
  <div class="insight-card" style="background:linear-gradient(135deg,rgba(34,197,94,.1),rgba(20,184,166,.08));border-color:rgba(34,197,94,.25)">
    <h4>📱 內容類型表現</h4>
    ${Object.entries(a.contentTypePerf||{}).map(([t,v])=>`
    <div style="display:flex;justify-content:space-between;font-size:12px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.06)">
      <span>${typeNames2[t]||t}</span>
      <span style="color:var(--teal)">平均 ${Math.round(v.views/(v.count||1))} 次瀏覽 · ❤️ ${v.avgLikes}</span>
    </div>`).join('')}
  </div>`;

  // ── Follower growth ──
  const fhData=(a.followerHistory||[]).slice(-14);
  const maxF=Math.max(...fhData.map(d=>d.count),1);
  const minF=Math.min(...fhData.map(d=>d.count),0);
  const followerChart=`<div class="bar-chart" style="height:70px">${fhData.map(d=>{
    const pct=Math.round((d.count-minF)/(maxF-minF+1)*100);
    return `<div class="bar-col">
      <div class="bar-fill" style="height:${Math.max(pct,5)}%;background:linear-gradient(180deg,#22c55e,#14b8a6)"></div>
      <div class="bar-lbl">${d.date.slice(8)}</div>
    </div>`;
  }).join('')}</div>`;

  // ── Tab rendering ──
  const tabs=['overview','posts','audience','insights'];
  const tabNames={overview:'總覽',posts:'貼文',audience:'受眾',insights:'洞察'};
  const tabContent={
    overview:`
      <div class="analytics-overview">
        <div class="analytics-kpi"><div class="kpi-val">${totalViews.toLocaleString()}</div><div class="kpi-label">30天總觸及</div><div class="kpi-delta ${delta>=0?'kpi-up':'kpi-down'}">${delta>=0?'↑':'↓'}${Math.abs(delta)}% vs 上週</div></div>
        <div class="analytics-kpi"><div class="kpi-val">${totalReach.toLocaleString()}</div><div class="kpi-label">總覆蓋人數</div></div>
        <div class="analytics-kpi"><div class="kpi-val">${totalLikes.toLocaleString()}</div><div class="kpi-label">累積按讚</div></div>
        <div class="analytics-kpi"><div class="kpi-val">${totalFollowers.toLocaleString()}</div><div class="kpi-label">追蹤者總數</div></div>
      </div>
      <div class="analytics-section"><div class="analytics-section-title">📈 每日瀏覽量（近14天）</div>${barChart}</div>
      <div class="analytics-section"><div class="analytics-section-title">🚦 流量來源</div>${trafficHTML}</div>`,
    posts:`
      <div class="analytics-section"><div class="analytics-section-title">🏆 表現最好的貼文</div>${topPostsHTML}</div>`,
    audience:`
      <div class="analytics-section"><div class="analytics-section-title">📅 每週活躍分布</div>${wdChart}</div>
      <div class="analytics-section"><div class="analytics-section-title">⏱ 24小時互動熱力圖 <span style="font-size:11px;color:var(--text3)">（顏色越深流量越高）</span></div>${heatmap}<div style="text-align:center;font-size:12px;color:var(--accent2);margin-top:6px;font-weight:600">🔥 高峰時段：${peakHour}:00–${peakHour+2}:00</div></div>
      <div class="analytics-section"><div class="analytics-section-title">📊 追蹤者成長（近14天）</div>${followerChart}</div>`,
    insights:insightHTML
  };

  return `
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
    <button class="back-btn" onclick="navigate('settings')" style="margin:0">← 返回設定</button>
    <div style="font-size:18px;font-weight:800">📊 個人數據後台</div>
    <button class="btn btn-ghost btn-sm" style="margin-left:auto;font-size:12px" onclick="seedAnalytics();renderPage('analytics')">🔄 重新整理</button>
  </div>
  <!-- Creator badges -->
  <div class="creator-badges">
    <div class="creator-badge"><span class="badge-icon">🔥</span><span>連續發文 <strong>${Math.floor(Math.random()*14+3)}</strong> 天</span></div>
    <div class="creator-badge"><span class="badge-icon">⭐</span><span>創作者積分 <strong>${(totalLikes*3+totalViews).toLocaleString()}</strong></span></div>
    <div class="creator-badge"><span class="badge-icon">📈</span><span>本週觸及 <strong>${last7.toLocaleString()}</strong></span></div>
  </div>
  <!-- Tabs -->
  <div class="analytics-tab">${tabs.map(t=>`<div class="analytics-tab-btn ${analyticsTab===t?'active':''}" onclick="setAnalyticsTab('${t}')">${tabNames[t]}</div>`).join('')}</div>
  <div id="analytics-content">${tabContent[analyticsTab]||''}</div>`;
}
function setAnalyticsTab(tab){
  analyticsTab=tab;
  const el=document.getElementById('analytics-content');

}

function handleAvatarUpload(input){
  const file=input.files[0];if(!file)return;

  if(file.size>5*1024*1024){toast('圖片過大（最大5MB）','error');return;}
  const reader=new FileReader();
  reader.onload=function(e){
    const url=e.target.result;
    const u=users.find(x=>x.id===session.userId);
    if(u){u.avatarUrl=url;saveUsers();}
    session.avatarUrl=url;saveSession();
    renderSidebarUser();
    renderPage(currentPage);

  reader.readAsDataURL(file);
  input.value='';
}

async function _requestCameraForLive(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    toast('此瀏覽器不支援相機存取','info');return;
  }
  try{
    const stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},
      audio:true
    });
    _cameraStream=stream;
    const vid=document.getElementById('live-camera-feed');
    if(vid){
      vid.srcObject=stream;
      vid.classList.remove('hidden');
      vid.play().catch(()=>{});
    }
    const bg=document.getElementById('live-video-bg');
    if(bg)bg.classList.add('hidden');
    toast('📷 相機已開啟','success');
  } catch(err){
    const name=err?.name||'';
    if(name==='NotAllowedError'||name==='PermissionDeniedError'){
      toast('相機權限被拒絕，使用模擬畫面 🎥','info');
    } else if(name==='NotFoundError'||name==='DevicesNotFoundError'){
      toast('找不到相機裝置，使用模擬畫面','info');
    } else if(name==='NotReadableError'||name==='TrackStartError'){
      toast('相機被其他應用佔用，使用模擬畫面','info');
    } else {
      toast('無法存取相機，使用模擬畫面','info');
    }
  }
}

async function _flipCamera(){
  if(!_cameraStream){toast('相機未開啟','error');return;}
  const track=_cameraStream.getVideoTracks()[0];
  const settings=track?track.getSettings():{};
  const newFacing=settings.facingMode==='environment'?'user':'environment';
  _cameraStream.getTracks().forEach(t=>t.stop());
  try{
    const stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:newFacing},audio:true
    });
    _cameraStream=stream;
    const vid=document.getElementById('live-camera-feed');
    if(vid){vid.srcObject=stream;vid.play().catch(()=>{});}
    toast(newFacing==='environment'?'後置相機':'前置相機','info');
  } catch(e){toast('切換鏡頭失敗','error');}
}

async function _toggleScreenShare(){
  const btn=document.getElementById('screen-share-btn');
  if(!navigator.mediaDevices?.getDisplayMedia){toast('此瀏覽器不支援螢幕分享','error');return;}
  if(_cameraStream&&_cameraStream._isScreen){
    // Stop screen share, go back to camera
    _cameraStream.getTracks().forEach(t=>t.stop());
    _cameraStream=null;
    await _requestCameraForLive();
    if(btn)btn.textContent='🖥';
    return;
  }
  try{
    const stream=await navigator.mediaDevices.getDisplayMedia({video:true,audio:true});
    if(_cameraStream)_cameraStream.getTracks().forEach(t=>t.stop());
    stream._isScreen=true;
    _cameraStream=stream;
    const vid=document.getElementById('live-camera-feed');
    if(vid){vid.srcObject=stream;vid.classList.remove('hidden');vid.play().catch(()=>{});}
    const bg=document.getElementById('live-video-bg');
    if(bg)bg.classList.add('hidden');
    if(btn)btn.textContent='📷';
    toast('螢幕分享已開始','success');
    stream.getVideoTracks()[0].addEventListener('ended',()=>{
      _cameraStream=null;
      if(vid){vid.srcObject=null;vid.classList.add('hidden');}
      if(bg)bg.classList.remove('hidden');
      if(btn)btn.textContent='🖥';
    });
  } catch(e){
    if(e?.name!=='AbortError')toast('螢幕分享被取消','info');
  }
}

// ═══════════════════════════════════════════════════════════
const REACTION_TYPES=['❤️','😂','😮','😢','😡','👍'];

function getPostReactions(postId){
  if(!reactions[postId])reactions[postId]={};
  return reactions[postId];
}

function myReactionEmoji(postId){
  if(!session)return null;
  return getPostReactions(postId)[session.userId]||null;
}

function buildReactSummaryHTML(postId){
  const r=getPostReactions(postId);
  const counts={};
  Object.values(r).forEach(e=>{counts[e]=(counts[e]||0)+1;});
  const total=Object.keys(r).length;
  if(total===0)return '';
  const top=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([e])=>e).join('');
  return `<span class="react-summary">${top} ${total}</span>`;
}

function setReaction(postId,emoji){
  const r=getPostReactions(postId);
  const uid=session.userId;
  const prev=r[uid];
  if(prev===emoji){delete r[uid];}
  else{r[uid]=emoji;}
  saveReactions();
  // Sync with post likes for backward compat
  const p=posts.find(x=>x.id===postId);
  if(p){
    if(!p.likes)p.likes=[];
    const hasReaction=!!r[uid];
    const inLikes=p.likes.includes(uid);
    if(hasReaction&&!inLikes)p.likes.push(uid);
    else if(!hasReaction&&inLikes)p.likes.splice(p.likes.indexOf(uid),1);
    savePosts();
    if(hasReaction&&p.userId!==uid)addNotificationForUser('like',uid,p.userId,postId,'');
  }
  // Re-render the post
  const el=document.getElementById('post-'+postId);
  if(el&&p){const tmp=document.createElement('div');tmp.innerHTML=renderPostHTML(p);el.replaceWith(tmp.firstChild);_applyIcons(document.getElementById('post-'+postId));}
  hideReactionPicker();
}

function showReactionPicker(postId,btn){
  // If already has a reaction, toggle it off on single click
  const existing=myReactionEmoji(postId);
  if(existing){setReaction(postId,existing);return;}
  hideReactionPicker();
  const picker=document.createElement('div');
  picker.className='reaction-picker';
  picker.id='rp-'+postId;
  picker.innerHTML=REACTION_TYPES.map(e=>`<button class="reaction-option" onclick="setReaction('${postId}','${e}');event.stopPropagation()">${e}</button>`).join('');
  const rect=btn.getBoundingClientRect();
  const left=Math.min(rect.left,window.innerWidth-240);
  const top=rect.top-58;
  picker.style.cssText=`position:fixed;left:${left}px;top:${top}px`;
  document.body.appendChild(picker);
  setTimeout(()=>{
    function h(e){if(!e.target.closest('.reaction-picker')&&!e.target.closest('.react-btn')){hideReactionPicker();document.removeEventListener('click',h);}}
    document.addEventListener('click',h);
  },10);
}

function hideReactionPicker(){
  document.querySelectorAll('.reaction-picker').forEach(el=>el.remove());
}

// ═══════════════════════════════════════════════════════════
// DIRECT MESSAGES (私訊)
// ═══════════════════════════════════════════════════════════
function getDMThread(userId){
  const key=[session.userId,userId].sort().join(':');
  if(!dms[key])dms[key]=[];
  return dms[key];
}

function getDMBadgeCount(){
  let count=0;
  if(!session)return 0;
  Object.keys(dms).forEach(key=>{
    if(!key.includes(session.userId))return;
    dms[key].forEach(m=>{if(m.to===session.userId&&!m.read)count++;});
  });
  return count;
}

function updateDMBadge(){
  const badge=document.getElementById('dm-badge');
  if(!badge)return;
  const count=getDMBadgeCount();
  badge.textContent=count>99?'99+':count;
  badge.classList.toggle('hidden',count===0);
}

function renderDMs(){
  const me=users.find(u=>u.id===session.userId);
  const contacts=new Set();
  if(me?.following)me.following.forEach(id=>contacts.add(id));
  if(me?.followers)me.followers.forEach(id=>contacts.add(id));
  Object.keys(dms).forEach(key=>{
    if(!key.includes(session.userId))return;
    key.split(':').forEach(id=>{if(id!==session.userId)contacts.add(id);});
  });
  const conversations=[];
  contacts.forEach(uid=>{
    const u=users.find(x=>x.id===uid);if(!u)return;
    const thread=getDMThread(uid);
    const lastMsg=thread[thread.length-1]||null;
    const unread=thread.filter(m=>m.to===session.userId&&!m.read).length;
    conversations.push({user:u,lastMsg,unread});
  });
  conversations.sort((a,b)=>(b.lastMsg?.time||0)-(a.lastMsg?.time||0));
  if(conversations.length===0){
    return `<div class="page-header"><h2>私訊</h2></div><div class="empty-state">💬<p>還沒有私訊</p><p style="font-size:12px;color:var(--text3)">追蹤其他用戶後即可傳送私訊</p></div>`;
  }
  return `<div class="page-header"><h2>私訊</h2></div>
  <div class="dm-list">
    ${conversations.map(({user:u,lastMsg,unread})=>`
      <div class="dm-row" onclick="openDMThread('${u.id}')">
        ${userAvatarHTML(u.id,'avatar-md')}
        <div class="dm-row-info">
          <div class="dm-row-name">${esc(u.displayName)} <span class="uhandle" style="font-size:11px">@${esc(u.username)}</span></div>
          <div class="dm-row-preview">${lastMsg?esc(lastMsg.text.slice(0,50))+(lastMsg.text.length>50?'…':''):'開始對話 👋'}</div>
        </div>
        <div class="dm-row-right">
          ${lastMsg?`<div class="dm-row-time">${reltime(lastMsg.time)}</div>`:''}
          ${unread>0?`<div class="dm-unread-badge">${unread}</div>`:''}
        </div>
      </div>`).join('')}
  </div>`;
}

function openDMThread(userId){
  const u=users.find(x=>x.id===userId);if(!u)return;
  const thread=getDMThread(userId);
  thread.forEach(m=>{if(m.to===session.userId)m.read=true;});
  saveDMs();updateDMBadge();
  const msgs=thread.map(m=>{
    const isMe=m.from===session.userId;
    return `<div class="dm-msg ${isMe?'dm-msg-me':'dm-msg-them'}">
      <div class="dm-bubble">${esc(m.text)}</div>
      <div class="dm-time">${reltime(m.time)}</div>
    </div>`;
  }).join('');
  const html=`
  <div class="page-header" style="position:sticky;top:0;background:var(--bg);z-index:10">
    <button class="btn btn-ghost btn-sm" onclick="navigate('dms')">← 返回</button>
    <div style="display:flex;align-items:center;gap:10px;flex:1;margin-left:8px">
      ${userAvatarHTML(userId,'avatar-sm')}
      <div><div style="font-weight:700">${esc(u.displayName)}</div><div class="uhandle" style="font-size:11px">@${esc(u.username)}</div></div>
    </div>
    <button class="btn btn-ghost btn-sm" onclick="openUserProfile('${userId}')">查看主頁</button>
  </div>
  <div class="dm-thread" id="dm-thread">
    ${thread.length===0?'<div style="text-align:center;color:var(--text3);padding:40px;font-size:13px">開始你們的對話 👋</div>':''}
    ${msgs}
  </div>
  <div class="dm-input-bar">
    <input class="dm-input" id="dm-input-field" placeholder="傳送訊息..." onkeydown="if(event.key==='Enter')sendDM('${userId}')"/>
    <button class="live-btn" style="flex-shrink:0" onclick="sendDM('${userId}')">➤</button>
  </div>`;
  currentPage='dm-thread';
  const content=document.getElementById('content');
  if(content){content.innerHTML=html;_applyIcons(content);}
  const threadEl=document.getElementById('dm-thread');
  if(threadEl)setTimeout(()=>threadEl.scrollTop=threadEl.scrollHeight,50);
  document.getElementById('dm-input-field')?.focus();
}

function sendDM(toUserId){
  const inp=document.getElementById('dm-input-field');
  if(!inp)return;
  const txt=inp.value.trim();if(!txt)return;
  const thread=getDMThread(toUserId);
  thread.push({from:session.userId,to:toUserId,text:txt,time:Date.now(),read:false});
  saveDMs();
  inp.value='';
  openDMThread(toUserId);
  const toUser=users.find(u=>u.id===toUserId);
  if(toUser){
    addNotificationForUser('dm',session.userId,toUserId,null,txt.slice(0,50));
    sendNativeNotif(`${session.displayName} 傳訊息給你`,txt.slice(0,100));
  }
}

function openDMWith(userId){
  navigate('dms');
  setTimeout(()=>openDMThread(userId),50);
}

const COIN_PACKAGES=[
  {id:'s',coins:500,price:'NT$30',label:'小包 ⭐'},
  {id:'m',coins:1500,price:'NT$80',label:'中包 💫'},
  {id:'l',coins:3500,price:'NT$150',label:'大包 🌟'},
  {id:'xl',coins:8000,price:'NT$300',label:'超值包 🚀'},
];

function openCoinTopup(){
  const me=users.find(u=>u.id===session.userId)||{};
  const coins=me.coins??1000;
  const wrap=document.createElement('div');
  wrap.id='coin-topup-overlay';
  wrap.style.cssText='position:fixed;inset:0;z-index:4000;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)';
  wrap.innerHTML=`
  <div class="coin-topup-sheet">
    <div class="coin-topup-header">
      <span>💰 我的金幣：${coins.toLocaleString()}</span>
      <button onclick="closeCoinTopup()" style="background:none;border:none;color:var(--text2);font-size:20px;cursor:pointer">✕</button>
    </div>
    <div class="coin-packages">
      ${COIN_PACKAGES.map(pkg=>`
        <div class="coin-pkg" onclick="buyCoinPackage('${pkg.id}')">
          <div class="coin-pkg-coins">🪙 ${pkg.coins.toLocaleString()}</div>
          <div class="coin-pkg-label">${pkg.label}</div>
          <div class="coin-pkg-price">${pkg.price}</div>
        </div>`).join('')}
    </div>
    <p style="text-align:center;font-size:11px;color:var(--text3);margin-top:12px">🎁 演示模式：點選即可立即獲得金幣</p>
  </div>`;
  wrap.addEventListener('click',e=>{if(e.target===wrap)closeCoinTopup();});
  document.body.appendChild(wrap);
}

function closeCoinTopup(){document.getElementById('coin-topup-overlay')?.remove();}

function buyCoinPackage(id){
  const pkg=COIN_PACKAGES.find(p=>p.id===id);if(!pkg)return;
  const me=users.find(u=>u.id===session.userId);
  if(me){me.coins=(me.coins||0)+pkg.coins;saveUsers();}
  closeCoinTopup();
  const coinEl=document.getElementById('my-coins');
  if(coinEl)coinEl.textContent=(me?.coins||pkg.coins).toLocaleString();
  toast(`🎉 獲得 🪙 ${pkg.coins.toLocaleString()} 金幣！`,'success');
}

// ── AI Engine State ──
let aiEngine = {
  running: false,
  timers: [],

  postCount: 0,
