// ── Initialize AI users in the user list ──
function initAIUsers(){
  let changed = false;
  AI_PROFILES.forEach(profile=>{
    if(!users.find(u=>u.id===profile.id)){
      users.push({
        id: profile.id,
        username: profile.username,
        displayName: profile.displayName,
        bio: profile.bio,
        password: btoa('ai_user_locked'),
        avatarColor: profile.avatarColor,
        followers: profile.followers,
        following: profile.following,
        createdAt: Date.now() - 86400000 * 14,
        isAI: true,
        coins: 5000,
      });
      changed = true;
    }
  });
  if(changed) saveUsers();
}

// ── Pick a random item from array ──
function _aiPick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

// ── Build a fake session-like object for an AI user ──
function _aiSession(id){
  const u = users.find(x=>x.id===id);
  return u ? {userId:u.id, username:u.username, displayName:u.displayName, avatarColor:u.avatarColor, avatarUrl:u.avatarUrl||null} : null;
}

// ── AI makes a post ──
function _aiMakePost(aiId){
  const prof = AI_PROFILES.find(p=>p.id===aiId);
  if(!prof) return;
  const u = users.find(x=>x.id===aiId);
  if(!u) return;
  const content = _aiPick(AI_CONTENT[prof.personality].posts);
  // Occasionally add a media emoji visual
  const post = {
    id: 'aip_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),
    userId: u.id,
    username: u.username,
    displayName: u.displayName,
    avatarColor: u.avatarColor,
    avatarUrl: u.avatarUrl||null,
    content,
    likes: [],
    reposts: [],
    comments: 0,
    createdAt: Date.now(),
    type: 'post',
  };
  posts.unshift(post);
  savePosts();
  _aiShowActivity(u.displayName, '發了一則新貼文');
  // Notify followers
  if(session) addNotificationForUser('follow', u.id, session.userId, post.id, content.slice(0,40));
  // Re-render if on home/feed
  if(currentPage==='home'||currentPage==='verse') renderPage(currentPage);
}

// ── AI comments on a recent post ──
function _aiComment(aiId){
  const prof = AI_PROFILES.find(p=>p.id===aiId);
  if(!prof) return;
  const u = users.find(x=>x.id===aiId);
  if(!u) return;
  // Pick a recent non-AI post or another AI's post
  const targetPosts = posts.filter(p=>p.userId!==aiId).slice(0,12);
  if(!targetPosts.length) return;
  const post = _aiPick(targetPosts);
  const text = _aiPick(AI_CONTENT[prof.personality].comments);
  if(!comments[post.id]) comments[post.id]=[];
  comments[post.id].push({
    id:'aic_'+Date.now(),
    postId:post.id,
    userId:u.id,
    username:u.username,
    displayName:u.displayName,
    avatarColor:u.avatarColor,
    avatarUrl:u.avatarUrl||null,
    text,
    createdAt:Date.now(),
  });
  post.comments=(comments[post.id]||[]).length;
  saveComments(); savePosts();
  _aiShowActivity(u.displayName, '留言了一則貼文');
  if(session && post.userId===session.userId)
    addNotification('comment', u.id, post.id, text.slice(0,50));
}

// ── AI likes a post ──
function _aiLikePost(aiId){
  const u = users.find(x=>x.id===aiId);
  if(!u) return;
  const pool = posts.filter(p=>p.userId!==aiId&&!( p.likes||[]).includes(aiId)).slice(0,20);
  if(!pool.length) return;
  const post = _aiPick(pool);
  if(!post.likes) post.likes=[];
  post.likes.push(aiId);
  // Also add a reaction
  if(!reactions[post.id]) reactions[post.id]={};
  const emojiPool=['❤️','😂','😮','👍','🌟'];
  reactions[post.id][aiId]=_aiPick(emojiPool);
  savePosts(); saveReactions();
  if(session && post.userId===session.userId)
    addNotification('like', u.id, post.id, '');
  const el=document.getElementById('post-'+post.id);
  if(el){const tmp=document.createElement('div');tmp.innerHTML=renderPostHTML(post);el.replaceWith(tmp.firstChild);_applyIcons(document.getElementById('post-'+post.id));}
}

// ── AI sends a DM to another AI or the logged-in user ──
function _aiDM(fromId){
  const prof = AI_PROFILES.find(p=>p.id===fromId);
  if(!prof) return;
  const u = users.find(x=>x.id===fromId);
  if(!u) return;
  // Decide target: sometimes message the real user, sometimes another AI
  let toId;
  if(session && Math.random()<0.35){
    toId = session.userId;
  } else {
    const targets = prof.dmTo.filter(x=>x!==fromId);
    if(!targets.length) return;
    toId = _aiPick(targets);
  }
  const text = _aiPick(AI_CONTENT[prof.personality].dms);
  const thread = getDMThread_ai(fromId, toId);
  thread.push({from:fromId, to:toId, text, time:Date.now(), read:false});
  saveDMs();
  updateDMBadge();
  if(toId===session?.userId){
    addNotification('dm', fromId, null, text.slice(0,50));
    sendNativeNotif(`${u.displayName} 傳訊息給你`, text.slice(0,80));
    _aiShowActivity(u.displayName, '傳了私訊給你 💌');
  }
}

// DM thread helper that doesn't require session
function getDMThread_ai(uid1, uid2){
  const key=[uid1,uid2].sort().join(':');
  if(!dms[key]) dms[key]=[];
  return dms[key];
}

// ── AI cross-conversation (two AIs reply to each other in DMs) ──
function _aiCrossConvo(){
  const c = AI_CROSS_CONVO[aiEngine.convoIdx % AI_CROSS_CONVO.length];
  aiEngine.convoIdx++;
  const thread = getDMThread_ai(c.from, c.to);
  thread.push({from:c.from, to:c.to, text:c.msg, time:Date.now(), read:true});
  // Also sometimes post it publicly as a reply comment on a recent post
  if(Math.random()<0.45){
    const uFrom = users.find(x=>x.id===c.from);
    const targetPosts = posts.filter(p=>p.userId===c.to||p.userId===c.from).slice(0,5);
    if(uFrom && targetPosts.length){
      const post = _aiPick(targetPosts);
      if(!comments[post.id]) comments[post.id]=[];
      comments[post.id].push({
        id:'aicc_'+Date.now(),
        postId:post.id,
        userId:uFrom.id,
        username:uFrom.username,
        displayName:uFrom.displayName,
        avatarColor:uFrom.avatarColor,
        text: c.msg,
        createdAt:Date.now(),
      });
      post.comments=(comments[post.id]||[]).length;
      saveComments(); savePosts();
    }
  }
  saveDMs();
  updateDMBadge();
}

// ── Activity toast (subtle, non-intrusive) ──
function _aiShowActivity(name, action){
  const wrap = document.getElementById('ai-activity-bar');
  if(!wrap) return;
  const item = document.createElement('div');
  item.className = 'ai-activity-item';
  item.innerHTML = `<span class="ai-dot"></span><span>${esc(name)}</span><span style="color:var(--text3)">${action}</span>`;
  wrap.appendChild(item);
  setTimeout(()=>item.remove(), 5000);
}

// ── One AI action tick ──
function _aiTick(){
  if(!aiEngine.running) return;
  const profs = AI_PROFILES;
  const p = _aiPick(profs);
  const rand = Math.random();
  if(rand < 0.28)      _aiMakePost(p.id);
  else if(rand < 0.58) _aiComment(p.id);
  else if(rand < 0.75) _aiLikePost(p.id);
  else if(rand < 0.88) _aiDM(p.id);
  else                 _aiCrossConvo();
  aiEngine.postCount++;
}

// ── Start the AI engine ──
function startAIEngine(){
  if(aiEngine.running) return;
  aiEngine.running = true;
  initAIUsers();

  // Initial burst: 2 posts per AI immediately
  AI_PROFILES.forEach((p,i)=>{
    setTimeout(()=>_aiMakePost(p.id), 800 + i*1200);
  });

  // Then tick every 18-35 seconds for demo responsiveness
  const tick = ()=>{
    if(!aiEngine.running) return;
    _aiTick();
    const next = 18000 + Math.random()*17000;
    aiEngine.timers.push(setTimeout(tick, next));
  };
  // Stagger initial ticks
  AI_PROFILES.forEach((_,i)=>{
    const t = setTimeout(()=>{
      if(aiEngine.running) tick();
    }, 6000 + i*4000);
    aiEngine.timers.push(t);
  });

  // Cross-convo every 45-90 seconds
  const crossTick=()=>{
    if(!aiEngine.running) return;
    _aiCrossConvo();
    aiEngine.timers.push(setTimeout(crossTick, 45000+Math.random()*45000));
  };
  aiEngine.timers.push(setTimeout(crossTick, 20000));

  toast('🤖 AI 測試模式已啟動 — 四位 AI 用戶開始活動','success');
  _updateAIBtn();

  // Save AI enabled state
  const s=JSON.parse(localStorage.getItem('bv_settings')||'{}');
  s.aiMode=true;
  localStorage.setItem('bv_settings',JSON.stringify(s));
}

// ── Stop the AI engine ──
function stopAIEngine(){
  aiEngine.running = false;
  aiEngine.timers.forEach(t=>clearTimeout(t));
  aiEngine.timers=[];
  toast('AI 測試模式已停止','info');
  _updateAIBtn();
  const s=JSON.parse(localStorage.getItem('bv_settings')||'{}');
  s.aiMode=false;
  localStorage.setItem('bv_settings',JSON.stringify(s));
}

function toggleAIEngine(){
  if(aiEngine.running) stopAIEngine();
  else startAIEngine();
}

function _updateAIBtn(){
  const btn=document.getElementById('ai-toggle-btn');
  if(btn){
    btn.textContent = aiEngine.running ? '⏹ 停止 AI 模式' : '🤖 啟動 AI 測試模式';
    btn.style.background = aiEngine.running ? 'rgba(239,68,68,.2)' : 'rgba(124,58,237,.2)';
    btn.style.borderColor = aiEngine.running ? 'rgba(239,68,68,.4)' : 'rgba(124,58,237,.4)';
    btn.style.color = aiEngine.running ? '#fca5a5' : '#c4b5fd';
  }
  const status=document.getElementById('ai-status-dot');
  if(status) status.style.background = aiEngine.running ? '#22c55e' : '#6b7280';
  const homeBtn=document.getElementById('ai-home-btn');
  if(homeBtn){
    homeBtn.textContent = aiEngine.running ? '⏹ AI' : '🤖 AI';
    homeBtn.style.background = aiEngine.running ? 'rgba(239,68,68,.15)' : 'rgba(124,58,237,.15)';
    homeBtn.style.borderColor = aiEngine.running ? 'rgba(239,68,68,.3)' : 'rgba(124,58,237,.3)';
    homeBtn.style.color = aiEngine.running ? '#fca5a5' : '#c4b5fd';
  }
}

function _applyIcons(root){
  (root||document).querySelectorAll('i.ti').forEach(el=>{
    for(const c of el.classList){
      if(c!=='ti'&&_ICONS[c]){el.textContent=_ICONS[c];break;}
    }
  });
}

  if(n.nodeType===1){_applyIcons(n);}
})));
