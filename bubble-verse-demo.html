<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Bubble Verse — 去中心化社群宇宙</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
<style>
/* ─── Reset & Variables ─────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f13;
  --panel:#1a1a24;
  --panel2:#22222f;
  --border:#2a2a3a;
  --fg:#e8e8f0;
  --fg2:#9090a8;
  --accent:#7c3aed;
  --accent2:#a855f7;
  --pink:#ec4899;
  --teal:#06b6d4;
  --orange:#f97316;
  --green:#22c55e;
  --radius:12px;
  --radius-lg:20px;
  --shadow:0 4px 24px rgba(0,0,0,0.4);
}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;font-size:15px;overflow:hidden}
button{cursor:pointer;font-family:inherit}
img{display:block}
a{text-decoration:none;color:inherit}
ul{list-style:none}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}

/* ─── Layout ────────────────────────────────────────────────────── */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:240px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;transition:width .25s}
.sidebar.collapsed{width:70px}
.main{flex:1;overflow-y:auto;padding:0}

/* ─── Sidebar ───────────────────────────────────────────────────── */
.sidebar-logo{padding:20px 18px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border)}
.logo-orbs{display:flex;gap:4px;align-items:center;flex-shrink:0}
.orb{border-radius:50%;animation:float 3s ease-in-out infinite}
.orb1{width:10px;height:10px;background:#f97316;animation-delay:0s}
.orb2{width:14px;height:14px;background:var(--accent);animation-delay:.4s}
.orb3{width:9px;height:9px;background:var(--teal);animation-delay:.8s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.logo-name{font-size:18px;font-weight:800;background:linear-gradient(135deg,#f97316,#ec4899,#7c3aed,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;white-space:nowrap;overflow:hidden}

.nav-list{padding:12px 8px;flex:1;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--radius);border:none;background:none;color:var(--fg2);font-size:14px;font-weight:500;width:100%;transition:all .15s;white-space:nowrap;overflow:hidden;position:relative}
.nav-item:hover{background:var(--panel2);color:var(--fg)}
.nav-item.active{background:linear-gradient(135deg,rgba(124,58,237,.25),rgba(168,85,247,.1));color:var(--accent2)}
.nav-item.active .nav-icon{color:var(--accent2)}
.nav-icon{font-size:18px;flex-shrink:0;width:22px;text-align:center}
.nav-text{overflow:hidden;text-overflow:ellipsis}
.nav-badge{margin-left:auto;background:var(--accent);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:99px;flex-shrink:0}
.nav-divider{height:1px;background:var(--border);margin:8px 12px}
.nav-section-label{font-size:10px;font-weight:700;color:var(--fg2);padding:8px 12px 4px;text-transform:uppercase;letter-spacing:.08em}

.sidebar-bottom{padding:12px;border-top:1px solid var(--border)}
.user-card{display:flex;align-items:center;gap:10px;padding:10px;border-radius:var(--radius);background:var(--panel2);cursor:pointer;transition:background .15s}
.user-card:hover{background:var(--border)}
.user-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--pink));display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff;flex-shrink:0}
.user-info{flex:1;overflow:hidden}
.user-name{font-size:13px;font-weight:600;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-handle{font-size:11px;color:var(--fg2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ─── Page Header ───────────────────────────────────────────────── */
.page-header{position:sticky;top:0;background:rgba(15,15,19,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;gap:14px;z-index:100}
.page-title{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}
.page-title i{color:var(--accent2)}
.page-actions{margin-left:auto;display:flex;gap:8px}

/* ─── Buttons ───────────────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:99px;border:none;font-size:13px;font-weight:600;transition:all .15s;white-space:nowrap}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent2)}
.btn-ghost{background:var(--panel2);color:var(--fg);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--border)}
.btn-gradient{background:linear-gradient(135deg,#f97316,#ec4899,#7c3aed);color:#fff}
.btn-gradient:hover{opacity:.9}
.btn-sm{padding:5px 12px;font-size:12px}
.btn-icon{padding:8px;border-radius:var(--radius);background:var(--panel2);border:1px solid var(--border);color:var(--fg2)}
.btn-icon:hover{color:var(--fg);background:var(--border)}

/* ─── Cards ─────────────────────────────────────────────────────── */
.card{background:var(--panel);border-radius:var(--radius-lg);border:1px solid var(--border)}

/* ─── Tabs ──────────────────────────────────────────────────────── */
.tabs{display:flex;gap:4px;padding:4px;background:var(--panel2);border-radius:var(--radius);border:1px solid var(--border)}
.tab{padding:7px 16px;border-radius:8px;border:none;background:none;color:var(--fg2);font-size:13px;font-weight:600;transition:all .15s}
.tab.active{background:var(--panel);color:var(--fg);box-shadow:0 1px 4px rgba(0,0,0,.3)}
.tab:hover:not(.active){color:var(--fg)}

/* ═══════════════════════════════════════════════════════════════════
   LANDING PAGE
══════════════════════════════════════════════════════════════════════ */
.landing{min-height:100vh;overflow-y:auto;background:var(--bg)}
.landing-hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;text-align:center;position:relative;overflow:hidden}
.hero-bg{position:absolute;inset:0;background:
  radial-gradient(ellipse at 20% 30%, rgba(124,58,237,.2) 0%, transparent 50%),
  radial-gradient(ellipse at 80% 70%, rgba(6,182,212,.15) 0%, transparent 50%),
  radial-gradient(ellipse at 50% 80%, rgba(236,72,153,.15) 0%, transparent 50%);
pointer-events:none}
.hero-big-logo{display:flex;flex-direction:column;align-items:center;gap:16px;margin-bottom:24px}
.hero-orbs{display:flex;gap:12px;align-items:center}
.hero-orb{border-radius:50%;filter:blur(1px);animation:float 3s ease-in-out infinite}
.hero-orb1{width:24px;height:24px;background:radial-gradient(circle,#fbbf24,#f97316);animation-delay:0s}
.hero-orb2{width:36px;height:36px;background:radial-gradient(circle,#a855f7,#7c3aed);animation-delay:.5s}
.hero-orb3{width:20px;height:20px;background:radial-gradient(circle,#22d3ee,#06b6d4);animation-delay:1s}
.hero-title{font-size:clamp(48px,10vw,88px);font-weight:900;background:linear-gradient(135deg,#fbbf24 0%,#f97316 15%,#ec4899 35%,#a855f7 55%,#7c3aed 70%,#06b6d4 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-2px;line-height:1}
.hero-sub{font-size:clamp(14px,2.5vw,20px);color:var(--fg2);max-width:600px;line-height:1.7;margin-bottom:8px}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.hero-pills{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.pill{font-size:11px;padding:4px 12px;border-radius:99px;background:rgba(124,58,237,.15);color:var(--accent2);border:1px solid rgba(124,58,237,.3);display:flex;align-items:center;gap:5px}

.features-section{padding:60px 24px;max-width:1100px;margin:0 auto}
.features-title{font-size:28px;font-weight:800;text-align:center;margin-bottom:8px}
.features-desc{color:var(--fg2);text-align:center;margin-bottom:40px}
.features-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.feature-card{border-radius:24px;padding:32px 28px;display:flex;flex-direction:column;gap:16px;position:relative;overflow:hidden}
.feature-card-bubbles{background:linear-gradient(135deg,#1a0a2e,#2d1458,#3b0764)}
.feature-card-verse{background:linear-gradient(135deg,#0a0a1a,#0f172a,#0c1a3a)}
.feature-card-galaxies{background:linear-gradient(135deg,#0d0520,#1a0040,#0c1a3a)}
.feature-icon-wrap{width:56px;height:56px;border-radius:16px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:28px}
.feature-name{font-size:26px;font-weight:800;color:#fff}
.feature-tag{font-size:11px;background:rgba(255,255,255,.15);color:rgba(255,255,255,.8);padding:3px 10px;border-radius:99px;align-self:flex-start;display:flex;align-items:center;gap:4px}
.feature-desc{font-size:14px;color:rgba(255,255,255,.75);line-height:1.7}
.feature-list{display:flex;flex-direction:column;gap:8px}
.feature-list li{font-size:13px;color:rgba(255,255,255,.8);display:flex;align-items:center;gap:8px}
.feature-list li i{color:rgba(255,255,255,.6);font-size:14px}

.why-section{padding:60px 24px;max-width:900px;margin:0 auto}
.why-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:32px}
.why-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;display:flex;gap:14px}
.why-icon{font-size:28px;color:var(--accent2);flex-shrink:0}
.why-card strong{display:block;font-size:14px;font-weight:700;margin-bottom:4px}
.why-card span{font-size:12px;color:var(--fg2);line-height:1.6}

/* ═══════════════════════════════════════════════════════════════════
   STORIES / BUBBLES
══════════════════════════════════════════════════════════════════════ */
.page-content{padding:20px 24px;max-width:900px}

/* Story bar */
.story-bar{background:var(--panel);border-radius:var(--radius-lg);border:1px solid var(--border);padding:16px 20px;margin-bottom:20px}
.story-bar-track{display:flex;gap:18px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.story-bar-track::-webkit-scrollbar{display:none}
.story-item{display:flex;flex-direction:column;align-items:center;gap:6px;flex-shrink:0;cursor:pointer}
.story-ring{width:64px;height:64px;border-radius:50%;padding:2.5px;display:flex;align-items:center;justify-content:center}
.story-ring.unseen{background:linear-gradient(135deg,#fbbf24,#f97316,#ec4899,#a855f7)}
.story-ring.seen{background:var(--border)}
.story-ring.add-ring{background:var(--border);position:relative}
.story-avatar{width:56px;height:56px;border-radius:50%;border:2px solid var(--panel);object-fit:cover;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:#fff}
.story-add-btn{width:56px;height:56px;border-radius:50%;border:2px solid var(--panel);background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--accent2);position:relative}
.story-plus{position:absolute;bottom:0;right:0;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;border:2px solid var(--panel)}
.story-name{font-size:11px;color:var(--fg2);max-width:64px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Story grid */
.stories-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.story-card{border-radius:16px;overflow:hidden;cursor:pointer;transition:transform .2s;aspect-ratio:9/16;position:relative}
.story-card:hover{transform:scale(1.03)}
.story-card-media{width:100%;height:100%;object-fit:cover}
.story-card-gradient{width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:16px;text-align:center}
.story-card-text{color:#fff;font-size:14px;font-weight:600;line-height:1.4;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.story-card-footer{position:absolute;bottom:0;left:0;right:0;padding:10px 10px 8px;background:linear-gradient(to top,rgba(0,0,0,.7),transparent);display:flex;align-items:center;gap:6px}
.story-card-avatar{width:22px;height:22px;border-radius:50%;border:1.5px solid #fff;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;overflow:hidden}
.story-card-author{font-size:11px;color:#fff;font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.story-unseen-dot{position:absolute;top:8px;right:8px;width:10px;height:10px;border-radius:50%;background:var(--accent2);border:2px solid var(--panel)}

/* Story Viewer */
.story-viewer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:9999;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.story-viewer-overlay.open{opacity:1;pointer-events:all}
.story-viewer{width:min(420px,100vw);height:min(750px,100vh);background:#000;border-radius:20px;overflow:hidden;position:relative}
.story-progress-bars{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:4px;z-index:10}
.story-pb-track{flex:1;height:3px;background:rgba(255,255,255,.3);border-radius:2px;overflow:hidden}
.story-pb-fill{height:100%;background:#fff;transition:width .1s linear;border-radius:2px}
.story-hdr{position:absolute;top:24px;left:12px;right:12px;display:flex;align-items:center;gap:8px;z-index:10}
.story-hdr-av{width:34px;height:34px;border-radius:50%;border:2px solid #fff;background:linear-gradient(135deg,var(--accent),var(--pink));display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:14px}
.story-hdr-name{color:#fff;font-weight:600;font-size:14px;flex:1;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.story-hdr-time{color:rgba(255,255,255,.6);font-size:11px}
.story-hdr-close{background:none;border:none;color:#fff;font-size:22px;padding:4px;margin-left:8px}
.story-content{width:100%;height:100%}
.story-media{width:100%;height:100%;object-fit:cover}
.story-text-content{width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:40px 28px}
.story-text-body{color:#fff;font-size:26px;font-weight:700;text-align:center;text-shadow:0 2px 12px rgba(0,0,0,.5);line-height:1.4}
.story-tap-left{position:absolute;top:0;left:0;width:33%;height:100%;z-index:5}
.story-tap-right{position:absolute;top:0;right:0;width:33%;height:100%;z-index:5}
.story-footer{position:absolute;bottom:16px;left:0;right:0;text-align:center;z-index:10;color:rgba(255,255,255,.7);font-size:12px;display:flex;align-items:center;justify-content:center;gap:4px}

/* ═══════════════════════════════════════════════════════════════════
   VERSE FEED
══════════════════════════════════════════════════════════════════════ */
.verse-layout{display:grid;grid-template-columns:1fr 280px;gap:24px;padding:20px 24px;max-width:1100px}
@media(max-width:768px){.verse-layout{grid-template-columns:1fr}}

.trending-bar{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.trending-label{font-size:12px;font-weight:700;color:var(--accent2);display:flex;align-items:center;gap:5px;flex-shrink:0}
.trend-tag-btn{font-size:11px;padding:4px 10px;border-radius:99px;border:1px solid var(--border);background:none;color:var(--fg2);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:4px}
.trend-tag-btn:hover,.trend-tag-btn.active{border-color:var(--accent2);color:var(--accent2);background:rgba(124,58,237,.1)}
.trend-tag-count{font-size:9px;opacity:.6}

.verse-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.verse-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;transition:transform .2s,box-shadow .2s;cursor:pointer}
.verse-card:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,0,0,.4)}
.verse-media{aspect-ratio:16/9;background:var(--panel2);position:relative;overflow:hidden}
.verse-media img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.verse-card:hover .verse-media img{transform:scale(1.04)}
.verse-media-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 50%,rgba(0,0,0,.3))}
.verse-media-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:40px}
.verse-body{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.verse-author{display:flex;align-items:center;gap:9px}
.verse-av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;flex-shrink:0}
.verse-author-info{flex:1;min-width:0}
.verse-author-name{font-size:13px;font-weight:600;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.verse-author-handle{font-size:11px;color:var(--fg2)}
.verse-time{font-size:11px;color:var(--fg2);flex-shrink:0}
.verse-text{font-size:13px;color:var(--fg);line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.verse-tags{display:flex;flex-wrap:wrap;gap:4px}
.verse-tag{font-size:11px;color:var(--accent2);font-weight:500}
.verse-stats{display:flex;gap:2px;border-top:1px solid var(--border);padding-top:10px}
.verse-stat-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;padding:7px 4px;background:none;border:none;border-radius:8px;font-size:12px;color:var(--fg2);transition:all .15s}
.verse-stat-btn:hover{background:rgba(124,58,237,.1);color:var(--accent2)}
.verse-stat-btn i{font-size:15px}

/* Verse Sidebar */
.verse-sidebar{display:flex;flex-direction:column;gap:16px;position:sticky;top:20px}
.sidebar-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px}
.sidebar-card-title{font-size:13px;font-weight:700;color:var(--fg);margin-bottom:12px;display:flex;align-items:center;gap:6px}
.sidebar-card-title i{color:var(--accent2)}
.trending-list{display:flex;flex-direction:column;gap:6px}
.trending-item{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:8px;cursor:pointer;transition:background .15s}
.trending-item:hover{background:var(--panel2)}
.trending-rank{font-size:12px;font-weight:700;color:var(--fg2);width:20px;text-align:center}
.trending-info{display:flex;flex-direction:column}
.trending-tag-name{font-size:13px;font-weight:600;color:var(--accent2)}
.trending-count{font-size:11px;color:var(--fg2)}
.sidebar-desc{font-size:12px;color:var(--fg2);line-height:1.7}

/* ═══════════════════════════════════════════════════════════════════
   GALAXIES
══════════════════════════════════════════════════════════════════════ */
.galaxy-hero{border-radius:24px;background:linear-gradient(135deg,#1a0040,#7c3aed,#0ea5e9);padding:36px 32px;margin:20px 24px;color:#fff}
.galaxy-hero h1{font-size:28px;font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.galaxy-hero p{font-size:14px;opacity:.85;line-height:1.6;max-width:500px;margin-bottom:16px}

.cat-bar{display:flex;gap:6px;flex-wrap:wrap;padding:0 24px 16px}
.cat-btn{padding:6px 14px;border-radius:99px;border:1px solid var(--border);background:none;font-size:12px;color:var(--fg2);cursor:pointer;text-transform:capitalize;transition:all .15s}
.cat-btn:hover{border-color:var(--accent2);color:var(--accent2)}
.cat-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}

.galaxy-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;padding:0 24px 24px}
.galaxy-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;cursor:pointer;transition:transform .2s,box-shadow .2s}
.galaxy-card:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,0,0,.4)}
.galaxy-banner{height:90px;background-size:cover;background-position:center;position:relative}
.galaxy-banner-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 40%,rgba(0,0,0,.4))}
.galaxy-color-dot{position:absolute;bottom:-10px;left:16px;width:22px;height:22px;border-radius:50%;border:3px solid var(--panel)}
.galaxy-body{padding:18px 16px 14px}
.galaxy-title-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.galaxy-name{font-size:15px;font-weight:700;color:var(--fg)}

function navigate(page) {
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const navEl = document.getElementById('nav-' + page);
  if(navEl) navEl.classList.add('active');

  const layout = document.getElementById('mainLayout');
  const content = document.getElementById('mainContent');

  if(page === 'landing') {
    layout.style.display = 'none';
    renderLanding();
  } else {
    layout.style.display = 'flex';
    document.getElementById('app').style.overflow = 'hidden';
    if(page === 'bubbles') renderBubbles(content);
    else if(page === 'verse') renderVerse(content);
    else if(page === 'galaxies') renderGalaxies(content);
    else if(page === 'galaxy' && activeGalaxy) renderGalaxyDetail(content, activeGalaxy);
    else renderHome(content);
  }
}

// ─── Story Viewer ────────────────────────────────────────────────
function openStoryViewer(idx) {
  storyIndex = idx;
  storyViewerData = STORIES;
  const overlay = document.getElementById('storyViewerOverlay');
  overlay.classList.add('open');
  renderCurrentStory();
  startStoryTimer();
}

function renderCurrentStory() {
  const s = storyViewerData[storyIndex];
  if(!s) return closeStoryViewer();
  document.getElementById('storyHdrAv').textContent = s.emoji;
  document.getElementById('storyHdrAv').style.background = s.bg;
  document.getElementById('storyHdrName').textContent = s.name;
  document.getElementById('storyHdrTime').textContent = s.time;
  document.getElementById('storyViews').textContent = s.views + Math.floor(Math.random()*5);
  document.getElementById('storyContent').innerHTML = `
    <div class="story-text-content" style="background:${s.bg}">
      <span class="story-text-body">${s.text}</span>
    </div>
  `;
  // Progress bars
  const bars = storyViewerData.map((_,i)=>`
    <div class="story-pb-track"><div class="story-pb-fill" id="pb${i}" style="width:${i<storyIndex?100:i===storyIndex?0:0}%"></div></div>
  `).join('');
  document.getElementById('storyProgressBars').innerHTML = bars;
  storyProgress = 0;
  // Mark as seen
  if(s.unseen) { s.unseen = false; }
}

function startStoryTimer() {
  if(storyTimer) clearInterval(storyTimer);
  storyProgress = 0;
  storyTimer = setInterval(() => {
    storyProgress += 2;
    const pb = document.getElementById('pb'+storyIndex);
    if(pb) pb.style.width = storyProgress + '%';
    if(storyProgress >= 100) storyNext();
  }, 100);
}

function storyNext() {
  if(storyIndex < storyViewerData.length-1) {
    storyIndex++;
    renderCurrentStory();
    startStoryTimer();
  } else closeStoryViewer();
}

function storyPrev() {
  if(storyIndex > 0) {
    storyIndex--;
    renderCurrentStory();
    startStoryTimer();
  }
}

function closeStoryViewer(e) {
  if(e && e.target !== document.getElementById('storyViewerOverlay')) return;
  if(storyTimer) { clearInterval(storyTimer); storyTimer = null; }
  document.getElementById('storyViewerOverlay')?.classList.remove('open');
}

function filterByTag(tag) {
  activeTag = tag;
  const grid = document.getElementById('verseGrid');
  if(grid) grid.innerHTML = renderVerseCards();

  document.querySelectorAll('.trend-tag-btn').forEach(b => {

function clearTagFilter() {
  activeTag = null;
  const grid = document.getElementById('verseGrid');
  if(grid) grid.innerHTML = renderVerseCards();
  document.querySelectorAll('.trend-tag-btn').forEach(b => b.classList.remove('active'));

function likeNote(id, btn) {
  const note = VERSE_NOTES.find(n=>n.id===id);

  note.reactions++;
  const el = document.getElementById('rc_'+id);
  if(el) el.textContent = fmtNum(note.reactions);

  btn.style.background = 'rgba(236,72,153,.1)';
  showToast('❤️ 已按愛心！','success');
}

    <div class="galaxy-hero">
      <h1><span style="font-size:28px">🌀</span> 探索星系</h1>
      <p>加入或建立主題社群，跨越 Fediverse 連結志同道合的人。每個星系都是獨立的去中心化社群。</p>
      <button class="btn" style="background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.3)" onclick="showCreateGalaxyDialog()">
        <i class="ti ti-rocket"></i> 建立我的星系
      </button>
    </div>
    <div class="cat-bar" id="galaxyCatBar">
      ${['all','technology','gaming','music','art','food','travel','education','other'].map(c=>`
        <button class="cat-btn ${activeCategory===c?'active':''}" onclick="filterGalaxies('${c}')">
          ${c==='all'?'全部':c}
        </button>
      `).join('')}
    </div>
    <div class="galaxy-grid" id="galaxyGrid">
      ${renderGalaxyCards()}
    </div>
  `;
}

function renderGalaxyCards() {
  const list = activeCategory==='all' ? GALAXIES : GALAXIES.filter(g=>g.category===activeCategory);
  return list.map(g=>`
    <div class="galaxy-card" onclick="openGalaxyDetail('${g.id}')">
      <div class="galaxy-banner" style="background:linear-gradient(135deg,${g.color}55,${g.color})">
        <div class="galaxy-banner-overlay"></div>
        <div class="galaxy-color-dot" style="background:${g.color}"></div>
        ${g.isPrivate?`<span style="position:absolute;top:8px;right:8px;background:rgba(0,0,0,.5);color:#fff;font-size:10px;padding:2px 8px;border-radius:99px;display:flex;align-items:center;gap:3px"><i class="ti ti-lock"></i> 私人</span>`:''}
      </div>
      <div class="galaxy-body">
        <div class="galaxy-title-row">
          <span style="font-size:18px">${g.emoji}</span>
          <span class="galaxy-name">${g.name}</span>
          <span class="galaxy-cat-badge">${g.category}</span>
        </div>
        <p class="galaxy-desc">${g.desc}</p>
        <div class="galaxy-stats">
          <span><i class="ti ti-users"></i>${fmtNum(g.members)} 成員</span>
          <span><i class="ti ti-notes"></i>${fmtNum(g.posts)} 貼文</span>
        </div>
        <div class="galaxy-tags">
          ${g.tags.map(t=>`<span class="galaxy-tag">#${t}</span>`).join('')}
        </div>
        <button class="galaxy-join-btn ${g.joined?'joined':''}"
          style="${g.joined?'':'background:'+g.color}"
          onclick="event.stopPropagation();toggleJoinGalaxy('${g.id}',this)">
          ${g.joined
            ? '<i class="ti ti-check"></i> 已加入'
            : '<i class="ti ti-rocket"></i> 加入星系'
          }
        </button>
      </div>
    </div>
  `).join('');
}

function filterGalaxies(cat) {
  activeCategory = cat;
  document.querySelectorAll('.cat-btn').forEach(b=>{
    b.classList.toggle('active', b.textContent.trim()===cat || (cat==='all' && b.textContent.trim()==='全部'));
  });
  const grid = document.getElementById('galaxyGrid');
  if(grid) grid.innerHTML = renderGalaxyCards();
}

function toggleJoinGalaxy(id, btn) {
  const g = GALAXIES.find(x=>x.id===id);
  if(!g) return;
  g.joined = !g.joined;
  if(g.joined) {
    g.members++;
    btn.className = 'galaxy-join-btn joined';
    btn.innerHTML = '<i class="ti ti-check"></i> 已加入';
    btn.style.background = '';
    showToast(`🌀 已加入「${g.name}」星系！`,'success');
  } else {
    g.members = Math.max(0, g.members-1);
    btn.className = 'galaxy-join-btn';
    btn.style.background = g.color;
    btn.innerHTML = '<i class="ti ti-rocket"></i> 加入星系';
    showToast(`離開「${g.name}」星系`,'info');
  }
  // Update stats display
  const statsEl = btn.parentNode.querySelector('.galaxy-stats');
  if(statsEl) statsEl.innerHTML = `<span><i class="ti ti-users"></i>${fmtNum(g.members)} 成員</span><span><i class="ti ti-notes"></i>${fmtNum(g.posts)} 貼文</span>`;
}

function openGalaxyDetail(id) {
  activeGalaxy = GALAXIES.find(g=>g.id===id);
  if(!activeGalaxy) return;
  renderGalaxyDetail(document.getElementById('mainContent'), activeGalaxy);
}

function renderGalaxyDetail(container, g) {
  container.innerHTML = `
    <div class="page-header">
      <button class="btn-icon" onclick="navigate('galaxies')"><i class="ti ti-arrow-left"></i></button>
      <span class="page-title">${g.emoji} ${g.name}</span>
      <div class="page-actions">
        <button class="btn ${g.joined?'btn-ghost':'btn-primary'} btn-sm"
          onclick="toggleJoinFromDetail('${g.id}',this)"
          style="${g.joined?'':'background:'+g.color}">
          ${g.joined?'<i class="ti ti-logout"></i> 離開':'<i class="ti ti-rocket"></i> 加入星系'}
        </button>
      </div>
    </div>
    <!-- Banner -->
    <div class="galaxy-detail-banner" style="background:linear-gradient(135deg,${g.color}66,${g.color})">
      <div style="position:absolute;inset:0;background:linear-gradient(to bottom,transparent 40%,rgba(0,0,0,.5))"></div>
    </div>
    <div class="galaxy-detail-header">
      <div class="galaxy-detail-meta">
        <div class="galaxy-detail-orb" style="background:${g.color}">${g.emoji}</div>
        <div class="galaxy-detail-info">
          <div class="galaxy-detail-name">${g.name}</div>
          <div class="galaxy-detail-stats">
            <span><i class="ti ti-tag"></i> ${g.category}</span>
            <span><i class="ti ti-users"></i> ${fmtNum(g.members)} 成員</span>
            <span><i class="ti ti-notes"></i> ${fmtNum(g.posts)} 貼文</span>
            ${g.isPrivate?'<span><i class="ti ti-lock"></i> 私人</span>':''}
          </div>
        </div>
      </div>
      <p style="font-size:13px;color:var(--fg2);margin-top:12px;line-height:1.7;padding-bottom:4px">${g.desc}</p>
      <div style="display:flex;gap:6px;flex-wrap:wrap;padding-top:8px">
        ${g.tags.map(t=>`<span class="galaxy-tag">#${t}</span>`).join('')}
      </div>
    </div>

    <!-- Stats -->
    <div class="galaxy-stats-cards">
      <div class="stat-card">
        <span class="stat-num" style="color:${g.color}">${fmtNum(g.members)}</span>
        <span class="stat-label">成員</span>
      </div>
      <div class="stat-card">
        <span class="stat-num" style="color:${g.color}">${fmtNum(g.posts)}</span>
        <span class="stat-label">貼文</span>
      </div>
      <div class="stat-card">
        <span class="stat-num" style="color:${g.color};text-transform:capitalize;font-size:16px">${g.category}</span>
        <span class="stat-label">分類</span>
      </div>
    </div>

    <!-- Mock posts -->
    <div style="padding:0 24px 24px">
      <div style="font-size:14px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:6px">
        <i class="ti ti-notes" style="color:${g.color}"></i> 最新貼文
      </div>
      ${[...Array(3)].map((_,i)=>`
        <div class="card" style="padding:16px;margin-bottom:10px;border-color:${g.color}22">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
            <div style="width:34px;height:34px;border-radius:50%;background:${g.color};display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff">
              ${['A','B','C'][i]}
            </div>
            <div>
              <div style="font-size:13px;font-weight:600">成員 ${['Alice','Bob','Carol'][i]}</div>
              <div style="font-size:11px;color:var(--fg2)">${['1小時前','3小時前','5小時前'][i]}</div>
            </div>
          </div>
          <p style="font-size:13px;color:var(--fg);line-height:1.6">${[
            `${g.name} 社群太棒了！每天都能學到新東西，感謝大家的分享 🙏`,
            `剛加入這個星系就發現了好多有趣的討論，氛圍非常好！`,
            `推薦大家都來這裡！${g.name} 是我在 Bubble Verse 最喜歡的星系 ⭐`,
          ][i]}</p>
          <div style="display:flex;gap:12px;margin-top:10px;font-size:12px;color:var(--fg2)">
            <button class="verse-stat-btn" style="padding:4px 8px" onclick="showToast('❤️ 已按愛心','success')"><i class="ti ti-mood-heart"></i> ${[24,18,31][i]}</button>
            <button class="verse-stat-btn" style="padding:4px 8px" onclick="showToast('回覆功能','info')"><i class="ti ti-message-circle"></i> ${[5,3,8][i]}</button>
          </div>
        </div>
      `).join('')}
      <button class="btn btn-ghost" style="width:100%" onclick="showToast('載入更多貼文','info')">載入更多貼文</button>
    </div>
  `;
}

function toggleJoinFromDetail(id, btn) {
  const g = GALAXIES.find(x=>x.id===id);
  if(!g) return;
  g.joined = !g.joined;
  if(g.joined) {
    btn.className='btn btn-ghost btn-sm';
    btn.innerHTML='<i class="ti ti-logout"></i> 離開';
    btn.style.background='';
    showToast(`🌀 已加入「${g.name}」！`,'success');
  } else {
    btn.className='btn btn-primary btn-sm';
    btn.style.background=g.color;
    btn.innerHTML='<i class="ti ti-rocket"></i> 加入星系';
    showToast(`離開「${g.name}」`,'info');
  }
}

function showCreateGalaxyDialog() {
  const d = document.createElement('div');
  d.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:9998;display:flex;align-items:center;justify-content:center;';
  d.innerHTML=`
    <div style="background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:28px;width:400px;max-width:90vw;max-height:85vh;overflow-y:auto">
      <h3 style="font-size:17px;font-weight:700;margin-bottom:20px;display:flex;align-items:center;gap:8px">
        <i class="ti ti-galaxy" style="color:var(--accent2)"></i> 建立新星系
      </h3>
      <div style="display:flex;flex-direction:column;gap:12px">
        <div>
          <label style="font-size:12px;color:var(--fg2);font-weight:600;display:block;margin-bottom:4px">星系名稱 *</label>
          <input id="gName" placeholder="e.g. 台灣程式設計師" style="width:100%;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:10px;color:var(--fg);font-size:14px;font-family:inherit"/>
        </div>
        <div>
          <label style="font-size:12px;color:var(--fg2);font-weight:600;display:block;margin-bottom:4px">描述</label>
          <textarea id="gDesc" placeholder="描述你的星系..." style="width:100%;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:10px;color:var(--fg);font-size:14px;resize:none;height:70px;font-family:inherit"></textarea>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          <div>
            <label style="font-size:12px;color:var(--fg2);font-weight:600;display:block;margin-bottom:4px">分類</label>
            <select id="gCat" style="width:100%;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:10px;color:var(--fg);font-size:13px">
              ${['technology','gaming','music','art','sports','food','travel','education','other'].map(c=>`<option value="${c}">${c}</option>`).join('')}
            </select>
          </div>
          <div>
            <label style="font-size:12px;color:var(--fg2);font-weight:600;display:block;margin-bottom:4px">主色</label>
            <input id="gColor" type="color" value="#7c3aed" style="width:100%;height:42px;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:4px;cursor:pointer"/>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <input type="checkbox" id="gPrivate" style="width:16px;height:16px;cursor:pointer"/>
          <label for="gPrivate" style="font-size:13px;cursor:pointer">設為私人星系（需要審核加入）</label>
        </div>
      </div>
      <div style="display:flex;gap:8px;margin-top:20px">
        <button onclick="this.closest('div[style*=fixed]').remove()" style="flex:1;padding:10px;border-radius:99px;border:1px solid var(--border);background:none;color:var(--fg2);font-size:13px;font-weight:600;cursor:pointer">取消</button>
        <button onclick="submitNewGalaxy(this)" style="flex:2;padding:10px;border-radius:99px;border:none;background:linear-gradient(135deg,#7c3aed,#06b6d4);color:#fff;font-size:13px;font-weight:700;cursor:pointer">
          <i class="ti ti-rocket"></i> 建立星系
        </button>
      </div>
    </div>
  `;
  document.body.appendChild(d);
  d.addEventListener('click',e=>{if(e.target===d)d.remove()});
}

function submitNewGalaxy(btn) {
  const name = document.getElementById('gName').value || '我的新星系';
  const desc = document.getElementById('gDesc').value || '一個全新的星系正在形成...';
  const cat = document.getElementById('gCat').value;
  const color = document.getElementById('gColor').value;
  const isPrivate = document.getElementById('gPrivate').checked;
  btn.closest('div[style*=fixed]').remove();
  const emojis = {'technology':'💻','gaming':'🎮','music':'🎵','art':'🎨','sports':'⚽','food':'🍔','travel':'✈️','education':'📚','other':'🌟'};
  GALAXIES.unshift({
    id:'g'+Date.now(), name, category:cat, color, emoji:emojis[cat]||'🌀',
    desc, members:1, posts:0, isPrivate, tags:[], joined:true
  });
  renderGalaxies(document.getElementById('mainContent'));
  showToast(`🌀 星系「${name}」已建立！`,'success');
}

// ═══════════════════════════════════════════════════════════════════
// UTILITIES
// ═══════════════════════════════════════════════════════════════════
function fmtNum(n) {
  if(n>=1000000) return (n/1000000).toFixed(1)+'M';
  if(n>=1000) return (n/1000).toFixed(1)+'K';
  return String(n);
}

let toastTimeout;
function showToast(msg, type='success') {
  const t = document.getElementById('toast');
  const m = document.getElementById('toast-msg');
  if(!t||!m) return;
  t.className = 'toast show ' + type;
  t.querySelector('i').className = type==='success'?'ti ti-check':'ti ti-info-circle';
  m.textContent = msg;
  if(toastTimeout) clearTimeout(toastTimeout);
  toastTimeout = setTimeout(()=>{ t.classList.remove('show'); }, 3000);
}

// ═══════════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════════
navigate('landing');
</script>
</body>
</html>
