<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Bubble Verse — 去中心化社群宇宙</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f13;--panel:#1a1a24;--panel2:#22222f;
  --accent:#7c3aed;--accent2:#a855f7;
  --pink:#ec4899;--teal:#14b8a6;--orange:#f97316;--purple:#8b5cf6;
  --text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;
  --border:#2d2d3d;--radius:12px;--radius-sm:8px;
  --sidebar:240px;
}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;font-size:15px;line-height:1.5;min-height:100vh}
a{color:inherit;text-decoration:none}
button{cursor:pointer;border:none;background:none;color:inherit;font:inherit}
input,textarea,select{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;width:100%;outline:none;transition:border .2s}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:80px}
img{max-width:100%}
.hidden{display:none!important}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
#app{display:flex;min-height:100vh}
#sidebar{width:var(--sidebar);background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:20px 12px;position:fixed;top:0;left:0;height:100vh;overflow-y:auto;z-index:100;transition:transform .3s}
#main{margin-left:var(--sidebar);flex:1;min-height:100vh}
#content{max-width:900px;margin:0 auto;padding:24px 20px}
.logo{display:flex;align-items:center;gap:10px;padding:8px 12px;margin-bottom:20px}
.logo-orb{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--pink));position:relative;overflow:hidden;flex-shrink:0}
.logo-orb::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.3),transparent 60%)}
.logo-text{font-size:17px;font-weight:700;background:linear-gradient(135deg,var(--accent2),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:var(--radius-sm);cursor:pointer;transition:background .15s,color .15s;color:var(--text2);font-size:14px;font-weight:500;margin-bottom:2px;position:relative}
.nav-item:hover{background:var(--panel2);color:var(--text)}
.nav-item.active{background:rgba(124,58,237,.18);color:var(--accent2)}
.nav-item i{font-size:18px;width:22px;text-align:center;flex-shrink:0}
.nav-divider{height:1px;background:var(--border);margin:10px 0}
.sidebar-user{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--radius-sm);margin-top:auto}
.sidebar-user .uname{font-size:13px;font-weight:600}
.sidebar-user .uhandle{font-size:12px;color:var(--text3)}
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0;color:#fff}
.avatar-sm{width:32px;height:32px;font-size:13px}
.avatar-md{width:44px;height:44px;font-size:17px}
.avatar-lg{width:72px;height:72px;font-size:28px}
.avatar-xl{width:96px;height:96px;font-size:38px}
#auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);position:relative;overflow:hidden}
.auth-orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.25;animation:float 8s ease-in-out infinite}
.auth-orb:nth-child(1){width:400px;height:400px;background:var(--accent);top:-100px;left:-100px;animation-delay:0s}
.auth-orb:nth-child(2){width:300px;height:300px;background:var(--pink);bottom:-80px;right:-80px;animation-delay:-3s}
.auth-orb:nth-child(3){width:200px;height:200px;background:var(--teal);top:50%;left:50%;animation-delay:-5s}
@keyframes float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-30px) scale(1.05)}}
.auth-card{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:36px;width:100%;max-width:420px;position:relative;z-index:1}
.auth-logo{text-align:center;margin-bottom:24px}
.auth-logo .orb-big{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--pink));margin:0 auto 12px;position:relative;overflow:hidden}
.auth-logo .orb-big::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.35),transparent 60%)}
.auth-logo h1{font-size:26px;font-weight:800;background:linear-gradient(135deg,var(--accent2),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.auth-logo p{color:var(--text3);font-size:13px;margin-top:4px}
.tabs{display:flex;background:var(--panel2);border-radius:var(--radius-sm);padding:4px;margin-bottom:20px;gap:4px}
.tab-btn{flex:1;padding:8px;border-radius:6px;font-size:14px;font-weight:600;color:var(--text3);transition:all .2s}
.tab-btn.active{background:var(--accent);color:#fff}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:13px;font-weight:500;color:var(--text2);margin-bottom:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 20px;border-radius:var(--radius-sm);font-weight:600;font-size:14px;transition:all .2s;cursor:pointer}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent2)}
.btn-full{width:100%}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text2)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn-pink{background:var(--pink);color:#fff}
.btn-pink:hover{opacity:.9}
.btn-teal{background:var(--teal);color:#fff}
.btn-sm{padding:6px 14px;font-size:13px}
.btn-danger{background:#ef4444;color:#fff}
.btn-danger:hover{background:#dc2626}
.btn-follow{background:var(--accent);color:#fff;padding:5px 14px;border-radius:99px;font-size:13px;font-weight:600;border:none;cursor:pointer}
.btn-following{background:transparent;border:1px solid var(--border);color:var(--text2);padding:5px 14px;border-radius:99px;font-size:13px;font-weight:600;cursor:pointer}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.card-sm{padding:14px}
.story-bar{display:flex;gap:12px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
.story-bar::-webkit-scrollbar{display:none}
.story-circle{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;flex-shrink:0}
.story-ring{width:64px;height:64px;border-radius:50%;padding:3px;background:linear-gradient(135deg,var(--orange),var(--pink));transition:transform .2s}
.story-ring.seen{background:var(--border)}
.story-ring:hover{transform:scale(1.05)}
.story-inner{width:100%;height:100%;border-radius:50%;border:2px solid var(--bg);overflow:hidden;display:flex;align-items:center;justify-content:center}
.story-name{font-size:11px;color:var(--text2);max-width:64px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.add-story-btn{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;flex-shrink:0}
.add-story-ring{width:64px;height:64px;border-radius:50%;border:2px dashed var(--border);display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--text3);transition:all .2s}
.add-story-ring:hover{border-color:var(--accent);color:var(--accent)}
.composer{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.composer-top{display:flex;gap:12px;align-items:flex-start}
.composer-input{flex:1}
.composer-input textarea{background:transparent;border:none;border-bottom:1px solid var(--border);border-radius:0;padding:8px 0;font-size:15px;resize:none}
.composer-input textarea:focus{border-bottom-color:var(--accent)}
.composer-actions{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}
.composer-actions button{padding:6px 10px;border-radius:6px;font-size:13px;color:var(--text3);display:flex;align-items:center;gap:6px;transition:all .15s}
.composer-actions button:hover{background:var(--panel2);color:var(--accent)}
.composer-actions .post-btn{margin-left:auto;background:var(--accent);color:#fff;padding:8px 20px;border-radius:20px;font-weight:600}
.composer-actions .post-btn:hover{background:var(--accent2)}
.post-media{width:100%;border-radius:10px;max-height:400px;object-fit:cover;margin-bottom:10px;display:block}
.post-media-video{width:100%;border-radius:10px;max-height:400px;background:#000;margin-bottom:10px;display:block}
.composer-media-preview{position:relative;margin:10px 0}
.composer-media-preview .remove-media{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.6);color:#fff;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;border:none;z-index:2}
.media-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:8px}
.media-grid-item{aspect-ratio:1;overflow:hidden;border-radius:6px;background:#000;position:relative;cursor:pointer}
.media-grid-item img,.media-grid-item video{width:100%;height:100%;object-fit:cover}
.video-play-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:32px;background:rgba(0,0,0,.3)}
.post{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;transition:border-color .15s;position:relative}
.post:hover{border-color:var(--accent2)}
.post-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.post-meta{flex:1}
.post-meta .dname{font-weight:600;font-size:14px;cursor:pointer;color:var(--text)}
.post-meta .dname:hover{color:var(--accent2)}
.post-meta .handle{font-size:12px;color:var(--text3);cursor:pointer}
.post-meta .handle:hover{color:var(--accent2)}
.post-meta .time{font-size:12px;color:var(--text3);margin-left:8px}
.post-content{font-size:15px;line-height:1.6;margin-bottom:12px}
.post-actions{display:flex;gap:4px;position:relative}
.post-action{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:20px;font-size:13px;color:var(--text3);transition:all .15s}
.post-action:hover{background:rgba(124,58,237,.1);color:var(--accent)}
.post-action.liked{color:#ef4444}
.post-action.liked:hover{background:rgba(239,68,68,.1)}
.post-action.reposted{color:var(--teal)}
.post-action.bookmarked{color:var(--orange)}
.poll-container{background:var(--panel2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;margin-bottom:12px}
.poll-question{font-weight:600;margin-bottom:12px}
.poll-option{margin-bottom:8px}
.poll-option-btn{width:100%;text-align:left;padding:10px 14px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--panel);color:var(--text);font-size:14px;transition:all .2s;cursor:pointer;position:relative;overflow:hidden}
.poll-option-btn:hover{border-color:var(--accent)}
.poll-option-btn.voted{border-color:var(--accent);cursor:default}
.poll-bar{position:absolute;top:0;left:0;height:100%;background:rgba(124,58,237,.2);transition:width .6s ease;border-radius:var(--radius-sm)}
.poll-option-text{position:relative;z-index:1;display:flex;justify-content:space-between}
.poll-meta{font-size:12px;color:var(--text3);margin-top:8px}
.poll-create{background:var(--panel2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;margin-top:10px}
.poll-create h4{margin-bottom:10px;font-size:14px}
.poll-options-list{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.poll-option-input{display:flex;gap:6px;align-items:center}
.poll-option-input input{flex:1}
.poll-option-input button{flex-shrink:0;width:30px;height:30px;border-radius:50%;background:var(--panel);border:1px solid var(--border);color:var(--text3);display:flex;align-items:center;justify-content:center}
.tag-bar{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none;margin-bottom:16px}
.tag-bar::-webkit-scrollbar{display:none}
.tag-pill{padding:6px 14px;border-radius:20px;background:var(--panel2);border:1px solid var(--border);font-size:13px;color:var(--text2);white-space:nowrap;cursor:pointer;transition:all .2s;flex-shrink:0}
.tag-pill:hover,.tag-pill.active{background:rgba(124,58,237,.2);border-color:var(--accent);color:var(--accent2)}
.masonry{columns:2;column-gap:14px}
@media(max-width:600px){.masonry{columns:1}}
.masonry-item{break-inside:avoid;margin-bottom:14px}
.verse-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px;transition:border-color .15s}
.verse-card:hover{border-color:var(--accent2)}
.verse-card h3{font-size:15px;font-weight:600;margin-bottom:8px}
.verse-card p{font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:12px}
.verse-stats{display:flex;gap:12px;font-size:12px;color:var(--text3)}
.verse-stats span{display:flex;align-items:center;gap:4px;cursor:pointer;transition:color .15s}
.verse-stats span:hover{color:var(--accent2)}
.galaxy-hero{background:linear-gradient(135deg,rgba(124,58,237,.3),rgba(236,72,153,.2));border:1px solid var(--border);border-radius:var(--radius);padding:32px;text-align:center;margin-bottom:20px}
.galaxy-hero h1{font-size:28px;font-weight:800;background:linear-gradient(135deg,var(--purple),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
.filter-pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.filter-pill{padding:6px 14px;border-radius:20px;background:var(--panel2);border:1px solid var(--border);font-size:13px;color:var(--text2);cursor:pointer;transition:all .2s}
.filter-pill:hover,.filter-pill.active{background:rgba(139,92,246,.2);border-color:var(--purple);color:var(--purple)}
.galaxy-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.galaxy-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:20px;transition:all .2s;cursor:pointer}
.galaxy-card:hover{border-color:var(--purple);transform:translateY(-2px)}
.galaxy-card-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.galaxy-icon{width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,var(--purple),var(--accent));display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.galaxy-card h3{font-size:15px;font-weight:700}
.galaxy-card p{font-size:13px;color:var(--text2);margin-bottom:12px;line-height:1.5}
.galaxy-meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--text3)}
.spaces-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.spaces-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.space-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px;transition:all .2s;cursor:pointer}
.space-card:hover{border-color:var(--pink);transform:translateY(-2px)}
.space-card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.live-badge{display:flex;align-items:center;gap:6px;background:rgba(236,72,153,.15);border:1px solid var(--pink);border-radius:20px;padding:4px 10px;font-size:12px;color:var(--pink);font-weight:600}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--pink);animation:pulse 1.4s ease infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.3)}}
.space-card h3{font-size:15px;font-weight:700;margin-bottom:8px}
.space-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.space-tag{padding:3px 10px;border-radius:12px;background:var(--panel2);font-size:11px;color:var(--text3)}
.space-footer{display:flex;justify-content:space-between;align-items:center}
.space-speakers{display:flex}
.space-speakers .avatar{border:2px solid var(--panel);margin-right:-8px}
.listener-count{font-size:13px;color:var(--text3);display:flex;align-items:center;gap:4px}
.waveform{display:flex;align-items:center;justify-content:center;gap:4px;height:60px}
.wave-bar{width:5px;border-radius:3px;background:linear-gradient(to top,var(--pink),var(--accent));animation:wave 1.2s ease-in-out infinite}
.wave-bar:nth-child(1){animation-delay:0s}.wave-bar:nth-child(2){animation-delay:.1s}.wave-bar:nth-child(3){animation-delay:.2s}.wave-bar:nth-child(4){animation-delay:.3s}.wave-bar:nth-child(5){animation-delay:.4s}.wave-bar:nth-child(6){animation-delay:.5s}.wave-bar:nth-child(7){animation-delay:.4s}.wave-bar:nth-child(8){animation-delay:.3s}.wave-bar:nth-child(9){animation-delay:.2s}.wave-bar:nth-child(10){animation-delay:.1s}
@keyframes wave{0%,100%{height:8px}50%{height:40px}}
.space-detail{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:24px}
.space-detail-header{text-align:center;margin-bottom:20px}
.space-detail-header h2{font-size:20px;font-weight:800}
.speakers-grid{display:flex;flex-wrap:wrap;gap:20px;justify-content:center;margin:20px 0;padding:20px;background:var(--panel2);border-radius:var(--radius);border:1px solid var(--border)}
.speaker-item{display:flex;flex-direction:column;align-items:center;gap:8px}
.speaker-avatar-wrap{position:relative}
.mic-indicator{position:absolute;bottom:0;right:0;width:18px;height:18px;border-radius:50%;background:var(--teal);display:flex;align-items:center;justify-content:center;font-size:10px;border:2px solid var(--panel)}
.mic-indicator.muted{background:var(--text3)}
.space-controls{display:flex;gap:10px;justify-content:center;margin:16px 0}
.space-chat{background:var(--panel2);border:1px solid var(--border);border-radius:var(--radius);padding:14px;max-height:200px;overflow-y:auto;margin-top:16px}
.chat-msg{display:flex;gap:8px;margin-bottom:10px;font-size:13px}
.chat-msg .chat-name{font-weight:600;color:var(--accent2)}
.chat-msg .chat-text{color:var(--text2)}
.profile-header{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:16px}
.profile-top{display:flex;align-items:flex-end;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.profile-stats{display:flex;gap:24px;margin-bottom:16px;flex-wrap:wrap}
.profile-stat{text-align:center;cursor:pointer}
.profile-stat .num{font-size:20px;font-weight:700}
.profile-stat .lbl{font-size:12px;color:var(--text3)}
.profile-bio{font-size:14px;color:var(--text2);margin-bottom:12px}
.profile-tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto}
.profile-tab{padding:10px 20px;font-size:14px;font-weight:500;color:var(--text3);border-bottom:2px solid transparent;cursor:pointer;transition:all .2s;margin-bottom:-1px;white-space:nowrap}
.profile-tab.active{color:var(--accent2);border-bottom-color:var(--accent2)}
.profile-tab:hover{color:var(--text)}
.settings-section{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.settings-section h3{font-size:15px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.settings-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.settings-row:last-child{border-bottom:none}
.toggle{width:44px;height:24px;background:var(--border);border-radius:12px;position:relative;cursor:pointer;transition:background .2s;flex-shrink:0}
.toggle.on{background:var(--accent)}
.toggle::after{content:'';position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:3px;left:3px;transition:transform .2s}
.toggle.on::after{transform:translateX(20px)}
.checkbox-label{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;color:var(--text2)}
.checkbox-label input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent)}
.story-viewer{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:1000;display:flex;align-items:center;justify-content:center}
.story-viewer-inner{position:relative;width:min(400px,100vw);height:min(711px,100vh);border-radius:16px;overflow:hidden}
.story-progress-bar{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:4px;z-index:2}
.story-seg{flex:1;height:3px;background:rgba(255,255,255,.3);border-radius:2px;overflow:hidden}
.story-seg-fill{height:100%;background:#fff;width:0%}
.story-seg-fill.done{width:100%}
.story-close{position:absolute;top:14px;right:14px;z-index:3;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px}
.story-body{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:#fff;text-align:center;padding:24px;position:absolute;top:0;left:0}
.story-nav{position:absolute;inset:0;display:flex;z-index:2}

// ─── Seed realistic 30-day analytics ───
function seedAnalytics(){
  const uid=session&&session.userId||'u1';
  if(analytics[uid])return;
  const now=Date.now();
  const DAY=86400000;
  // Generate 30 days of daily stats
  const dailyStats={};
  const followerHistory=[];
  let followerBase=Math.floor(Math.random()*200+80);
  for(let i=29;i>=0;i--){
    const d=new Date(now-i*DAY);
    const key=d.toISOString().slice(0,10);
    const weekday=d.getDay();// 0=Sun
    const isWeekend=weekday===0||weekday===6;
    const base=isWeekend?180:120;
    const views=Math.floor(base+Math.random()*base*0.8+(i<7?50:0));
    const likes=Math.floor(views*0.08+Math.random()*10);
    const comments=Math.floor(likes*0.3);
    const gain=Math.floor(Math.random()*8+(i<7?3:0));
    followerBase+=gain;
    dailyStats[key]={views,likes,comments,reach:Math.floor(views*1.4),newFollowers:gain};
    followerHistory.push({date:key,count:followerBase});
  }
  // 24-hour engagement pattern (typical Taiwan night-owl pattern)
  const hourlyStats=[8,5,3,2,2,3,7,15,22,28,30,32,35,30,28,25,30,38,55,82,95,88,72,45];
  // 7-day weekday pattern [Mon,Tue,Wed,Thu,Fri,Sat,Sun]
  const weekdayStats=[320,290,315,340,380,520,490];
  // Traffic sources
  const trafficSources={home:42,explore:28,profile:15,hashtag:10,share:5};
  // Post views (distribute views across my posts)
  const myPosts=posts.filter(p=>p.userId===uid);
  const postViews={};
  myPosts.forEach((p,i)=>{
    postViews[p.id]=Math.floor(300+Math.random()*800*(1-i*0.1));
  });
  // Content type performance
  const contentTypePerf={
    text:{views:1240,count:4,avgLikes:18},
    image:{views:3800,count:2,avgLikes:52},
    video:{views:5200,count:1,avgLikes:89},
    poll:{views:2100,count:2,avgLikes:34}
  };
  analytics[uid]={dailyStats,followerHistory,hourlyStats,weekdayStats,trafficSources,postViews,contentTypePerf,lastUpdated:now};
  saveAnalytics();
}

// Track a post being viewed
function trackPostView(postId,source='home'){
  if(!session)return;
  const uid=session.userId;
  if(!analytics[uid])seedAnalytics();
  const a=analytics[uid];
  // Update post views
  a.postViews=a.postViews||{};
  a.postViews[postId]=(a.postViews[postId]||0)+1;
  // Update today's daily stats
  const today=new Date().toISOString().slice(0,10);
  if(!a.dailyStats[today])a.dailyStats[today]={views:0,likes:0,comments:0,reach:0,newFollowers:0};
  const post=posts.find(p=>p.id===postId);
  if(post&&post.userId===uid){
    a.dailyStats[today].views++;
    a.dailyStats[today].reach=Math.floor(a.dailyStats[today].views*1.4);
  }
  // Update hourly stats
  const hour=new Date().getHours();
  a.hourlyStats=a.hourlyStats||Array(24).fill(0);
  a.hourlyStats[hour]=(a.hourlyStats[hour]||0)+1;
  // Update traffic source
  a.trafficSources=a.trafficSources||{home:0,explore:0,profile:0,hashtag:0,share:0};
  a.trafficSources[source]=(a.trafficSources[source]||0)+1;
  saveAnalytics();
}

// ─── Content keyword analysis ───
function analyzeTopContent(userId){
  const myPosts=posts.filter(p=>p.userId===userId);
  if(!myPosts.length)return{keywords:[],topType:'text',insight:''};
  const a=analytics[userId]||{};
  const postViews=a.postViews||{};
  // Score each post: views + engagement
  const scored=myPosts.map(p=>({
    ...p,
    totalScore:(postViews[p.id]||0)+(p.likes?.length||0)*3+(p.comments||0)*2+(p.reposts?.length||0)*2
  })).sort((a,b)=>b.totalScore-a.totalScore);
  const topThird=scored.slice(0,Math.max(1,Math.ceil(scored.length*0.4)));
  // Extract keywords (skip stopwords)
  const stopSet=new Set(['的','了','是','在','和','也','就','都','但','這','那','他','你','我','很','有','沒','到','不','一','個','她','它','我們','你們','他們','地','得','過','著','或','因為','所以','雖然','如果','而且','還是','還有','什麼','可以','已經','只是','還是','就是','因此','所以','哈哈','！','？','…','。','，','：','；']);
  const wordFreq={};
  topThird.forEach(p=>{
    const words=p.content.split(/[\s，。！？、：；「」『』【】\(\)（）\n#@]+/u).filter(w=>w.length>=2&&!stopSet.has(w));
    words.forEach(w=>{wordFreq[w]=(wordFreq[w]||0)+1;});
  });
  const keywords=Object.entries(wordFreq).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([w])=>w);
  // Best content type
  const typeScore={};
  scored.forEach(p=>{const t=p.mediaType?p.mediaType:p.type==='poll'?'poll':'text';typeScore[t]=(typeScore[t]||0)+p.totalScore;});
  const topType=Object.entries(typeScore).sort((a,b)=>b[1]-a[1])[0]?.[0]||'text';
  const typeNames={text:'純文字',image:'圖片',video:'影片',poll:'投票'};
  // Best hour
  const hourly=a.hourlyStats||Array(24).fill(0);
  const bestHour=hourly.indexOf(Math.max(...hourly));
  const insight=`你的 ${typeNames[topType]||topType} 貼文平均觸及最高，最佳發文時段為 ${bestHour}:00–${bestHour+1}:00`;
  return{keywords,topType,insight,scored:scored.slice(0,5)};
}

function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function timeAgo(ts){
  const d=(Date.now()-ts)/1000;
  if(d<60)return '剛剛';if(d<3600)return Math.floor(d/60)+'分鐘前';
  if(d<86400)return Math.floor(d/3600)+'小時前';return Math.floor(d/86400)+'天前';
}
function uid(){return 'id'+Date.now()+Math.random().toString(36).slice(2)}
function toast(msg,type='info'){
  const c=document.getElementById('toast-container');
  const t=document.createElement('div');
  t.className=`toast ${type}`;
  const icons={success:'ti-check',error:'ti-x',info:'ti-info-circle'};
  t.innerHTML=`<i class="ti ${icons[type]||'ti-info-circle'}"></i>${esc(msg)}`;
  c.appendChild(t);
  requestAnimationFrame(()=>{requestAnimationFrame(()=>t.classList.add('show'))});
  setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),350)},3000);
}

function addNotification(type,fromUserId,postId,extraText){
  if(!session)return;
  const p=postId?posts.find(x=>x.id===postId):null;
  const postOwnerId=p?p.userId:null;
  if(postOwnerId===session.userId)return; // Don't notify yourself via post
  const fromUser=users.find(x=>x.id===fromUserId)||{displayName:session.displayName,avatarColor:session.avatarColor};
  const notif={
    id:uid(),type,
    fromUserId,fromDisplayName:fromUser.displayName,fromAvatarColor:fromUser.avatarColor,
    postId:postId||null,text:extraText||'',createdAt:Date.now(),read:false
  };
  notifications.unshift(notif);
  if(notifications.length>100)notifications=notifications.slice(0,100);
  saveNotifications();
  updateNotifBadge();
}
function addNotificationForUser(type,fromUserId,targetUserId,postId,extraText){
  if(!session||targetUserId===session.userId)return;
  const fromUser=users.find(x=>x.id===fromUserId)||{displayName:session.displayName,avatarColor:session.avatarColor};
  const notif={
    id:uid(),type,
    fromUserId,fromDisplayName:fromUser.displayName,fromAvatarColor:fromUser.avatarColor,
    targetUserId,postId:postId||null,text:extraText||'',createdAt:Date.now(),read:false
  };
  notifications.unshift(notif);
  if(notifications.length>100)notifications=notifications.slice(0,100);
  saveNotifications();
  updateNotifBadge();
}
function updateNotifBadge(){
  const unread=notifications.filter(n=>!n.read).length;
  const badge=document.getElementById('notif-badge');
  if(badge){
    badge.textContent=unread>99?'99+':unread;
    badge.classList.toggle('hidden',unread===0);
  }
}

  document.getElementById('login-form').classList.toggle('hidden',tab!=='login');
  document.getElementById('register-form').classList.toggle('hidden',tab!=='register');
}
function doLogin(){
  const u=document.getElementById('li-user').value.trim();
  const p=document.getElementById('li-pass').value;
  if(!u||!p){toast('請填寫所有欄位','error');return}
  const user=users.find(x=>x.username===u);
  if(!user||user.password!==btoa(p)){toast('帳號或密碼錯誤','error');return}
  session={userId:user.id,username:user.username,displayName:user.displayName,avatarColor:user.avatarColor};
  saveSession();showApp();toast('歡迎回來，'+user.displayName+'！','success');
}
function doRegister(){
  const name=document.getElementById('reg-name').value.trim();
  const u=document.getElementById('reg-user').value.trim().toLowerCase().replace(/[^a-z0-9_]/g,'');
  const p=document.getElementById('reg-pass').value;
  const p2=document.getElementById('reg-pass2').value;
  if(!name||!u||!p||!p2){toast('請填寫所有欄位','error');return}
  if(p!==p2){toast('密碼不一致','error');return}
  if(p.length<6){toast('密碼至少6位','error');return}
  if(users.find(x=>x.username===u)){toast('帳號已被使用','error');return}
  const user={id:'u'+Date.now(),username:u,displayName:name,password:btoa(p),bio:'',createdAt:Date.now(),avatarColor:hashColor(u),followers:[],following:[]};
  users.push(user);saveUsers();
  session={userId:user.id,username:user.username,displayName:user.displayName,avatarColor:user.avatarColor};
  saveSession();showApp();toast('帳號建立成功！歡迎，'+name+'！','success');
}
function doLogout(){
  session=null;localStorage.removeItem('bv_session');
  document.getElementById('app').classList.add('hidden');
  document.getElementById('auth-screen').classList.remove('hidden');
  toast('已登出','info');
}

// ═══════════════════════════════════════════════════════════
// FOLLOW SYSTEM
// ═══════════════════════════════════════════════════════════
function isFollowing(targetId){
  if(!session)return false;
  const me=users.find(u=>u.id===session.userId);
  return me&&me.following&&me.following.includes(targetId);
}
function toggleFollow(targetId){
  if(!session||targetId===session.userId)return;
  const me=users.find(u=>u.id===session.userId);
  const target=users.find(u=>u.id===targetId);
  if(!me||!target)return;
  if(!me.following)me.following=[];
  if(!target.followers)target.followers=[];
  const idx=me.following.indexOf(targetId);
  if(idx>=0){
    me.following.splice(idx,1);
    target.followers.splice(target.followers.indexOf(session.userId),1);
    toast('已取消追蹤','info');
  } else {
    me.following.push(targetId);
    target.followers.push(session.userId);
    addNotificationForUser('follow',session.userId,targetId,null,'開始追蹤你');
    toast('已追蹤 '+target.displayName,'success');
  }
  saveUsers();
  session.following=me.following;saveSession();
  // Re-render any follow buttons on page
  document.querySelectorAll(`[data-follow="${targetId}"]`).forEach(btn=>{
    const following=isFollowing(targetId);
    btn.className=following?'btn-following':'btn-follow';
    btn.textContent=following?'已追蹤':'追蹤';
  });
  updateNotifBadge();
}

// ═══════════════════════════════════════════════════════════
// MEDIA FILE HANDLING
// ═══════════════════════════════════════════════════════════
function attachFile(){
  document.getElementById('media-file-input').click();
}
function handleMediaFiles(input){
  const file=input.files[0];if(!file)return;
  if(file.size>50*1024*1024){toast('檔案過大（最大50MB）','error');input.value='';return}
  const isVideo=file.type.startsWith('video/');
  const isImage=file.type.startsWith('image/');
  if(!isVideo&&!isImage){toast('僅支援圖片或影片檔案','error');input.value='';return}
  const reader=new FileReader();
  reader.onload=e=>{
    composerMediaUrl=e.target.result;
    composerMediaType=isVideo?'video':'image';
    renderComposerMediaPreview();
  };
  reader.readAsDataURL(file);
  input.value='';
}
function renderComposerMediaPreview(){
  const area=document.getElementById('composer-media-area');
  if(!area)return;
  if(!composerMediaUrl){area.innerHTML='';return;}
  if(composerMediaType==='video'){
    area.innerHTML=`<div class="composer-media-preview"><video src="${composerMediaUrl}" class="post-media-video" controls playsinline muted style="max-height:200px"></video><button class="remove-media" onclick="clearComposerMedia()">✕</button></div>`;
  } else {
    area.innerHTML=`<div class="composer-media-preview"><img src="${composerMediaUrl}" class="post-media" style="max-height:200px"/><button class="remove-media" onclick="clearComposerMedia()">✕</button></div>`;
  }
}
function clearComposerMedia(){composerMediaUrl=null;composerMediaType=null;renderComposerMediaPreview();}
function handleStoryMedia(input){
  const file=input.files[0];if(!file)return;
  if(file.size>50*1024*1024){toast('檔案過大（最大50MB）','error');input.value='';return}
  const isVideo=file.type.startsWith('video/');
  const isImage=file.type.startsWith('image/');
  if(!isVideo&&!isImage){toast('僅支援圖片或影片檔案','error');input.value='';return}
  const reader=new FileReader();
  reader.onload=e=>{
    storyMediaUrl=e.target.result;
    storyMediaType=isVideo?'video':'image';
    const prev=document.getElementById('story-preview');
    if(prev){
      if(isVideo){prev.innerHTML=`<video src="${storyMediaUrl}" style="width:100%;height:100%;object-fit:cover;border-radius:8px" autoplay muted loop playsinline></video>`;}
      else{prev.innerHTML=`<img src="${storyMediaUrl}" style="width:100%;height:100%;object-fit:cover;border-radius:8px"/>`;}
    }
    const storyTextEl=document.getElementById('story-text');
    if(storyTextEl&&!storyTextEl.value)storyTextEl.value='';
  };
  reader.readAsDataURL(file);
  input.value='';
}

function renderHome(){
  const unread=(JSON.parse(localStorage.getItem('bv_notifications')||'[]')).filter(n=>!n.read&&n.toUserId===session.userId).length;
  return `
  <div class="home-topbar">
    <span class="home-logo" onclick="window.scrollTo({top:0,behavior:'smooth'})">Bubble Verse</span>
    <div class="topbar-actions">
      <button class="topbar-btn" onclick="openCreateStoryDialog()" title="新增動態">➕</button>
      <button class="topbar-btn" onclick="navigate('notifications')" title="通知">
        🔔${unread>0?`<span class="topbar-badge"></span>`:''}
      </button>
      <button class="topbar-btn" onclick="navigate('settings')" title="設定">⚙️</button>
    </div>
  </div>
  ${renderStoryBarHTML()}
  ${renderComposerHTML()}
  <div class="feed-tabs">
    <div class="feed-tab ${feedFilter==='all'?'active':''}" onclick="setFeedFilter('all')">全部</div>
    <div class="feed-tab ${feedFilter==='following'?'active':''}" onclick="setFeedFilter('following')">追蹤中</div>
  </div>
  <div id="feed">${renderFeedHTML(getFilteredPosts())}</div>`;
}
function setFeedFilter(f){
  feedFilter=f;
  const feed=document.getElementById('feed');
  if(feed){feed.innerHTML=renderFeedHTML(getFilteredPosts());_applyIcons(feed);}
  document.querySelectorAll('.feed-tab').forEach(t=>{t.classList.toggle('active',t.textContent===(f==='all'?'全部':'追蹤中'))});
}
function getFilteredPosts(){
  if(feedFilter==='all')return posts;
  const me=users.find(u=>u.id===session.userId);
  if(!me||!me.following||!me.following.length)return [];
  return posts.filter(p=>me.following.includes(p.userId)||p.userId===session.userId);
}
function renderStoryBarHTML(){
  const grouped=groupStories();
  let html=`<div class="story-bar">
  <div class="add-story-btn" onclick="openCreateStoryDialog()">
    <div class="add-story-ring"><i class="ti ti-plus"></i></div>
    <span class="story-name">新增動態</span>
  </div>`;
  for(let gi=0;gi<grouped.length;gi++){
    const g=grouped[gi];
    const seen=g.stories.every(s=>s.seen.includes(session.userId));
    html+=`<div class="story-circle" onclick="openStoryViewer(${gi})">
      <div class="story-ring ${seen?'seen':''}">
        <div class="story-inner">${avatarHTML(g.displayName,g.avatarColor,'')}</div>
      </div>
      <span class="story-name">${esc(g.displayName)}</span>
    </div>`;
  }
  return html+'</div>';
}
function groupStories(){
  const map={};
  for(const s of stories){
    if(!map[s.userId])map[s.userId]={userId:s.userId,username:s.username,displayName:s.displayName,avatarColor:s.avatarColor,stories:[]};
    map[s.userId].stories.push(s);
  }
  return Object.values(map);
}
function renderComposerHTML(galaxyId){
  return `<div class="composer">
    <div class="composer-top">
      ${avatarHTML(session.displayName,session.avatarColor,'avatar-sm')}
      <div class="composer-input">
        <textarea id="compose-text" placeholder="在想什麼？" rows="2"></textarea>
        <div id="composer-media-area"></div>
        <div id="poll-area"></div>
      </div>
    </div>
    <div class="composer-actions">
      <button onclick="attachFile()"><i class="ti ti-photo"></i>媒體</button>
      <button id="poll-btn" onclick="togglePollComposer()"><i class="ti ti-chart-bar"></i>投票</button>
      <button onclick="openCreateSpaceDialog()"><i class="ti ti-broadcast"></i>語音</button>
      <button class="post-btn" onclick="submitPost(${galaxyId?`'${galaxyId}'`:'null'})">發布</button>
    </div>
  </div>`;
}
function renderFeedHTML(arr,source='home'){
  const sorted=[...arr].sort((a,b)=>b.createdAt-a.createdAt);
  if(!sorted.length)return '<div class="empty-state"><i class="ti ti-notes-off"></i><p>還沒有貼文，快去追蹤一些人吧！</p></div>';
  // Track views for each post's owner
  sorted.forEach(p=>{if(p.userId!==session?.userId)trackPostView(p.id,source);});
  return sorted.map(p=>renderPostHTML(p)).join('');
}
function renderPostHTML(p){
  if(!p)return '';
  const liked=p.likes&&p.likes.includes(session.userId);
  const reposted=p.reposts&&p.reposts.includes(session.userId);
  const bms=bookmarks[session.userId]||[];
  const bmd=bms.includes(p.id);
  const isOwn=p.userId===session.userId;
  const following=isFollowing(p.userId);
  let mediaHTML='';
  if(p.mediaUrl){
    if(p.mediaType==='video'){
      mediaHTML=`<video src="${p.mediaUrl}" class="post-media-video" controls playsinline muted></video>`;
    } else {
      mediaHTML=`<img src="${p.mediaUrl}" class="post-media" loading="lazy"/>`;
    }
  }
  let pollHTML='';
  if(p.type==='poll'&&p.poll){pollHTML=renderPollHTML(p);}
  let quoteHTML='';
  if(p.type==='quote'&&p.quotedPostId){
    const qp=posts.find(x=>x.id===p.quotedPostId);
    if(qp){quoteHTML=`<div class="quote-embed"><div class="quote-author">${esc(qp.displayName)} @${esc(qp.username)}</div><div class="quote-text">${esc(qp.content)}</div></div>`;}
    else if(p.quotedContent){quoteHTML=`<div class="quote-embed"><div class="quote-author">${esc(p.quotedAuthor||'')}</div><div class="quote-text">${esc(p.quotedContent)}</div></div>`;}
  }
  const commentCount=(comments[p.id]||[]).length||p.comments||0;
  const followBtn=(!isOwn)?`<button class="${following?'btn-following':'btn-follow'}" data-follow="${p.userId}" onclick="toggleFollow('${p.userId}')" style="margin-left:auto">${following?'已追蹤':'追蹤'}</button>`:'';
  return `<div class="post" id="post-${p.id}">
    <div class="post-header">
      <div style="cursor:pointer" onclick="openUserProfile('${p.userId}')">${avatarHTML(p.displayName,p.avatarColor,'avatar-sm')}</div>
      <div class="post-meta">
        <span class="dname" onclick="openUserProfile('${p.userId}')">${esc(p.displayName)}</span>
        <span class="handle" onclick="openUserProfile('${p.userId}')">@${esc(p.username)}</span>
        <span class="time">${timeAgo(p.createdAt)}</span>
      </div>
      ${followBtn}
    </div>
    <div class="post-content">${esc(p.content).replace(/\n/g,'<br>')}</div>
    ${mediaHTML}${quoteHTML}${pollHTML}
    <div class="post-actions">
      <button class="post-action ${liked?'liked':''}" onclick="toggleLike('${p.id}')">
        <i class="ti ${liked?'ti-heart-filled':'ti-heart'}"></i><span>${(p.likes||[]).length}</span>
      </button>
      <button class="post-action" onclick="openComments('${p.id}')">
        <i class="ti ti-message-circle"></i><span>${commentCount}</span>
      </button>
      <button class="post-action ${reposted?'reposted':''}" onclick="showRepostMenu('${p.id}',this)" style="position:relative">
        <i class="ti ti-repeat"></i><span>${(p.reposts||[]).length}</span>
      </button>
      <button class="post-action ${bmd?'bookmarked':''}" onclick="toggleBookmark('${p.id}')">
        <i class="ti ${bmd?'ti-bookmark-filled':'ti-bookmark'}"></i>
      </button>
      <button class="post-action" onclick="copyPostLink('${p.id}')">
        <i class="ti ti-share"></i>
      </button>
    </div>
  </div>`;
}

// ═══════════════════════════════════════════════════════════
// POST ACTIONS
// ═══════════════════════════════════════════════════════════
function toggleLike(id){
  const p=posts.find(x=>x.id===id);if(!p)return;
  if(!p.likes)p.likes=[];
  const idx=p.likes.indexOf(session.userId);
  if(idx>=0){p.likes.splice(idx,1);}
  else{
    p.likes.push(session.userId);
    if(p.userId!==session.userId)addNotificationForUser('like',session.userId,p.userId,id,'');
  }
  savePosts();
  const el=document.getElementById('post-'+id);
  if(el){const newEl=document.createElement('div');newEl.innerHTML=renderPostHTML(p);el.replaceWith(newEl.firstChild);_applyIcons(document.getElementById('post-'+id));}
}
function showRepostMenu(id,btn){
  document.querySelectorAll('.action-dropdown').forEach(d=>d.remove());
  const menu=document.createElement('div');
  menu.className='action-dropdown';
  menu.innerHTML=`<div class="action-dropdown-item" onclick="directRepost('${id}')"><i class="ti ti-repeat"></i>直接轉發</div><div class="action-dropdown-item" onclick="openQuoteRepost('${id}')"><i class="ti ti-quote"></i>引用轉發</div>`;
  const wrap=btn.closest('.post-actions');
  if(wrap){wrap.style.position='relative';wrap.appendChild(menu);}
  setTimeout(()=>document.addEventListener('click',function h(){menu.remove();document.removeEventListener('click',h);}),10);
}
function directRepost(id){
  document.querySelectorAll('.action-dropdown').forEach(d=>d.remove());
  const p=posts.find(x=>x.id===id);if(!p)return;
  if(!p.reposts)p.reposts=[];
  const idx=p.reposts.indexOf(session.userId);
  if(idx>=0){p.reposts.splice(idx,1);toast('取消轉發','info');}
  else{
    p.reposts.push(session.userId);
    if(p.userId!==session.userId)addNotificationForUser('repost',session.userId,p.userId,id,'');
    toast('已轉發','success');
  }
  savePosts();
  const el=document.getElementById('post-'+id);
  if(el){const newEl=document.createElement('div');newEl.innerHTML=renderPostHTML(p);el.replaceWith(newEl.firstChild);_applyIcons(document.getElementById('post-'+id));}
}
function openQuoteRepost(id){
  document.querySelectorAll('.action-dropdown').forEach(d=>d.remove());
  const p=posts.find(x=>x.id===id);if(!p)return;
  openDialog(`<h2>引用轉發</h2>
    <button class="dialog-close" onclick="closeDialog()"><i class="ti ti-x"></i></button>
    <div class="form-group"><textarea id="quote-text" placeholder="加入你的想法..." rows="3"></textarea></div>
    <div class="quote-embed"><div class="quote-author">${esc(p.displayName)} @${esc(p.username)}</div><div class="quote-text">${esc(p.content)}</div></div>
    <div class="dialog-footer">
      <button class="btn btn-ghost" onclick="closeDialog()">取消</button>
      <button class="btn btn-primary" onclick="submitQuoteRepost('${id}')">發布引用</button>
    </div>`);
}
function submitQuoteRepost(quotedPostId){
  const txt=document.getElementById('quote-text').value.trim();
  const qp=posts.find(x=>x.id===quotedPostId);if(!qp)return;
  const p={
    id:uid(),userId:session.userId,username:session.username,
    displayName:session.displayName,avatarColor:session.avatarColor,
    content:txt||'',likes:[],reposts:[],comments:0,createdAt:Date.now(),
    type:'quote',quotedPostId,quotedContent:qp.content,quotedAuthor:qp.displayName+' @'+qp.username
  };
  posts.unshift(p);savePosts();closeDialog();
  if(qp.userId!==session.userId)addNotificationForUser('quote',session.userId,qp.userId,quotedPostId,'引用了你的貼文');
  toast('引用轉發成功！','success');
  const feed=document.getElementById('feed');
  if(feed){const div=document.createElement('div');div.innerHTML=renderPostHTML(p);feed.insertBefore(div.firstChild,feed.firstChild);_applyIcons(feed);}
}
function toggleBookmark(id){
  if(!bookmarks[session.userId])bookmarks[session.userId]=[];
  const bms=bookmarks[session.userId];
  const idx=bms.indexOf(id);
  if(idx>=0){bms.splice(idx,1);toast('已移除收藏','info');}
  else{bms.push(id);toast('已加入收藏','success');}
  saveBookmarks();
  const el=document.getElementById('post-'+id);
  const p=posts.find(x=>x.id===id);
  if(el&&p){const newEl=document.createElement('div');newEl.innerHTML=renderPostHTML(p);el.replaceWith(newEl.firstChild);_applyIcons(document.getElementById('post-'+id));}
}
function copyPostLink(id){toast('已複製貼文連結','success')}

function openComments(postId){
  const p=posts.find(x=>x.id===postId);if(!p)return;
  const clist=comments[postId]||[];
  const cHTML=clist.map(c=>`
    <div class="comment-item">
      <div style="cursor:pointer" onclick="closeDialog();openUserProfile('${c.userId}')">${avatarHTML(c.displayName,c.avatarColor,'avatar-sm')}</div>
      <div class="comment-body">
        <div class="comment-author" style="cursor:pointer" onclick="closeDialog();openUserProfile('${c.userId}')">${esc(c.displayName)} <span style="color:var(--text3);font-weight:400">@${esc(c.username)}</span></div>
        <div class="comment-text">${esc(c.text)}</div>
        <div class="comment-time">${timeAgo(c.createdAt)}</div>
      </div>
    </div>`).join('');
  openDialog(`<h2><i class="ti ti-message-circle"></i> 留言 (${clist.length})</h2>
    <button class="dialog-close" onclick="closeDialog()"><i class="ti ti-x"></i></button>
    <div style="margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--border)">
      <div class="post-content" style="font-size:14px;color:var(--text2)">${esc(p.content)}</div>
    </div>
    <div id="comment-list" style="max-height:300px;overflow-y:auto;margin-bottom:16px">${cHTML||'<p style="color:var(--text3);text-align:center;padding:20px">還沒有留言</p>'}</div>
    <div style="display:flex;gap:8px;align-items:flex-start">
      ${avatarHTML(session.displayName,session.avatarColor,'avatar-sm')}
      <div style="flex:1">
        <textarea id="comment-input" placeholder="留言..." rows="2" style="margin-bottom:8px"></textarea>
        <button class="btn btn-primary btn-sm" onclick="submitComment('${postId}')">發布留言</button>
      </div>
    </div>`);
}
function submitComment(postId){
  const input=document.getElementById('comment-input');
  if(!input)return;
  const txt=input.value.trim();
  if(!txt){toast('請輸入留言內容','error');return}
  if(!comments[postId])comments[postId]=[];
  const c={id:uid(),userId:session.userId,username:session.username,displayName:session.displayName,avatarColor:session.avatarColor,text:txt,createdAt:Date.now()};
  comments[postId].push(c);saveComments();
  const p=posts.find(x=>x.id===postId);
  if(p){p.comments=(comments[postId]||[]).length;savePosts();}
  if(p&&p.userId!==session.userId)addNotificationForUser('comment',session.userId,p.userId,postId,txt);
  input.value='';
  const list=document.getElementById('comment-list');
  if(list){
    const div=document.createElement('div');
    div.innerHTML=`<div class="comment-item">
      <div>${avatarHTML(c.displayName,c.avatarColor,'avatar-sm')}</div>
      <div class="comment-body">
        <div class="comment-author">${esc(c.displayName)} <span style="color:var(--text3);font-weight:400">@${esc(c.username)}</span></div>

}

// POLL
// ═══════════════════════════════════════════════════════════
function renderPollHTML(p){
  const voted=pollVotes[p.id];
  const total=p.poll.options.reduce((a,o)=>a+o.votes,0)||1;
  const expires=p.poll.expiresAt;
  const remaining=Math.max(0,Math.floor((expires-Date.now())/3600000));
  let opts=p.poll.options.map((o,i)=>{
    const pct=voted!=null?Math.round(o.votes/total*100):0;
    return `<div class="poll-option">
      <button class="poll-option-btn ${voted!=null?'voted':''}" onclick="${voted==null?`votePoll('${p.id}',${i})`:''}">
        ${voted!=null?`<div class="poll-bar" style="width:${pct}%"></div>`:''}
        <span class="poll-option-text"><span>${esc(o.text)}</span>${voted!=null?`<span>${pct}%</span>`:''}</span>
      </button>
    </div>`;
  }).join('');
  return `<div class="poll-container">
    <div class="poll-question">${esc(p.poll.question)}</div>
    ${opts}
    <div class="poll-meta">${total} 票 · ${remaining>0?remaining+'小時後截止':'已截止'}</div>
  </div>`;
}
function votePoll(postId,optIndex){
  if(pollVotes[postId]!=null){toast('已投票','info');return}
  const p=posts.find(x=>x.id===postId);
  if(!p||!p.poll)return;
  p.poll.options[optIndex].votes++;
  pollVotes[postId]=optIndex;
  savePosts();savePollVotes();
  const el=document.getElementById('post-'+postId);
  if(el){const newEl=document.createElement('div');newEl.innerHTML=renderPostHTML(p);el.replaceWith(newEl.firstChild);_applyIcons(document.getElementById('post-'+postId));}
  toast('投票成功！','success');
}
function togglePollComposer(){
  const area=document.getElementById('poll-area');
  if(!area)return;
  if(pollComposerData){
    pollComposerData=null;area.innerHTML='';
    const btn=document.getElementById('poll-btn');if(btn)btn.style.color='';
    return;
  }
  pollComposerData={question:'',options:['','']};
  renderPollComposer();
  const btn=document.getElementById('poll-btn');if(btn)btn.style.color='var(--accent)';
}
function renderPollComposer(){
  const area=document.getElementById('poll-area');
  if(!area||!pollComposerData)return;
  let optsHTML=pollComposerData.options.map((o,i)=>`
    <div class="poll-option-input">
      <input type="text" placeholder="選項 ${i+1}" value="${esc(o)}" oninput="pollComposerData.options[${i}]=this.value" maxlength="40"/>
      ${pollComposerData.options.length>2?`<button onclick="removePollOption(${i})"><i class="ti ti-x"></i></button>`:''}
    </div>`).join('');
  area.innerHTML=`<div class="poll-create">
    <h4><i class="ti ti-chart-bar"></i> 建立投票</h4>
    <div class="form-group"><input type="text" placeholder="投票問題" oninput="pollComposerData.question=this.value" maxlength="80" value="${esc(pollComposerData.question)}"/></div>
    <div class="poll-options-list">${optsHTML}</div>
    ${pollComposerData.options.length<4?`<button class="btn btn-ghost btn-sm" onclick="addPollOption()"><i class="ti ti-plus"></i> 新增選項</button>`:''}
  </div>`;
  _applyIcons(area);
}
function addPollOption(){if(pollComposerData&&pollComposerData.options.length<4){pollComposerData.options.push('');renderPollComposer();}}
function removePollOption(i){if(pollComposerData){pollComposerData.options.splice(i,1);renderPollComposer();}}

// SUBMIT POST
// ═══════════════════════════════════════════════════════════
function submitPost(galaxyId){
  const txt=document.getElementById('compose-text').value.trim();
  if(!txt&&!pollComposerData&&!composerMediaUrl){toast('請輸入內容或選擇媒體','error');return}
  const p={
    id:uid(),userId:session.userId,username:session.username,
    displayName:session.displayName,avatarColor:session.avatarColor,
    content:txt||(pollComposerData?pollComposerData.question:'')||'',
    likes:[],reposts:[],comments:0,createdAt:Date.now(),
    type:pollComposerData?'poll':'post'
  };
  if(composerMediaUrl){p.mediaUrl=composerMediaUrl;p.mediaType=composerMediaType;}
  if(galaxyId)p.galaxyId=galaxyId;
  if(pollComposerData){
    const opts=pollComposerData.options.filter(o=>o.trim());
    if(opts.length<2){toast('請至少填寫2個選項','error');return}
    p.poll={question:pollComposerData.question||txt,options:opts.map(t=>({text:t,votes:0})),totalVotes:0,expiresAt:Date.now()+86400000};
  }
  posts.unshift(p);savePosts();
  document.getElementById('compose-text').value='';
  pollComposerData=null;composerMediaUrl=null;composerMediaType=null;
  const feed=document.getElementById('feed');
  if(feed){const div=document.createElement('div');div.innerHTML=renderPostHTML(p);feed.insertBefore(div.firstChild,feed.firstChild);_applyIcons(feed);}
  const area=document.getElementById('poll-area');if(area)area.innerHTML='';
  const mediaArea=document.getElementById('composer-media-area');if(mediaArea)mediaArea.innerHTML='';
  const btn=document.getElementById('poll-btn');if(btn)btn.style.color='';
  toast('發布成功！','success');
}

function renderBubbles(){
  let storyCardsHTML=stories.map(s=>{

      previewContent=`<video src="${s.mediaUrl}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0" muted playsinline></video><div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:1;font-size:36px">▶</div>`;

    }
    return `<div class="card card-sm" style="cursor:pointer;background:${s.bg||'var(--panel2)'};aspect-ratio:9/16;border-radius:var(--radius);display:flex;flex-direction:column;justify-content:space-between;padding:14px;min-height:180px;position:relative;overflow:hidden" onclick="openStoryViewerById('${s.id}')">
      ${previewContent}
      <div style="display:flex;align-items:center;gap:8px;position:relative;z-index:2">${avatarHTML(s.displayName,s.avatarColor,'avatar-sm')}<span style="font-size:12px;font-weight:600;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7)">${esc(s.displayName)}</span></div>
      <div style="color:#fff;font-size:14px;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.7);position:relative;z-index:2">${esc(s.text||'').replace(/\n/g,'<br>')}</div>
    </div>`;
  }).join('');
  return `
  <div class="page-title"><i class="ti ti-bubble" style="color:var(--orange)"></i>限時動態</div>
  ${renderStoryBarHTML()}
  <div style="display:flex;justify-content:flex-end;margin-bottom:16px">
    <button class="btn btn-primary" onclick="openCreateStoryDialog()"><i class="ti ti-plus"></i> 新增動態</button>
  </div>
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px">${storyCardsHTML||'<div class="empty-state"><i class="ti ti-bubble"></i><p>還沒有故事</p></div>'}</div>`;
}
function openStoryViewerById(sid){
  const grouped=groupStories();
  for(let gi=0;gi<grouped.length;gi++){
    const si=grouped[gi].stories.findIndex(s=>s.id===sid);
    if(si>=0){openStoryViewer(gi,si);return;}
  }
}
function openStoryViewer(groupIdx,storyIdx=0){
  storyGroups=groupStories();
  if(!storyGroups.length)return;
  storyGroupIndex=groupIdx;storyIndex=storyIdx;
  showCurrentStory();
  document.getElementById('story-viewer').classList.remove('hidden');
}
function showCurrentStory(){
  if(storyTimer)clearTimeout(storyTimer);
  const g=storyGroups[storyGroupIndex];if(!g)return closeStoryViewer();
  const s=g.stories[storyIndex];if(!s)return closeStoryViewer();
  if(!s.seen.includes(session.userId)){s.seen.push(session.userId);saveStories();}
  const inner=document.getElementById('story-viewer-inner');
  const bodyEl=document.getElementById('story-body');
  const videoEl=document.getElementById('story-video');
  // Reset
  videoEl.classList.add('hidden');videoEl.pause();videoEl.src='';
  bodyEl.style.zIndex='1';
  if(s.mediaType==='video'&&s.mediaUrl){
    inner.style.background='#000';
    videoEl.src=s.mediaUrl;videoEl.classList.remove('hidden');
    videoEl.play().catch(()=>{});
    bodyEl.textContent=s.text||'';
    bodyEl.style.zIndex='2';
    bodyEl.style.textShadow='0 2px 8px rgba(0,0,0,.8)';
  } else if(s.mediaType==='image'&&s.mediaUrl){
    inner.style.background=`url('${s.mediaUrl}') center/cover no-repeat`;
    bodyEl.textContent=s.text||'';
    bodyEl.style.textShadow='0 2px 8px rgba(0,0,0,.8)';
  } else {
    inner.style.background=s.bg||'var(--panel)';
    bodyEl.textContent=s.text||'';
    bodyEl.style.textShadow='';
  }
  document.getElementById('story-author').innerHTML=`${avatarHTML(s.displayName,s.avatarColor,'avatar-sm')}<span class="dname">${esc(s.displayName)}</span>`;
  const total=g.stories.length;
  let bars='';
  for(let i=0;i<total;i++){bars+=`<div class="story-seg"><div class="story-seg-fill ${i<storyIndex?'done':''}" id="seg-${i}"></div></div>`;}
  document.getElementById('story-progress').innerHTML=bars;
  if(storyIndex<total){
    const fill=document.getElementById(`seg-${storyIndex}`);
    if(fill){fill.style.transition='width 5s linear';requestAnimationFrame(()=>requestAnimationFrame(()=>fill.style.width='100%'));}
  }
  storyTimer=setTimeout(()=>storyNav(1),5100);
}
function storyNav(dir){
  if(storyTimer)clearTimeout(storyTimer);
  const g=storyGroups[storyGroupIndex];if(!g)return;
  if(dir>0){
    if(storyIndex<g.stories.length-1){storyIndex++;showCurrentStory();}
    else if(storyGroupIndex<storyGroups.length-1){storyGroupIndex++;storyIndex=0;showCurrentStory();}
    else closeStoryViewer();
  }else{
    if(storyIndex>0){storyIndex--;showCurrentStory();}
    else if(storyGroupIndex>0){storyGroupIndex--;storyIndex=0;showCurrentStory();}
  }
}
function closeStoryViewer(){
  if(storyTimer)clearTimeout(storyTimer);
  const v=document.getElementById('story-video');if(v){v.pause();v.src='';}
  document.getElementById('story-viewer').classList.add('hidden');
}
function openCreateStoryDialog(){
  storyMediaUrl=null;storyMediaType=null;
  openDialog(`<h2>✨ 新增限時動態</h2>
    <button class="dialog-close" onclick="closeDialog()"><i class="ti ti-x"></i></button>
    <div class="form-group"><label>說些什麼...</label><textarea id="story-text" placeholder="今天發生什麼事？" rows="3"></textarea></div>
    <div class="form-group">

      <div style="display:flex;gap:8px;flex-wrap:wrap" id="bg-picker">
        ${['linear-gradient(135deg,#1e1b4b,#7c3aed)','linear-gradient(135deg,#0c4a6e,#0891b2)','linear-gradient(135deg,#1a1a2e,#e94560)','linear-gradient(135deg,#0f2027,#203a43,#2c5364)','linear-gradient(135deg,#1c1917,#44403c)','linear-gradient(135deg,#052e16,#14532d)','linear-gradient(135deg,#450a0a,#991b1b)','linear-gradient(135deg,#2d1b69,#11998e)'].map((bg,i)=>`<div class="bg-opt" data-bg="${bg}" onclick="selectStoryBg(this,'${bg}')" style="width:40px;height:40px;border-radius:8px;background:${bg};cursor:pointer;border:2px solid ${i===0?'#fff':'transparent'};transition:border-color .2s"></div>`).join('')}
      </div>

    <div id="story-preview" style="height:120px;border-radius:8px;background:linear-gradient(135deg,#1e1b4b,#7c3aed);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;margin-bottom:16px;font-size:14px;overflow:hidden;position:relative">預覽</div>

    </div>`);
  document.getElementById('story-text').addEventListener('input',function(){
    const prev=document.getElementById('story-preview');
    if(prev&&!storyMediaUrl)prev.textContent=this.value||'預覽';
  });
}
function selectStoryBg(el,bg){
  selectedStoryBg=bg;
  document.querySelectorAll('.bg-opt').forEach(e=>e.style.borderColor='transparent');
  el.style.borderColor='#fff';
  const prev=document.getElementById('story-preview');
  if(prev&&!storyMediaUrl)prev.style.background=bg;
}
function submitStory(){
  const txt=document.getElementById('story-text').value.trim();
  if(!txt&&!storyMediaUrl){toast('請輸入故事內容或選擇媒體','error');return}
  const s={id:uid(),userId:session.userId,username:session.username,displayName:session.displayName,avatarColor:session.avatarColor,text:txt,bg:selectedStoryBg,createdAt:Date.now(),seen:[]};
  if(storyMediaUrl){s.mediaUrl=storyMediaUrl;s.mediaType=storyMediaType;}

    }).join('')}</div>`;

}

let analyticsTab='overview';
function renderAnalytics(){
  const uid=session.userId;
  if(!analytics[uid])seedAnalytics();
  const a=analytics[uid];
  const myPosts=posts.filter(p=>p.userId===uid);
  const {keywords,topType,insight,scored}=analyzeTopContent(uid);

  // ── KPI totals ──
  const days=Object.values(a.dailyStats||{});
  const totalViews=days.reduce((s,d)=>s+d.views,0);
  const totalLikes=days.reduce((s,d)=>s+d.likes,0);
  const totalReach=days.reduce((s,d)=>s+d.reach,0);
  const totalFollowers=(a.followerHistory||[]).slice(-1)[0]?.count||0;
  // 7-day vs prev 7-day delta
  const last7=days.slice(-7).reduce((s,d)=>s+d.views,0);
  const prev7=days.slice(-14,-7).reduce((s,d)=>s+d.views,0);
  const delta=prev7>0?Math.round((last7-prev7)/prev7*100):0;

  // ── Bar chart: last 14 days ──
  const last14=Object.entries(a.dailyStats||{}).slice(-14);
  const maxViews=Math.max(...last14.map(([,d])=>d.views),1);
  const barChart=`<div class="bar-chart">${last14.map(([date,d])=>{
    const pct=Math.round(d.views/maxViews*100);
    const isPeak=d.views===Math.max(...last14.map(([,x])=>x.views));
    const label=date.slice(5);// MM-DD
    return `<div class="bar-col">
      <div class="bar-val" style="font-size:8px;color:var(--text3);margin-bottom:2px">${d.views}</div>
      <div class="bar-fill${isPeak?' peak':''}" style="height:${pct}%"></div>
      <div class="bar-lbl">${label}</div>
    </div>`;
  }).join('')}</div>`;

  // ── 24-hour heatmap ──
  const hourly=a.hourlyStats||Array(24).fill(0);
  const maxH=Math.max(...hourly,1);
  const heatmap=`<div class="heatmap">${hourly.map((v,h)=>{
    const op=(v/maxH*0.85+0.08).toFixed(2);
    const isPeak=v===maxH;
    return `<div class="heatmap-cell" data-tip="${h}:00 · ${v}次" style="background:rgba(${isPeak?'236,72,153':'124,58,237'},${op});${isPeak?'box-shadow:0 0 6px rgba(236,72,153,.5)':''}"></div>`;
  }).join('')}</div>
  <div class="heatmap-hours"><span>0時</span><span>6時</span><span>12時</span><span>18時</span><span>23時</span></div>`;
  const peakHour=hourly.indexOf(maxH);

  // ── 7-day bar chart ──
  const wdNames=['一','二','三','四','五','六','日'];
  const maxWd=Math.max(...(a.weekdayStats||[1]),1);
  const wdChart=`<div class="bar-chart">${(a.weekdayStats||Array(7).fill(0)).map((v,i)=>{
    const pct=Math.round(v/maxWd*100);
    const isPeak=v===Math.max(...(a.weekdayStats||[]));
    return `<div class="bar-col">
      <div class="bar-fill${isPeak?' peak':''}" style="height:${pct}%"></div>
      <div class="bar-lbl">週${wdNames[i]}</div>
    </div>`;
  }).join('')}</div>`;

  // ── Traffic sources ──
  const src=a.trafficSources||{home:42,explore:28,profile:15,hashtag:10,share:5};
  const srcTotal=Object.values(src).reduce((s,v)=>s+v,0)||1;
  const srcColors={home:'#7c3aed',explore:'#0ea5e9',profile:'#ec4899',hashtag:'#f97316',share:'#22c55e'};
  const srcNames={home:'首頁動態',explore:'探索頁',profile:'個人主頁',hashtag:'標籤搜尋',share:'分享連結'};
  const trafficHTML=`<div class="traffic-legend">${Object.entries(src).sort((a,b)=>b[1]-a[1]).map(([k,v])=>{
    const pct=Math.round(v/srcTotal*100);
    return `<div class="traffic-item">
      <div class="traffic-dot" style="background:${srcColors[k]||'#888'}"></div>
      <span style="min-width:70px;font-size:12px">${srcNames[k]||k}</span>
      <div class="traffic-bar-wrap"><div class="traffic-bar-fill" style="width:${pct}%;background:${srcColors[k]||'#888'}"></div></div>
      <span class="traffic-pct">${pct}%</span>
    </div>`;
  }).join('')}</div>`;

  // ── Top posts ──
  const topPostsHTML=(scored||[]).map((p,i)=>{
    const views=a.postViews?.[p.id]||0;
    const engRate=views>0?((p.likes?.length||0)+(p.comments||0))/views*100:0;
    const typeIcon={text:'📝',image:'🖼',video:'🎬',poll:'📊'}[p.mediaType||(p.type==='poll'?'poll':'text')]||'📝';
    return `<div class="top-post-item" onclick="navigate('home')">
      <div style="display:flex;align-items:flex-start;gap:10px">
        <div class="top-post-rank">${['🥇','🥈','🥉','4','5'][i]||i+1}</div>
        <div style="flex:1">
          <div style="font-size:12px;color:var(--text2);line-height:1.5;margin-bottom:6px">${typeIcon} ${esc(p.content.slice(0,60))}${p.content.length>60?'…':''}</div>
          <div class="top-post-stats">
            <span class="top-post-stat">👁 ${views} 次瀏覽</span>
            <span class="top-post-stat">❤️ ${p.likes?.length||0}</span>
            <span class="top-post-stat">💬 ${p.comments||0}</span>
            <span class="top-post-stat">📈 ${engRate.toFixed(1)}% 互動率</span>
          </div>
        </div>
      </div>
    </div>`;
  }).join('')||'<div style="text-align:center;padding:20px;color:var(--text3)">尚無貼文數據</div>';

  // ── Creator insights ──
  const typeNames2={text:'純文字',image:'圖片貼文',video:'影片',poll:'投票'};
  const insightHTML=`
  <div class="insight-card">
    <h4>🤖 AI 內容分析</h4>
    <p style="font-size:12px;color:var(--text2);margin-bottom:8px">${esc(insight)}</p>
    ${keywords.length?`<div>高效關鍵詞：${keywords.map(k=>`<span class="insight-tag">${esc(k)}</span>`).join('')}</div>`:''}
  </div>
  <div class="insight-card" style="background:linear-gradient(135deg,rgba(249,115,22,.12),rgba(239,68,68,.08));border-color:rgba(249,115,22,.25)">
    <h4>⏰ 最佳發文時間</h4>
    <p style="font-size:12px;color:var(--text2)">根據你的受眾活躍數據，建議在 <strong style="color:var(--orange)">${peakHour}:00–${peakHour+2}:00</strong> 發文，觸及率最高可達平均值的 <strong style="color:var(--orange)">${Math.round(hourly[peakHour]/Math.max(1,...hourly.map((v,i)=>i!==peakHour?v:0))*10)/10}×</strong></p>
  </div>
  <div class="insight-card" style="background:linear-gradient(135deg,rgba(34,197,94,.1),rgba(20,184,166,.08));border-color:rgba(34,197,94,.25)">
    <h4>📱 內容類型表現</h4>
    ${Object.entries(a.contentTypePerf||{}).map(([t,v])=>`
    <div style="display:flex;justify-content:space-between;font-size:12px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.06)">
      <span>${typeNames2[t]||t}</span>
      <span style="color:var(--teal)">平均 ${Math.round(v.views/(v.count||1))} 次瀏覽 · ❤️ ${v.avgLikes}</span>
    </div>`).join('')}
  </div>`;

  // ── Follower growth ──
  const fhData=(a.followerHistory||[]).slice(-14);
  const maxF=Math.max(...fhData.map(d=>d.count),1);
  const minF=Math.min(...fhData.map(d=>d.count),0);
  const followerChart=`<div class="bar-chart" style="height:70px">${fhData.map(d=>{
    const pct=Math.round((d.count-minF)/(maxF-minF+1)*100);
    return `<div class="bar-col">
      <div class="bar-fill" style="height:${Math.max(pct,5)}%;background:linear-gradient(180deg,#22c55e,#14b8a6)"></div>
      <div class="bar-lbl">${d.date.slice(8)}</div>
    </div>`;
  }).join('')}</div>`;

  // ── Tab rendering ──
  const tabs=['overview','posts','audience','insights'];
  const tabNames={overview:'總覽',posts:'貼文',audience:'受眾',insights:'洞察'};
  const tabContent={
    overview:`
      <div class="analytics-overview">
        <div class="analytics-kpi"><div class="kpi-val">${totalViews.toLocaleString()}</div><div class="kpi-label">30天總觸及</div><div class="kpi-delta ${delta>=0?'kpi-up':'kpi-down'}">${delta>=0?'↑':'↓'}${Math.abs(delta)}% vs 上週</div></div>
        <div class="analytics-kpi"><div class="kpi-val">${totalReach.toLocaleString()}</div><div class="kpi-label">總覆蓋人數</div></div>
        <div class="analytics-kpi"><div class="kpi-val">${totalLikes.toLocaleString()}</div><div class="kpi-label">累積按讚</div></div>
        <div class="analytics-kpi"><div class="kpi-val">${totalFollowers.toLocaleString()}</div><div class="kpi-label">追蹤者總數</div></div>
      </div>
      <div class="analytics-section"><div class="analytics-section-title">📈 每日瀏覽量（近14天）</div>${barChart}</div>
      <div class="analytics-section"><div class="analytics-section-title">🚦 流量來源</div>${trafficHTML}</div>`,
    posts:`
      <div class="analytics-section"><div class="analytics-section-title">🏆 表現最好的貼文</div>${topPostsHTML}</div>`,
    audience:`
      <div class="analytics-section"><div class="analytics-section-title">📅 每週活躍分布</div>${wdChart}</div>
      <div class="analytics-section"><div class="analytics-section-title">⏱ 24小時互動熱力圖 <span style="font-size:11px;color:var(--text3)">（顏色越深流量越高）</span></div>${heatmap}<div style="text-align:center;font-size:12px;color:var(--accent2);margin-top:6px;font-weight:600">🔥 高峰時段：${peakHour}:00–${peakHour+2}:00</div></div>
      <div class="analytics-section"><div class="analytics-section-title">📊 追蹤者成長（近14天）</div>${followerChart}</div>`,
    insights:insightHTML
  };

  return `
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
    <button class="back-btn" onclick="navigate('settings')" style="margin:0">← 返回設定</button>
    <div style="font-size:18px;font-weight:800">📊 個人數據後台</div>
    <button class="btn btn-ghost btn-sm" style="margin-left:auto;font-size:12px" onclick="seedAnalytics();renderPage('analytics')">🔄 重新整理</button>
  </div>
  <!-- Creator badges -->
  <div class="creator-badges">
    <div class="creator-badge"><span class="badge-icon">🔥</span><span>連續發文 <strong>${Math.floor(Math.random()*14+3)}</strong> 天</span></div>
    <div class="creator-badge"><span class="badge-icon">⭐</span><span>創作者積分 <strong>${(totalLikes*3+totalViews).toLocaleString()}</strong></span></div>
    <div class="creator-badge"><span class="badge-icon">📈</span><span>本週觸及 <strong>${last7.toLocaleString()}</strong></span></div>
  </div>
  <!-- Tabs -->
  <div class="analytics-tab">${tabs.map(t=>`<div class="analytics-tab-btn ${analyticsTab===t?'active':''}" onclick="setAnalyticsTab('${t}')">${tabNames[t]}</div>`).join('')}</div>
  <div id="analytics-content">${tabContent[analyticsTab]||''}</div>`;
}
function setAnalyticsTab(tab){
  analyticsTab=tab;
  const el=document.getElementById('analytics-content');
  // Re-render just the tab content
  if(el)renderPage('analytics');
}

function toggleSetting(id){document.getElementById(id).classList.toggle('on');toast('設定已更新','success')}

// ── Instagram-style settings helpers ──
function toggleSettingsPanel(id){
  const p=document.getElementById(id);if(!p)return;
  p.classList.toggle('open');
}
function toggleBoolSetting(key,toggleId){
  const sets=JSON.parse(localStorage.getItem('bv_settings')||'{}');
  sets[key]=!sets[key];
  localStorage.setItem('bv_settings',JSON.stringify(sets));
  const el=document.getElementById(toggleId);
  if(el)el.classList.toggle('on',sets[key]);
  toast('設定已更新','success');
}
function saveSetting(key,val){
  const sets=JSON.parse(localStorage.getItem('bv_settings')||'{}');
  sets[key]=val;localStorage.setItem('bv_settings',JSON.stringify(sets));
  toast('設定已更新','success');
}
function setAccentColor(color){
  document.documentElement.style.setProperty('--accent',color);
  saveSetting('accentColor',color);
  renderPage('settings');
  toast('主題色彩已更新','success');
}
function saveProfile(){
  const name=(document.getElementById('set-name')||{}).value?.trim();
  const bio=(document.getElementById('set-bio')||{}).value?.trim();
  if(name){
    const u=users.find(x=>x.id===session.userId);
    if(u){u.displayName=name;if(bio!==undefined)u.bio=bio;saveUsers();}
    session.displayName=name;saveSession();renderSidebarUser();
  }
  toast('個人資料已更新','success');
  renderPage('settings');
}
function saveDisplayName(){
  const name=(document.getElementById('set-name')||{}).value?.trim();
  if(!name){toast('名稱不得為空','error');return}
  const u=users.find(x=>x.id===session.userId);
  if(u){u.displayName=name;saveUsers();}
  session.displayName=name;saveSession();renderSidebarUser();toast('顯示名稱已更新','success');
}
function changeUsername(){
  const newu=(document.getElementById('set-username')||{}).value?.trim().toLowerCase().replace(/[^a-z0-9_]/g,'');
  if(!newu){toast('請輸入有效帳號','error');return}
  if(users.find(x=>x.username===newu&&x.id!==session.userId)){toast('帳號已被使用','error');return}
  const u=users.find(x=>x.id===session.userId);
  if(u){u.username=newu;saveUsers();}
  session.username=newu;saveSession();renderSidebarUser();
  toast('帳號名稱已更新','success');renderPage('settings');
}
function changePassword(){
  const oldp=document.getElementById('set-oldpass').value;
  const newp=document.getElementById('set-newpass').value;
  const newp2=document.getElementById('set-newpass2').value;
  const u=users.find(x=>x.id===session.userId);
  if(!u){toast('找不到用戶','error');return}
  if(u.password!==btoa(oldp)){toast('目前密碼不正確','error');return}
  if(newp!==newp2){toast('新密碼不一致','error');return}
  if(newp.length<6){toast('密碼至少6位','error');return}
  u.password=btoa(newp);saveUsers();
  document.getElementById('set-oldpass').value='';
  document.getElementById('set-newpass').value='';
  document.getElementById('set-newpass2').value='';
  toast('密碼已更新','success');
}
function confirmDeleteAccount(){
  openDialog(`<h2 style="color:#ef4444">⚠️ 確認刪除帳號</h2>
    <button class="dialog-close" onclick="closeDialog()"><i class="ti ti-x"></i></button>
    <p style="margin-bottom:20px;color:var(--text2)">此操作無法復原。所有貼文、故事和個人資料將永久刪除。</p>
    <div class="form-group"><label>請輸入你的帳號確認</label><input id="del-confirm" type="text" placeholder="${esc(session.username)}"/></div>
    <div class="dialog-footer">
      <button class="btn btn-ghost" onclick="closeDialog()">取消</button>
      <button class="btn btn-danger" onclick="deleteAccount()">確認刪除</button>
    </div>`);
}
function deleteAccount(){
  const val=document.getElementById('del-confirm').value.trim();
  if(val!==session.username){toast('帳號名稱不符','error');return}
  users=users.filter(u=>u.id!==session.userId);
  posts=posts.filter(p=>p.userId!==session.userId);
  saveUsers();savePosts();closeDialog();doLogout();
  toast('帳號已刪除','info');
}

function _applyIcons(root){
  (root||document).querySelectorAll('i.ti').forEach(el=>{
    for(const c of el.classList){
      if(c!=='ti'&&_ICONS[c]){el.textContent=_ICONS[c];break;}
    }
  });
}
const _obs=new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>{
  if(n.nodeType===1){_applyIcons(n);}
})));
_obs.observe(document.documentElement,{childList:true,subtree:true});
